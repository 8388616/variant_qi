                        if (msg.mode === 'respond' && msg.proposal) showTimeControlRespond(msg.proposal);
                        else showTimeControlProposal();
                        break;
                    case 'timeControlWaitPeer':
                        showTimeControlWait(msg.text || '等待对方确认…');
                        break;
                    case 'timeControlAgreed':
                        if (!ps.matchTime) ps.matchTime = {};
                        ps.matchTime.settings = msg.settings || null;
                        ps.matchTime.clock = msg.clock || null;
                        ps.matchStarted = true;
                        hideTimeControlModal();
                        updateTurn();
                        break;
                    case 'timeControlReset':
                        ps.matchTime = null;
                        ps.matchStarted = false;
                        hideTimeControlModal();
                        updateTurn();
                        break;
                    case 'clockUpdate':
                        if (!ps.matchTime) ps.matchTime = {};
                        ps.matchTime.clock = msg.clock || null;
                        updateTimerPanel();
                        break;
                    case 'broadcast':
                        if (msg.action === 'move' || msg.action === 'undoAccept' || msg.action === 'resign' || msg.action === 'drawAgreed' || msg.action === 'timeLoss') {
                            const wasOver = ps.gameOver;
                            syncFromState(msg);
                            if (msg.gameOver && !wasOver) {
                                if (msg.action === 'timeLoss') {
                                    const loser = msg.player === 'black' ? '黑方' : '白方';
                                    const winText = msg.winner === 'black' ? '黑胜' : (msg.winner === 'white' ? '白胜' : '和棋');
                                    alert(`${loser}超时，${winText}。`);
                                } else if (msg.winner === 'black') alert('黑胜。');
                                else if (msg.winner === 'white') alert('白胜。');
                                else if (msg.winner === 'draw') alert('和棋。');
                            } else if (msg.action === 'drawAgreed' && !wasOver) alert('和棋。');
                            else if (msg.action === 'resign' && !wasOver) {
                                alert((msg.player === 'black' ? '黑方' : '白方') + '认输');
                            }
                        }
                        updateRadioStyles();
                        break;
                    case 'newGameStarted':
                        ps.mySlot = null;
                        colorStatus.textContent = '观战';
                        ps.slots = { black: false, white: false };
                        ps.matchStarted = false;
                        ps.matchStartedOnce = false;
                        ps.matchTime = null;
                        hideTimeControlModal();
                        exitReplayMode();
                        clearSelection();
                        syncFromState(msg);
                        updateRadioStyles();
                        break;
                    case 'importSuccess':
                        exitReplayMode();
                        syncFromState(msg);
                        if (msg.replayData && msg.replayData.moves && msg.replayData.moves.length)
                            enterReplayMode();
                        updateRadioStyles();
                        break;
                    case 'roomReset':
                        exitReplayMode();
                        ps.matchStarted = false;
                        ps.matchStartedOnce = false;
                        ps.matchTime = null;
                        hideTimeControlModal();
                        syncFromState(msg);
                        updateRadioStyles();
                        break;
                    case 'error':
                        if (msg.message) alert(msg.message);
                        break;
                    case 'newGameRequest':
                        if (confirm('对方请求开始新的一局，是否同意？')) ps.ws.send(JSON.stringify({ type: 'newGameResponse', accept: true }));
                        else ps.ws.send(JSON.stringify({ type: 'newGameResponse', accept: false }));
                        break;
                    case 'undoRequest':
                        if (confirm('对方请求悔棋，是否同意？')) ps.ws.send(JSON.stringify({ type: 'undoResponse', accept: true }));
                        else ps.ws.send(JSON.stringify({ type: 'undoResponse', accept: false }));
                        break;
                    case 'drawRequest':
                        if (confirm('对方申请和棋，是否同意？')) ps.ws.send(JSON.stringify({ type: 'drawResponse', accept: true }));
                        else ps.ws.send(JSON.stringify({ type: 'drawResponse', accept: false }));
                        break;
                    case 'gameRecord': {
                        const data = msg.data;
                        if (data && (data.boardSize == null || data.boardSize === ''))
                            data.boardSize = N;
                        QiSquareWeiqiCanvas.downloadWeiqiJsonRecord(data, '路墙棋');
                        break;
                    }
                    default:
                        break;
                }
            }

            function connectWebSocket() {
                if (ps.reconnectTimer) {
                    clearTimeout(ps.reconnectTimer);
                    ps.reconnectTimer = null;
                }
                ps.ws = QiSquareWeiqiCanvas.connectWeiqiRoomWebSocket({
                    gameType,
                    roomId,
                    roomPassword,
                    onMessage: handleMessage,
                    colorStatus,
                    connectWebSocket,
                    clearReconnectTimer: () => {
                        if (ps.reconnectTimer) {
                            clearTimeout(ps.reconnectTimer);
                            ps.reconnectTimer = null;
                        }
                    },
                    getReconnectTimer: () => ps.reconnectTimer,
                    setReconnectTimer: (t) => { ps.reconnectTimer = t; }
                });
            }

            radioBlack.addEventListener('change', () => {
                if (radioBlack.checked && ps.ws && ps.ws.readyState === 1)
                    ps.ws.send(JSON.stringify({ type: 'selectColor', color: 'black' }));
            });
            radioWhite.addEventListener('change', () => {
                if (radioWhite.checked && ps.ws && ps.ws.readyState === 1)
                    ps.ws.send(JSON.stringify({ type: 'selectColor', color: 'white' }));
            });

            function tcCollectPayload() {
                const mode = document.querySelector('input[name="tcTimed"]:checked');
                const timed = !mode || mode.value === 'timed';
                if (!timed) return { timed: false };
                return {
                    timed: true,
                    mainMinutes: Number(tcMainMinutes.value),
                    byoyomiSeconds: Number(tcByoSeconds.value),
                    maxTimeouts: Number(tcTimeouts.value)
                };
            }

            tcPrimary.addEventListener('click', () => {
                if (!ps.ws || ps.ws.readyState !== 1) return;
                if (tcPrimary.textContent === '确认') {
                    ps.ws.send(JSON.stringify({ type: 'timeControlAccept' }));
                    showTimeControlWait('正在等待服务器确认…');
                    return;
                }
                ps.ws.send(JSON.stringify({ type: 'timeControlSubmit', ...tcCollectPayload() }));
                showTimeControlWait('正在等对方确认');
            });

            tcSecondary.addEventListener('click', () => {
                enableTimeControlInputs();
                tcPrimary.textContent = '提交';
                tcSecondary.style.display = 'none';
                tcHint.textContent = '你可以调整后重新提交。';
            });

            document.getElementById('newGameBtn').onclick = () => {
                if (ps.ws && ps.ws.readyState === 1) ps.ws.send(JSON.stringify({ type: 'requestNewGame' }));
            };
            document.getElementById('undoBtn').onclick = () => {
                if (ps.ws && ps.ws.readyState === 1) ps.ws.send(JSON.stringify({ type: 'requestUndo' }));
            };
            document.getElementById('resignBtn').onclick = () => {
                if (ps.ws && ps.ws.readyState === 1) ps.ws.send(JSON.stringify({ type: 'resign' }));
            };
            document.getElementById('drawBtn').onclick = () => {
                if (ps.ws && ps.ws.readyState === 1) ps.ws.send(JSON.stringify({ type: 'requestDraw' }));
            };
            document.getElementById('exportBtn').onclick = () => {
                if (ps.ws && ps.ws.readyState === 1) ps.ws.send(JSON.stringify({ type: 'exportRecord' }));
            };
            document.getElementById('importBtn').onclick = () => document.getElementById('importFileInput').click();
            document.getElementById('importFileInput').onchange = (e) => {
                const f = e.target.files && e.target.files[0];
                if (!f) return;
                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const data = JSON.parse(reader.result);
                        if (ps.ws && ps.ws.readyState === 1) ps.ws.send(JSON.stringify({ type: 'importRecord', data }));
                    } catch (err) {
                        alert('文件解析失败');
                    }
                    e.target.value = '';
                };
                reader.readAsText(f);
            };

            document.getElementById('helpBtn').onclick = () => { document.getElementById('rulesModal').style.display = 'flex'; };
            document.getElementById('closeRulesBtn').onclick = () => { document.getElementById('rulesModal').style.display = 'none'; };
            document.getElementById('backToLobbyBtn').onclick = () => { window.location.href = '/qi'; };

            const replaySlider = document.getElementById('replaySlider');
            replaySlider.addEventListener('input', () => {
                const v = parseInt(replaySlider.value, 10);
                if (ps.tryPlayMode) setTryPlayStep(v);
                else setReplayStep(v);
            });
            document.getElementById('replayBackBtn').onclick = () => {
                if (ps.tryPlayMode) setTryPlayStep(ps.tryPlayStep - 1);
                else if (ps.replayMode) setReplayStep(ps.replayStep - 1);
                else setReplayStep(ps.moveLog.length - 1);
            };
            document.getElementById('replayForwardBtn').onclick = () => {
                if (ps.tryPlayMode) setTryPlayStep(ps.tryPlayStep + 1);
                else if (!ps.replayMode) return;
                else setReplayStep(ps.replayStep + 1);
            };
            {
                const tpBtn = document.getElementById('tryPlayBtn');
                if (tpBtn) {
                    tpBtn.onclick = () => {
                        if (ps.tryPlayMode) exitTryPlay();
                        else enterTryPlay();
                    };
                }
            }

            canvas.addEventListener('click', (e) => {
                handleCanvasClick(e.clientX, e.clientY);
                drawBoard();
            });
            canvas.addEventListener('touchend', (e) => {
                if (e.changedTouches.length !== 1) return;
                const t = e.changedTouches[0];
                handleCanvasClick(t.clientX, t.clientY);
                drawBoard();
                e.preventDefault();
            }, { passive: false });

            if (isMouseDevice) {
                canvas.addEventListener('mousemove', (e) => {
                    updateHoverFromClient(e.clientX, e.clientY);
                    drawBoard();
                });
                canvas.addEventListener('mouseleave', () => {
                    ps.hoverCellR = -1;
                    ps.hoverCellC = -1;
                    ps.hoverWall = null;
                    ps.hoverPawnDest = null;
                    drawBoard();
                });
            }

            wallSlotsRefresh();
            syncFromState(Q.initialState());
            updateRadioStyles();
            connectWebSocket();
        })();
    </script>
</body>
</html>
