# katago match：两个 NN 相同搜索设置对弈（路径由 scripts/match_two_models.ps1 替换占位符）。
# 与二气 9 路自对弈数据一致：9 路棋盘、19 路 NN 张量。

logToStdout = true
logTimeStamp = true
logConfigContents = false
logSearchInfo = false
logMoves = false
maxMovesPerGame = 1600

numBots = 2
botName0 = ModelA
botName1 = ModelB

nnModelFile0 = __MODEL_A__
nnModelFile1 = __MODEL_B__

nnMaxBatchSize = 256
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 16
nnRandomize = true

bSizes = 9
bSizeRelProbs = 1
allowRectangleProb = 0.0

maxBoardXSizeForNNBuffer = 19
maxBoardYSizeForNNBuffer = 19
requireMaxBoardSize = false

koRules = POSITIONAL
scoringRules = AREA
taxRules = NONE
multiStoneSuicideLegals = true
hasButtons = false

komiMean = 6.0
komiStdev = 0.0
handicapProb = 0.0
handicapCompensateKomiProb = 0.0

numGameThreads = 4
logGamesEvery = 50
numGamesTotal = 200

allowResignation = true
resignThreshold = -0.99
resignConsecTurns = 3

# ---- 双方相同（可用 -override-config 改 maxVisits0/1）----
numSearchThreads0 = 2
numSearchThreads1 = 2
maxVisits0 = 400
maxVisits1 = 400
maxPlayouts0 = 400
maxPlayouts1 = 400
chosenMoveTemperature0 = 0.1
chosenMoveTemperature1 = 0.1
chosenMoveTemperatureEarly0 = 0.3
chosenMoveTemperatureEarly1 = 0.3
chosenMoveTemperatureHalflife0 = 19
chosenMoveTemperatureHalflife1 = 19
rootNoiseEnabled0 = false
rootNoiseEnabled1 = false
useLcbForSelection0 = true
useLcbForSelection1 = true

nodeTableShardsPowerOfTwo = 16
numVirtualLossesPerThread = 1
