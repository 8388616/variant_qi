# katago match：Strong（正常搜索） vs WeakRandom（1 visit + 根节点 Dirichlet 权重 1.0）
# WeakRandom 不是「在合法点均匀随机」，而是 NN 先验上的高熵 Dirichlet 采样 + 极浅搜索，用作弱基线。
# nnModelFile0/1 由 scripts/match_vs_randomish.ps1 写入临时配置（占位符 __SNUBQUADRANGLE_MODEL_PATH__；两路同一模型便于 dedup 加载）。

logToStdout = true
logTimeStamp = true
logConfigContents = false
logSearchInfo = false
logMoves = false
maxMovesPerGame = 1600

numBots = 2
botName0 = Strong
botName1 = WeakRandom

nnModelFile0 = __SNUBQUADRANGLE_MODEL_PATH__
nnModelFile1 = __SNUBQUADRANGLE_MODEL_PATH__

nnMaxBatchSize = 128
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 16
nnRandomize = true

# 与 training/selfplay.cfg 一致：扭棱四角、多路数 lanes、19 路 NN 张量
snubQuadrangleBoard = true
bSizes = 3,4,5,6,7
bSizeRelProbs = 0.05,0.35,0.35,0.15,0.1

maxBoardXSizeForNNBuffer = 19
maxBoardYSizeForNNBuffer = 19
requireMaxBoardSize = false

koRules = POSITIONAL
scoringRules = AREA
taxRules = NONE
multiStoneSuicideLegals = true
hasButtons = false

komiMean = 5.5
komiStdev = 4.0
handicapProb = 0.05
handicapCompensateKomiProb = 0.50
# match 的 createGame 不允许配置非零的 drawRandRadius / noResultStdev（仅 selfplay 带 SearchParams 路径可用）；勿从 selfplay.cfg 照搬这两项。

numGameThreads = 4
logGamesEvery = 50
numGamesTotal = 200

allowResignation = true
resignThreshold = -0.99
resignConsecTurns = 3

# ---- Strong：可调（脚本 -override-config 覆盖 maxVisits0/maxPlayouts0）----
numSearchThreads0 = 2
maxVisits0 = 300
maxPlayouts0 = 300
chosenMoveTemperature0 = 0.1
chosenMoveTemperatureEarly0 = 0.3
chosenMoveTemperatureHalflife0 = 19
rootNoiseEnabled0 = false
useLcbForSelection0 = true

# ---- WeakRandom：近似乱下 ----
numSearchThreads1 = 1
maxVisits1 = 1
maxPlayouts1 = 1
rootNoiseEnabled1 = true
rootDirichletNoiseWeight1 = 1.0
rootDirichletNoiseTotalConcentration1 = 2.0
rootPolicyTemperature1 = 1.0
rootPolicyTemperatureEarly1 = 1.0
chosenMoveTemperature1 = 5.0
chosenMoveTemperatureEarly1 = 5.0
chosenMoveTemperatureHalflife1 = 1
useLcbForSelection1 = false
rootFpuReductionMax1 = 0.0

nodeTableShardsPowerOfTwo = 16
numVirtualLossesPerThread = 1
