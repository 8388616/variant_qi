# Snub-quadrangle weiqi selfplay: bSizes = lane counts (2..8); grid edge = 3*lanes-2 (see README).
# Training rows use a square pos-len tensor (e.g. 19); same as upstream multisize pattern.

logSearchInfo = false
logMoves = false
maxMovesPerGame = 1600
logToStdout = true
logConfigContents = false

# selfplay.cpp 必填（缺 getString/getInt 会报错；与官方 selfplay 配置一致）
maxDataQueueSize = 16384
maxRowsPerTrainFile = 75000
firstFileRandMinProp = 0.15
# Log every N game *starts* (SelfplayManager): e.g. 100 -> periodic "Started N games with ...".
logGamesEvery = 100
switchNetsMidGame = false

# 是否每局往同一個 .sgfs 追加（預設 true，與上游一致）。在 selfplay 主流程讀取；若日誌仍報 Unused key，代表
# 跑的 katago.exe 不是含此讀取邏輯的編譯結果，請重新 cmake build。訓練吞吐可設 false。
selfplayAppendSgfGames = false

snubQuadrangleBoard = true
bSizes = 2,3,4,5,6,7
bSizeRelProbs = 0.005,0.1,0.245,0.3,0.2,0.15

# 写出训练行的边长（须与训练 python -pos-len 一致）
dataBoardLen = 19

# NN 输入缓冲上限（≥ dataBoardLen；可与 pos-len 相同）
maxBoardXSizeForNNBuffer = 19
maxBoardYSizeForNNBuffer = 19

# 仅 9 路时 min=max，默认会开启「NN 与棋盘边长必须一致」；此处要对 9 路棋用 19 路张量，必须关掉。
# 注意：配置项名叫 requireMaxBoardSize，实际对应 C++ 里的 requireExactNNLen；设为 false = 允许更小棋盘。
requireMaxBoardSize = false

# ---- 神经网络（selfplay 为 SETUP_FOR_OTHER，无内置默认，必须写明）----
# nnMaxBatchSize：单卡一批上限；宜 >= numSearchThreads * numGameThreads（自对弈并行）
nnMaxBatchSize = 128
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 16
nnRandomize = true

# ---- 规则----
koRules = POSITIONAL
scoringRules = AREA
taxRules = NONE
multiStoneSuicideLegals = true
hasButtons = false

# GTP / Sabaki 等请改用 cpp/configs/gtp.cfg（须含 koRule、scoringRule 等单数字段）；
# 自对弈只认上面 koRules 一组；勿在此重复写单数规则键，以免 unused 警告。

komiMean = 5.5
komiStdev = 4.0
handicapProb = 0.05
handicapCompensateKomiProb = 0.50
forkCompensateKomiProb = 0.80
sgfCompensateKomiProb = 0.90
komiBigStdevProb = 0.12
komiBigStdev = 9.0
komiBiggerStdevProb = 0.03
komiBiggerStdev = 14.0
# 空盘调贴目时随机以白方视角补偿（与官方分布式默认 0.25 同思路，略保守）
flipKomiProbWhenNoCompensate = 0.25

drawRandRadius = 0.5
noResultStdev = 0.166666666

# ---- Selfplay / 搜索线程（按 CPU/GPU 改）----
numGameThreads = 128
numSearchThreads = 1
maxVisits = 500

# ---- 与 task_example 相近的 root 噪声与温度（可删改）----
initGamesWithPolicy = true
policyInitAreaProp = 0.04
compensateAfterPolicyInitProb = 0.2
sidePositionProb = 0.020

earlyForkGameProb = 0.01
earlyForkGameExpectedMoveProp = 0.025
forkGameProb = 0.06
forkGameMinChoices = 3
earlyForkGameMaxChoices = 12
forkGameMaxChoices = 36

cheapSearchProb = 0
cheapSearchVisits = 200
cheapSearchTargetWeight = 0.0

reduceVisits = true
reduceVisitsThreshold = 0.9
reduceVisitsThresholdLookback = 3
reducedVisitsMin = 280
reducedVisitsWeight = 0.1

handicapAsymmetricPlayoutProb = 0.5
normalAsymmetricPlayoutProb = 0.01
maxAsymmetricRatio = 8.0
minAsymmetricCompensateKomiProb = 0.4

policySurpriseDataWeight = 0.5
valueSurpriseDataWeight = 0.1

# Lead targets for training rows: each hit runs computeLead() (extra small searches). Official selfplay2 uses 0.05;
# values like 0.55 make selfplay vastly slower than typical distributed configs — not a GPU bug.
estimateLeadProb = 0.08
fancyKomiVarying = true

chosenMoveTemperatureEarly = 0.75
chosenMoveTemperatureHalflife = 19
chosenMoveTemperature = 0.15
chosenMoveSubtract = 0
chosenMovePrune = 1

rootNoiseEnabled = true
rootDirichletNoiseTotalConcentration = 10.83
rootDirichletNoiseWeight = 0.25

rootDesiredPerChildVisitsCoeff = 2
# Official / distributed defaults often use 1. Values >1 run averageMultipleSymmetries at the root each move
# (several extra full NN passes per move) and can dominate wall time vs peers using 1.
rootNumSymmetriesToSample = 1

useLcbForSelection = true
lcbStdevs = 5.0
minVisitPropForLCB = 0.15

winLossUtilityFactor = 1.0
staticScoreUtilityFactor = 0.10
dynamicScoreUtilityFactor = 0.30
dynamicScoreCenterZeroWeight = 0.25
dynamicScoreCenterScale = 0.50
noResultUtilityForWhite = 0.0
drawEquivalentWinsForWhite = 0.5

rootEndingBonusPoints = 0.5
rootPruneUselessMoves = true

rootPolicyTemperatureEarly = 1.25
rootPolicyTemperature = 1.1

cpuctExploration = 1.1
cpuctExplorationLog = 0.0
fpuReductionMax = 0.2
rootFpuReductionMax = 0.0
fpuParentWeightByVisitedPolicy = true
valueWeightExponent = 0.25
subtreeValueBiasFactor = 0.45
subtreeValueBiasWeightExponent = 0.85
useGraphSearch = true

nodeTableShardsPowerOfTwo = 16
numVirtualLossesPerThread = 1
