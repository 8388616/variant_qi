# Fast match training labels (katago match -output-dir + loadForSelfplay).
# Loaded after match.cfg and overrides search to match selfplay+overrides_fast throughput.
# Dual-net on one GPU: training_loop also caps numGameThreads (see Get-LoopMatchKatagoOverrideString).

# ---- Snub board + npz writer (match.cpp reads dataBoardLen / maxRowsPerTrainFile) ----
snubQuadrangleBoard = true
bSizes = 5,6,7
bSizeRelProbs = 0.15,0.35,0.50
dataBoardLen = 19
maxBoardXSizeForNNBuffer = 19
maxBoardYSizeForNNBuffer = 19
requireMaxBoardSize = false
maxRowsPerTrainFile = 75000
firstFileRandMinProp = 0.15

drawRandRadius = 0.5
noResultStdev = 0.166666666

# ---- PlaySettings::loadForSelfplay (required keys; tuned for speed) ----
initGamesWithPolicy = false
policyInitAreaProp = 0.04
compensateAfterPolicyInitProb = 0
sidePositionProb = 0

earlyForkGameProb = 0
earlyForkGameExpectedMoveProp = 0.025
forkGameProb = 0
forkGameMinChoices = 3
earlyForkGameMaxChoices = 12
forkGameMaxChoices = 36

cheapSearchProb = 0
cheapSearchVisits = 200
cheapSearchTargetWeight = 0

reduceVisits = false
reduceVisitsThreshold = 0.9
reduceVisitsThresholdLookback = 3
reducedVisitsMin = 200
reducedVisitsWeight = 0.1

handicapAsymmetricPlayoutProb = 0
normalAsymmetricPlayoutProb = 0
maxAsymmetricRatio = 2
minAsymmetricCompensateKomiProb = 0

policySurpriseDataWeight = 0
valueSurpriseDataWeight = 0

# computeLead() per row — main match slowdown when copied from selfplay.cfg
estimateLeadProb = 0
fancyKomiVarying = false

# ---- Search: align with selfplay.cfg + overrides_fast (match.cfg defaults 6 threads / 700 visits are much slower) ----
numSearchThreads = 1
maxVisits = 600
maxPlayouts = 600
