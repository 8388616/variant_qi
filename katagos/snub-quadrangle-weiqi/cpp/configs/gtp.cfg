# 二气围棋 — GTP / 人机对弈用（Sabaki、KaTrain、Lizzie 等）
#
# GTP 启动时会调用 Setup::loadSingleRules：须使用下面「单数」规则键
# （koRule / scoringRule / …），或改用一行 rules = …；不可沿用自对弈的
# koRules / scoringRules 列表形式。
#
# 使用示例：
#   katago.exe gtp -model data\models\...\model.bin.gz -config cpp\configs\biliberty\gtp.cfg

koRule = POSITIONAL
scoringRule = AREA
taxRule = NONE
multiStoneSuicideLegal = true
hasButton = false
friendlyPassOk = false
whiteHandicapBonus = 0

# ---- 日志 ----
logDir = gtp_logs
logAllGTPCommunication = false
logSearchInfo = false
logSearchInfoForChosenMove = false
logToStderr = false

# ---- 棋盘默认（GUI 仍会发 boardsize；此处便于本地命令行试跑）----
defaultBoardSize = 9

# ---- 多尺寸 NN（与 selfplay.cfg / README.multisize.txt 一致）----
maxBoardXSizeForNNBuffer = 19
maxBoardYSizeForNNBuffer = 19
requireMaxBoardSize = false

# ---- 神经网络 ----
nnMaxBatchSize = 128
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 16
nnRandomize = true

# ---- 搜索（可按 benchmark 调整 numSearchThreads）----
numSearchThreads = 8
maxVisits = 800
ponderingEnabled = true

# 人机对弈：关闭自对弈式根节点噪声，着法更稳定
rootNoiseEnabled = false
chosenMoveTemperature = 0.10
chosenMoveTemperatureEarly = 0.50
chosenMoveTemperatureHalflife = 19

useLcbForSelection = true
lcbStdevs = 5.0
minVisitPropForLCB = 0.15

winLossUtilityFactor = 1.0
# 「静态」目数效用（中心为 0）；与 dynamic 目数效用相加后并入 NN 总效用（见 searchhelpers getScoreUtility）。
# cfg 未写时 Setup 默认 0.1；本项目 training/selfplay.cfg 显式为 0 则自对弈全为 0。人机单独调高可压损目填子，但与自对弈侧重略不一致。
staticScoreUtilityFactor = 0.10
dynamicScoreUtilityFactor = 0.30
dynamicScoreCenterZeroWeight = 0.25
dynamicScoreCenterScale = 0.50
noResultUtilityForWhite = 0.0
drawEquivalentWinsForWhite = 0.5

cpuctExploration = 1.1
cpuctExplorationLog = 0.0
fpuReductionMax = 0.2
rootFpuReductionMax = 0.0
fpuParentWeightByVisitedPolicy = true
valueWeightExponent = 0.25
subtreeValueBiasFactor = 0.45
subtreeValueBiasWeightExponent = 0.85
useGraphSearch = true

nodeTableShardsPowerOfTwo = 16
numVirtualLossesPerThread = 1

rootPolicyTemperatureEarly = 1.1
rootPolicyTemperature = 1.0
rootEndingBonusPoints = 0.5
rootPruneUselessMoves = true

# 与 selfplay.cfg 一致，避免人机对弈与训练时 pass/终局 NN 输入不一致
conservativePass = false
enablePassingHacks = false
enableMorePassingHacks = false
fillDameBeforePass = false
