<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
    <title>扭棱四角围棋</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
        }

        body {
            background: #2b5e3b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, sans-serif;
            padding: 10px;
        }

        .game-wrapper {
            background: #d9c8ac;
            padding: 40px;
            border-radius: 28px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.6);
            border: 2px solid #6b4a2e;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .top-panel {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            background: #8f6b4f;
            padding: 12px 20px;
            border-radius: 40px;
            color: #f9eed7;
            font-weight: bold;
            margin-bottom: 20px;
            border-bottom: 4px solid #4d2f1b;
            gap: 10px;
        }

        .left-group {
            display: flex;
            gap: 30px;
            align-items: center;
            flex-wrap: wrap;
        }

        .side-select {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

            .side-select label {
                font-size: 1.1rem;
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                position: relative;
            }

            .side-select input[type="radio"] {
                position: absolute;
                opacity: 0;
                width: 0;
                height: 0;
                margin: 0;
            }

            .side-select label::before {
                content: "";
                display: inline-block;
                width: 1em;
                height: 1em;
                border-radius: 50%;
                background-color: white;
                border: 1.5px solid #6b4a2e;
                transition: all 0.1s ease;
                box-sizing: border-box;
            }

            .side-select label.self-radio::before {
                border-color: #ff3b6f;
            }

            .side-select label.self-radio.checked-disabled::before {
                background-color: #ff3b6f;
                box-shadow: inset 0 0 0 0.15em white;
            }

            .side-select label.opponent-radio::before {
                border-color: #999999;
            }

            .side-select label.opponent-radio.checked-disabled::before {
                background-color: #999999;
                box-shadow: inset 0 0 0 0.15em white;
            }

        .komi-info {
            background: #3e2e21;
            padding: 6px 20px;
            border-radius: 30px;
            color: #ffd966;
            font-size: 1rem;
            white-space: nowrap;
        }

        .color-status {
            background: #3e2e21;
            padding: 6px 16px;
            border-radius: 30px;
            color: #ffd966;
            white-space: nowrap;
        }

        .board-size-select {
            background: #3e2e21;
            color: #ffd966;
            border: none;
            padding: 6px 12px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .right-buttons {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .help-btn, .back-to-lobby-btn {
            background: none;
            border: none;
            color: #fff9c2;
            font-weight: bold;
            padding: 0px 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: color 0.2s ease;
        }

        .rules-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .rules-content {
            background: #f9eed7;
            color: #3e2e21;
            max-width: 600px;
            width: 90%;
            padding: 20px 25px;
            border-radius: 28px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 2px solid #8f6b4f;
            position: relative;
        }

            .rules-content h3 {
                margin-top: 0;
                text-align: center;
                color: #5e2b3b;
            }

            .rules-content p {
                line-height: 1.5;
                font-size: 0.95rem;
            }

            .rules-content .close-rules {
                position: absolute;
                top: 10px;
                right: 15px;
                font-size: 1.5rem;
                cursor: pointer;
                color: #8f6b4f;
            }

        .main-area {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* 中间：棋盘 + 右侧信息列（同列内底对齐标记与棋盘） */
        .board-and-info {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            gap: 40px;
            flex: 0 1 auto;
            min-width: 0;
        }

        .main-area-right {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            width: 280px;
            max-width: 100%;
            flex: 0 0 auto;
            min-width: 0;
        }

        .main-area-right .info-panel {
            margin-bottom: 0;
            width: 100%;
        }

        /* 标记区：在棋盘容器内绝对定位，底与棋盘对齐；桌面在棋盘右缘外 6px（约原 gap40−34px） */
        .board-mark-outer {
            position: absolute;
            left: 100%;
            margin-left: 6px;
            bottom: 0;
            right: auto;
            top: auto;
            display: grid;
            grid-template-rows: 52px;
            grid-template-columns: max-content;
            width: max-content;
            max-width: min(100%, 280px);
            min-height: 52px;
            max-height: 52px;
            z-index: 2;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* [hidden] 须覆盖 .board-mark-panel 的 display:flex */
        .board-mark-panel[hidden],
        .board-mark-expand-btn[hidden] {
            display: none !important;
        }

        .board-mark-outer > .board-mark-panel,
        .board-mark-outer > .board-mark-expand-btn {
            grid-area: 1 / 1;
            align-self: end;
            justify-self: start;
            margin: 0;
        }

        .board-mark-panel {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(62, 46, 33, 0.92);
            color: #ffd966;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.82rem;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
            width: max-content;
            max-width: min(100%, 260px);
            max-height: 52px;
            box-sizing: border-box;
        }

        .board-mark-panel label {
            white-space: nowrap;
            flex-shrink: 0;
        }

        .board-mark-select {
            flex: 0 1 auto;
            min-width: 0;
            background: #3e2e21;
            color: #ffd966;
            border: 1px solid #c9a450;
            border-radius: 8px;
            padding: 2px 4px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            width: 3em;
            max-width: min(200px, 55vw);
            max-height: 44px;
        }

        .board-mark-fold-btn {
            background: transparent;
            color: #ffd966;
            border: none;
            border-radius: 8px;
            padding: 2px 2px;
            font-size: 1.1rem;
            line-height: 1;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
        }

        .board-mark-expand-btn {
            background: rgba(62, 46, 33, 0.92);
            color: #ffd966;
            border: none;
            border-radius: 10px;
            padding: 6px 6px;
            font-size: 0.82rem;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        .board-mark-fold-btn:active,
        .board-mark-expand-btn:active {
            transform: translateY(1px);
        }

        .button-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 140px;
        }

        .ctrl-btn {
            background: #b88a4b;
            border: none;
            color: white;
            font-weight: bold;
            padding: 12px 8px;
            border-radius: 30px;
            font-size: 1rem;
            border-bottom: 5px solid #5e3e1e;
            cursor: pointer;
            transition: 0.08s;
            text-align: center;
        }

            .ctrl-btn:active {
                border-bottom-width: 2px;
                transform: translateY(3px);
            }

        .board-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 0 1 auto;
            width: 100%;
            max-width: 600px;
            min-width: 0;
            position: relative;
        }

        canvas {
            display: block;
            background: #deb887;
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            border-radius: 4px;
            box-shadow: inset 0 0 0 1px #6b4a2e, 0 10px 15px #3a2e1e;
            max-width: 100%;
        }

        .info-panel {
            background: #8f6b4f;
            padding: 20px 16px;
            border-radius: 20px;
            color: #efdfbb;
            width: 100%;
            max-width: 280px;
            border: 1px solid #c9a450;
            margin: 0 auto;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
            border-bottom: 4px solid #4d2f1b;
        }

        .turn-box {
            background: #3e2e21;
            padding: 12px;
            border-radius: 50px;
            text-align: center;
            color: #ffd966;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .score-box {
            background: #3e2e21;
            padding: 14px;
            border-radius: 16px;
            line-height: 1.6;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .score-title {
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        .score-content {
            min-height: 60px;
        }

        .score-confirm-panel {
            margin-top: 15px;
            background: #3e2e21;
            border-radius: 20px;
            padding: 12px;
            text-align: center;
        }

            .score-confirm-panel p {
                margin: 0 0 10px 0;
                font-size: 0.9rem;
                color: #ffd98c;
            }

        .score-confirm-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

            .score-confirm-buttons button {
                background: #b88a4b;
                border: none;
                color: white;
                padding: 6px 16px;
                border-radius: 30px;
                cursor: pointer;
                font-weight: bold;
                border-bottom: 2px solid #5e3e1e;
            }

                .score-confirm-buttons button:active {
                    transform: translateY(2px);
                }

        .replay-panel {
            margin-top: 15px;
            background: #3e2e21;
            border-radius: 20px;
            padding: 14px;
            text-align: center;
        }

        .replay-step-display {
            color: #ffd966;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .replay-nav {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 12px;
        }

        .replay-nav-btn {
            background: #b88a4b;
            border: none;
            color: white;
            font-weight: bold;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 0.95rem;
            border-bottom: 3px solid #5e3e1e;
            cursor: pointer;
            transition: 0.08s;
        }

            .replay-nav-btn:active {
                border-bottom-width: 1px;
                transform: translateY(2px);
            }

        .replay-slider {
            width: 100%;
            cursor: pointer;
            accent-color: #b88a4b;
        }

        @media (max-width: 700px) {
            .game-wrapper {
                padding: 12px;
            }

            .button-panel {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                width: 100%;
                margin: 10px 0 0;
                gap: 10px;
            }

                .button-panel .ctrl-btn {
                    width: calc(50% - 10px);
                    min-width: 120px;
                }

            .info-panel {
                max-width: 100%;
                margin-top: 10px;
            }

            .top-panel {
                padding: 10px 12px;
            }

            .left-group {
                gap: 15px;
            }

            .side-select label {
                font-size: 0.95rem;
            }

            .komi-info, .color-status {
                white-space: normal;
                font-size: 0.9rem;
            }

            .board-container {
                max-width: 100%;
            }

            /* 手机：棋盘整行；标记在 board-container 内 absolute，底与棋盘对齐；展开盖住棋盘 */
            .board-and-info {
                display: grid;
                grid-template-columns: 1fr;
                grid-template-rows: auto auto;
                row-gap: 12px;
                width: 100%;
            }

            .board-and-info > .board-container {
                grid-column: 1;
                grid-row: 1;
                width: 100%;
                z-index: 1;
            }

            .main-area-right {
                display: contents;
            }

            /* 右缘：越过 game-wrapper 内边距与 body 内边距，与视口右缘对齐；底仍相对 board-container = 与 canvas 底对齐 */
            .board-mark-outer {
                position: absolute;
                right: calc(-10px - 12px);
                bottom: 0;
                left: auto !important;
                top: auto;
                margin-left: 0 !important;
                margin-right: 0;
                width: max-content;
                max-width: none;
                z-index: 5;
                pointer-events: none;
                overflow: visible;
                max-height: none;
                height: auto;
                min-height: 0;
                display: flex;
                flex-direction: column;
                align-items: flex-end;
                justify-content: flex-end;
            }

            .board-mark-outer > .board-mark-panel,
            .board-mark-outer > .board-mark-expand-btn {
                pointer-events: auto;
            }

            /* 展开条：收起钮靠整条最左侧（桌面保持 label→select→‹ 不变） */
            .board-mark-panel {
                flex-direction: row;
            }

            .board-mark-fold-btn {
                order: -1;
            }

            .main-area-right .info-panel {
                grid-column: 1;
                grid-row: 2;
                width: 100%;
                max-width: 600px;
                margin-top: 0;
            }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="top-panel">
            <div class="left-group">
                <div class="side-select">
                    <label id="labelBlack"><input type="radio" name="color" value="black" id="radioBlack"> ⚫ 黑方</label>
                    <label id="labelWhite"><input type="radio" name="color" value="white" id="radioWhite"> ⚪ 白方</label>
                </div>
                <div class="komi-info">黑贴白3.25点</div>
                <div class="color-status" id="colorStatus">观战</div>
                <select id="boardSizeSelect" class="board-size-select" style="display: none;">
                    <option value="3">3路</option>
                    <option value="4">4路</option>
                    <option value="5">5路</option>
                    <option value="6">6路</option>
                    <option value="7" selected>7路</option>
                    <option value="8">8路</option>
                </select>
                <label style="cursor:pointer; display:inline-flex; align-items:center; gap:5px; font-size:0.95rem;">
                    <input type="checkbox" id="showNumbersCheck"> 显示序号
                </label>
            </div>
            <div class="right-buttons">
                <button class="help-btn" id="helpBtn">说明</button>
                <button class="back-to-lobby-btn" id="backToLobbyBtn">返回大厅</button>
            </div>
        </div>

        <div id="rulesModal" class="rules-modal">
            <div class="rules-content">
                <span class="close-rules" id="closeRulesBtn">&times;</span>
                <h3>扭棱四角围棋</h3>
                <p>
                    基本规则同围棋。<br /><br />
                    采用扭棱四角棋盘。<br />
                </p>
            </div>
        </div>

        <div class="main-area">
            <div class="button-panel">
                <button class="ctrl-btn" id="newGameBtn">新局</button>
                <button class="ctrl-btn" id="estimateBtn">形势判断</button>
                <button class="ctrl-btn" id="tryPlayBtn" style="display:none;">试下</button>
                <button class="ctrl-btn" id="passBtn">虚着</button>
                <button class="ctrl-btn" id="undoBtn">悔棋</button>
                <button class="ctrl-btn" id="resignBtn">认输</button>
                <button class="ctrl-btn" id="drawBtn">和棋</button>
                <button class="ctrl-btn" id="endReqBtn">申请数子</button>
                <button class="ctrl-btn" id="importBtn">导入棋谱</button>
                <button class="ctrl-btn" id="exportBtn" style="display:none;">导出棋谱</button>
            </div>
            <div class="board-and-info">
                <div class="board-container">
                    <canvas id="goBoard" width="600" height="600"></canvas>
                    <div class="board-mark-outer" id="boardMarkOuter">
                        <div class="board-mark-panel" id="boardMarkPanel" hidden title="右键或长按空点放置标记；再次放置可清除">
                            <label for="boardMarkSelect">标记</label>
                            <select id="boardMarkSelect" class="board-mark-select" aria-label="棋盘标记符号"></select>
                            <button type="button" class="board-mark-fold-btn" id="boardMarkFoldBtn" title="收起">‹</button>
                        </div>
                        <button type="button" class="board-mark-expand-btn" id="boardMarkExpandBtn" title="展开标记">›</button>
                    </div>
                </div>
                <div class="main-area-right">
                    <div class="info-panel">
                        <div class="turn-box" id="turnDisplay">　</div>
                        <div class="score-box">
                            <div class="score-title" id="scoreTitle">　</div>
                            <div class="score-content">
                                <div id="scoreBoard">　</div>
                                <div id="leadInfo" style="margin-top:12px; color:#ffb870;">　</div>
                            </div>
                        </div>

                        <div id="scoreConfirmPanel" class="score-confirm-panel" style="display: none;">
                            <p id="scoreConfirmText">黑胜0点，是否同意该结果？</p>
                            <div class="score-confirm-buttons">
                                <button id="scoreConfirmYes">确定</button>
                                <button id="scoreConfirmNo">取消</button>
                            </div>
                        </div>

                        <div id="replayPanel" class="replay-panel">
                            <div class="replay-step-display" id="replayStepDisplay">0 / 0</div>
                            <div class="replay-nav">
                                <button class="replay-nav-btn" id="replayBackBtn">◀ 后退</button>
                                <button class="replay-nav-btn" id="replayForwardBtn">前进 ▶</button>
                            </div>
                            <input type="range" id="replaySlider" min="0" max="0" value="0" class="replay-slider">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <input type="file" id="importFileInput" accept=".json" style="display:none;">

    <script>
        // ======================== 配置 ========================
        let BOARD_LANES = 7;
        let GRID_W = 3 * BOARD_LANES - 2;
        let GRID_H = 3 * BOARD_LANES - 2;
        const KOMI = 3.25;
        let vertexPos = new Map();
        let boardEdgePath = null;
        let hoverDrawPending = false;

        // 路径参数
        const pathMatch = window.location.pathname.match(/^\/qi\/([^/]+)\/(\d+)$/);
        if (!pathMatch) { alert('无效的房间链接'); throw new Error('Invalid room URL'); }
        const gameType = pathMatch[1];
        const roomId = pathMatch[2];
        let roomPassword = sessionStorage.getItem(`roomPassword_${roomId}`) || null;

        const Snub = {
            gridDims(lanes) { return { w: 3 * lanes - 2, h: 3 * lanes - 2 }; },
            isValidVertex(row, col, gridW, gridH) {
                if (row < 0 || col < 0 || row >= gridW || col >= gridH) return false;
                if (row % 3 === 2 && col % 3 === 2) return false;
                if (row === gridW - 1 && row % 3 === 0 && col % 3 === 1) return false;
                if (col === gridH - 1 && row % 3 === 0 && col % 3 === 0) return false;
                return true;
            },
            getNeighbors(row, col, gridW, gridH) {
                let arr = [];
                if (row % 3 === 0 && col % 3 === 0) arr = [[row - 1, col], [row - 1, 1 + col], [row, col - 1], [row, 1 + col], [1 + row, col]];
                else if (row % 3 === 1 && col % 3 === 0) arr = [[row - 1, col - 1], [row - 1, col], [row, col - 1], [row, 1 + col], [1 + row, col]];
                else if (row % 3 === 2 && col % 3 === 0) arr = [[row - 1, col - 1], [row - 1, col], [row - 1, 1 + col], [1 + row, col - 1], [1 + row, col]];
                else if (row % 3 === 0 && col % 3 === 1) arr = [[row - 1, col], [row, col - 1], [row, 1 + col], [1 + row, col], [1 + row, 1 + col]];
                else if (row % 3 === 1 && col % 3 === 1) arr = [[row - 1, col], [row, col - 1], [row, 1 + col], [1 + row, col - 1], [1 + row, col]];
                else if (row % 3 === 2 && col % 3 === 1) arr = [[row - 1, col], [row - 1, 1 + col], [1 + row, col - 1], [1 + row, col], [1 + row, 1 + col]];
                else if (row % 3 === 0 && col % 3 === 2) arr = [[row - 1, col - 1], [row - 1, 1 + col], [row, col - 1], [row, 1 + col], [1 + row, 1 + col]];
                else if (row % 3 === 1 && col % 3 === 2) arr = [[row - 1, col - 1], [row, col - 1], [row, 1 + col], [1 + row, col - 1], [1 + row, 1 + col]];
                const out = [];
                for (const [a, b] of arr) {
                    if (Snub.isValidVertex(a, b, gridW, gridH)) out.push([a, b]);
                }
                return out;
            }
        };

        function initGridBoard() {
            const w = GRID_W, h = GRID_H;
            const b = Array(w).fill().map(() => Array(h).fill(-1));
            for (let r = 0; r < w; r++)
                for (let c = 0; c < h; c++)
                    if (Snub.isValidVertex(r, c, w, h)) b[r][c] = 0;
            return b;
        }

        // 全局状态
        let board = initGridBoard();
        let numberOfHands = 1;
        let currentPlayer = 1;
        let mySlot = null;
        let gameOver = false;
        let winner = null;
        let lastMoveMarkers = [];
        let showEstimateActive = false;
        let cachedLiveBoard = null;

        (function initBoardMarkFold() {
