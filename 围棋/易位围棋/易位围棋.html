<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
    <title>易位围棋</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
        }

        body {
            background: #2b5e3b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, sans-serif;
            padding: 10px;
        }

        .game-wrapper {
            background: #d9c8ac;
            padding: 40px;
            border-radius: 28px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.6);
            border: 2px solid #6b4a2e;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .top-panel {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            background: #8f6b4f;
            padding: 12px 20px;
            border-radius: 40px;
            color: #f9eed7;
            font-weight: bold;
            margin-bottom: 20px;
            border-bottom: 4px solid #4d2f1b;
            gap: 10px;
        }

        .left-group {
            display: flex;
            gap: 30px;
            align-items: center;
            flex-wrap: wrap;
        }

        .side-select {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

            .side-select label {
                font-size: 1.1rem;
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                position: relative;
            }

            .side-select input[type="radio"] {
                position: absolute;
                opacity: 0;
                width: 0;
                height: 0;
                margin: 0;
            }

            .side-select label::before {
                content: "";
                display: inline-block;
                width: 1em;
                height: 1em;
                border-radius: 50%;
                background-color: white;
                border: 1.5px solid #6b4a2e;
                transition: all 0.1s ease;
                box-sizing: border-box;
            }

            .side-select label.self-radio::before {
                border-color: #ff3b6f;
            }

            .side-select label.self-radio.checked-disabled::before {
                background-color: #ff3b6f;
                box-shadow: inset 0 0 0 0.15em white;
            }

            .side-select label.opponent-radio::before {
                border-color: #999999;
            }

            .side-select label.opponent-radio.checked-disabled::before {
                background-color: #999999;
                box-shadow: inset 0 0 0 0.15em white;
            }

        .komi-info {
            background: #3e2e21;
            padding: 6px 20px;
            border-radius: 30px;
            color: #ffd966;
            font-size: 1rem;
            white-space: nowrap;
        }

        .color-status {
            background: #3e2e21;
            padding: 6px 16px;
            border-radius: 30px;
            color: #ffd966;
            white-space: nowrap;
        }

        .board-size-select {
            background: #3e2e21;
            color: #ffd966;
            border: none;
            padding: 6px 12px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .right-buttons {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .help-btn, .back-to-lobby-btn {
            background: none;
            border: none;
            color: #fff9c2;
            font-weight: bold;
            padding: 0px 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: color 0.2s ease;
        }

        .rules-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .rules-content {
            background: #f9eed7;
            color: #3e2e21;
            max-width: 600px;
            width: 90%;
            padding: 20px 25px;
            border-radius: 28px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 2px solid #8f6b4f;
            position: relative;
        }

            .rules-content h3 {
                margin-top: 0;
                text-align: center;
                color: #5e2b3b;
            }

            .rules-content p {
                line-height: 1.5;
                font-size: 0.95rem;
            }

            .rules-content .close-rules {
                position: absolute;
                top: 10px;
                right: 15px;
                font-size: 1.5rem;
                cursor: pointer;
                color: #8f6b4f;
            }

        .main-area {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            flex-wrap: wrap;
            justify-content: center;
        }

        .button-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 140px;
        }

        .ctrl-btn {
            background: #b88a4b;
            border: none;
            color: white;
            font-weight: bold;
            padding: 12px 8px;
            border-radius: 30px;
            font-size: 1rem;
            border-bottom: 5px solid #5e3e1e;
            cursor: pointer;
            transition: 0.08s;
            text-align: center;
        }

            .ctrl-btn:active {
                border-bottom-width: 2px;
                transform: translateY(3px);
            }

        .board-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 0 0 auto;
            width: 100%;
            max-width: 600px;
            position: relative;
        }

        .board-mark-outer {
            position: absolute;
            left: 100%;
            margin-left: 6px;
            bottom: 0;
            right: auto;
            top: auto;
            display: grid;
            grid-template-rows: 52px;
            grid-template-columns: max-content;
            width: max-content;
            max-width: min(100%, 280px);
            min-height: 52px;
            max-height: 52px;
            z-index: 2;
            box-sizing: border-box;
            overflow: hidden;
        }

        .board-mark-panel[hidden],
        .board-mark-expand-btn[hidden] {
            display: none !important;
        }

        .board-mark-outer > .board-mark-panel,
        .board-mark-outer > .board-mark-expand-btn {
            grid-area: 1 / 1;
            align-self: end;
            justify-self: start;
            margin: 0;
        }

        .board-mark-panel {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(62, 46, 33, 0.92);
            color: #ffd966;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.82rem;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
            width: max-content;
            max-width: min(100%, 260px);
            max-height: 52px;
            box-sizing: border-box;
        }

        .board-mark-panel label {
            white-space: nowrap;
            flex-shrink: 0;
        }

        .board-mark-select {
            flex: 0 1 auto;
            min-width: 0;
            background: #3e2e21;
            color: #ffd966;
            border: 1px solid #c9a450;
            border-radius: 8px;
            padding: 2px 4px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            width: 3em;
            max-width: min(200px, 55vw);
            max-height: 44px;
        }

        .board-mark-fold-btn {
            background: transparent;
            color: #ffd966;
            border: none;
            border-radius: 8px;
            padding: 2px 2px;
            font-size: 1.1rem;
            line-height: 1;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
        }

        .board-mark-expand-btn {
            background: rgba(62, 46, 33, 0.92);
            color: #ffd966;
            border: none;
            border-radius: 10px;
            padding: 6px 6px;
            font-size: 0.82rem;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        .board-mark-fold-btn:active,
        .board-mark-expand-btn:active {
            transform: translateY(1px);
        }

        canvas {
            display: block;
            background: #deb887;
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            border-radius: 4px;
            box-shadow: inset 0 0 0 1px #6b4a2e, 0 10px 15px #3a2e1e;
            max-width: 100%;
        }

        .info-panel {
            background: #8f6b4f;
            padding: 20px 16px;
            border-radius: 20px;
            color: #efdfbb;
            width: 100%;
            max-width: 280px;
            border: 1px solid #c9a450;
            margin: 0 auto;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
            border-bottom: 4px solid #4d2f1b;
        }

        .turn-box {
            background: #3e2e21;
            padding: 12px;
            border-radius: 50px;
            text-align: center;
            color: #ffd966;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .score-box {
            background: #3e2e21;
            padding: 14px;
            border-radius: 16px;
            line-height: 1.6;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .score-title {
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        .score-content {
            min-height: 60px;
        }

        .score-confirm-panel {
            margin-top: 15px;
            background: #3e2e21;
            border-radius: 20px;
            padding: 12px;
            text-align: center;
        }

            .score-confirm-panel p {
                margin: 0 0 10px 0;
                font-size: 0.9rem;
                color: #ffd98c;
            }

        .score-confirm-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

            .score-confirm-buttons button {
                background: #b88a4b;
                border: none;
                color: white;
                padding: 6px 16px;
                border-radius: 30px;
                cursor: pointer;
                font-weight: bold;
                border-bottom: 2px solid #5e3e1e;
            }

                .score-confirm-buttons button:active {
                    transform: translateY(2px);
                }

        .replay-panel {
            margin-top: 15px;
            background: #3e2e21;
            border-radius: 20px;
            padding: 14px;
            text-align: center;
        }

        .replay-step-display {
            color: #ffd966;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .replay-nav {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 12px;
        }

        .replay-nav-btn {
            background: #b88a4b;
            border: none;
            color: white;
            font-weight: bold;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 0.95rem;
            border-bottom: 3px solid #5e3e1e;
            cursor: pointer;
            transition: 0.08s;
        }

            .replay-nav-btn:active {
                border-bottom-width: 1px;
                transform: translateY(2px);
            }

        .replay-slider {
            width: 100%;
            cursor: pointer;
            accent-color: #b88a4b;
        }

        @media (max-width: 700px) {
            .game-wrapper {
                padding: 12px;
            }

            .button-panel {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                width: 100%;
                margin: 10px 0 0;
                gap: 10px;
            }

                .button-panel .ctrl-btn {
                    width: calc(50% - 10px);
                    min-width: 120px;
                }

            .info-panel {
                max-width: 100%;
                margin-top: 10px;
            }

            .top-panel {
                padding: 10px 12px;
            }

            .left-group {
                gap: 15px;
            }

            .side-select label {
                font-size: 0.95rem;
            }

            .komi-info, .color-status {
                white-space: normal;
                font-size: 0.9rem;
            }

            .board-container {
                max-width: 100%;
            }

            .board-mark-outer {
                position: absolute;
                right: calc(-10px - 12px);
                bottom: 0;
                left: auto !important;
                top: auto;
                margin-left: 0 !important;
                margin-right: 0;
                width: max-content;
                max-width: none;
                z-index: 5;
                pointer-events: none;
                overflow: visible;
                max-height: none;
                height: auto;
                min-height: 0;
                display: flex;
                flex-direction: column;
                align-items: flex-end;
                justify-content: flex-end;
            }

            .board-mark-outer > .board-mark-panel,
            .board-mark-outer > .board-mark-expand-btn {
                pointer-events: auto;
            }

            .board-mark-panel {
                flex-direction: row;
            }

            .board-mark-fold-btn {
                order: -1;
            }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="top-panel">
            <div class="left-group">
                <div class="side-select">
                    <label id="labelBlack"><input type="radio" name="color" value="black" id="radioBlack"> ⚫ 黑方</label>
                    <label id="labelWhite"><input type="radio" name="color" value="white" id="radioWhite"> ⚪ 白方</label>
                </div>
                <div class="komi-info">黑贴白3.25点</div>
                <div class="color-status" id="colorStatus">观战</div>
                <select id="boardSizeSelect" class="board-size-select" style="display: none;">
                    <option value="7">7路</option>
                    <option value="8">8路</option>
                    <option value="9">9路</option>
                    <option value="10">10路</option>
                    <option value="11">11路</option>
                    <option value="12">12路</option>
                    <option value="13">13路</option>
                    <option value="14">14路</option>
                    <option value="15">15路</option>
                    <option value="16">16路</option>
                    <option value="17">17路</option>
                    <option value="18">18路</option>
                    <option value="19" selected>19路</option>
                    <option value="20">20路</option>
                    <option value="21">21路</option>
                </select>
            </div>
            <div class="right-buttons">
                <button class="help-btn" id="helpBtn">说明</button>
                <button class="back-to-lobby-btn" id="backToLobbyBtn">返回大厅</button>
            </div>
        </div>

        <div id="rulesModal" class="rules-modal">
            <div class="rules-content">
                <span class="close-rules" id="closeRulesBtn">&times;</span>
                <h3>易位围棋</h3>
                <p>
                    基本规则同围棋。<br /><br />
                    每手棋可以选择「落子」或「易位」。<br />
                    <strong>易位</strong>：将一枚己方棋子和一枚与之相邻的对方棋子交换位置。<br /><br />
                    仅前n手可以易位，从第n+1手开始恢复为标准围棋，不可以再易位。其中n为棋盘总点数的80%向上取偶。
                    棋盘的路数与n的映射关系为：<br />
                    <strong>7 </strong>40<br />
                    <strong>8 </strong>52<br />
                    <strong>9 </strong>66<br />
                    <strong>10 </strong>82<br />
                    <strong>11 </strong>98<br />
                    <strong>12 </strong>116<br />
                    <strong>13 </strong>136<br />
                    <strong>14 </strong>158<br />
                    <strong>15 </strong>182<br />
                    <strong>16 </strong>206<br />
                    <strong>17 </strong>232<br />
                    <strong>18 </strong>260<br />
                    <strong>19 </strong>290<br />
                    <strong>20 </strong>322<br />
                    <strong>21 </strong>354<br />
                    <br /><br />
                    需要易位时，请先点击己方棋子，再点击对方棋子。<br />
                </p>
            </div>
        </div>

        <div class="main-area">
            <div class="button-panel">
                <button class="ctrl-btn" id="newGameBtn">新局</button>
                <button class="ctrl-btn" id="estimateBtn">形势判断</button>
                <button class="ctrl-btn" id="tryPlayBtn" style="display:none;">试下</button>
                <button class="ctrl-btn" id="passBtn">虚着</button>
                <button class="ctrl-btn" id="undoBtn">悔棋</button>
                <button class="ctrl-btn" id="resignBtn">认输</button>
                <button class="ctrl-btn" id="drawBtn">和棋</button>
                <button class="ctrl-btn" id="endReqBtn">申请数子</button>
                <button class="ctrl-btn" id="importBtn">导入棋谱</button>
                <button class="ctrl-btn" id="exportBtn" style="display:none;">导出棋谱</button>
            </div>
            <div class="board-container">
                <canvas id="goBoard" width="600" height="600"></canvas>
                <div class="board-mark-outer" id="boardMarkOuter">
                    <div class="board-mark-panel" id="boardMarkPanel" hidden title="右键或长按空点放置标记；再次放置可清除">
                        <label for="boardMarkSelect">标记</label>
                        <select id="boardMarkSelect" class="board-mark-select" aria-label="棋盘标记符号"></select>
                        <button type="button" class="board-mark-fold-btn" id="boardMarkFoldBtn" title="收起">‹</button>
                    </div>
                    <button type="button" class="board-mark-expand-btn" id="boardMarkExpandBtn" title="展开标记">›</button>
                </div>
            </div>
            <div class="info-panel">
                <div class="turn-box" id="turnDisplay">　</div>
                <div class="score-box">
                    <div class="score-title" id="scoreTitle">　</div>
                    <div class="score-content">
                        <div id="scoreBoard">　</div>
                        <div id="leadInfo" style="margin-top:12px; color:#ffb870;">　</div>
                    </div>
                </div>

                <div id="scoreConfirmPanel" class="score-confirm-panel" style="display: none;">
                    <p id="scoreConfirmText">黑胜0点，是否同意该结果？</p>
                    <div class="score-confirm-buttons">
                        <button id="scoreConfirmYes">确定</button>
                        <button id="scoreConfirmNo">取消</button>
                    </div>
                </div>

                <div id="replayPanel" class="replay-panel" style="display: none;">
                    <div class="replay-step-display" id="replayStepDisplay">0 / 0</div>
                    <div class="replay-nav">
                        <button class="replay-nav-btn" id="replayBackBtn">◀ 后退</button>
                        <button class="replay-nav-btn" id="replayForwardBtn">前进 ▶</button>
                    </div>
                    <input type="range" id="replaySlider" min="0" max="0" value="0" class="replay-slider">
                </div>
            </div>
        </div>
    </div>
    <input type="file" id="importFileInput" accept=".json" style="display:none;">

    <script>
        // ======================== 配置 ========================
        let BOARD_SIZE = 19;
        let PADDING = 63 - 2 * BOARD_SIZE;
        const KOMI = 3.25;
        let CELL_SIZE = (600 - 2 * PADDING) / (BOARD_SIZE - 1);
        let maxTranspositionMoves = 290;

        // 路径参数
        const pathMatch = window.location.pathname.match(/^\/qi\/([^/]+)\/(\d+)$/);
        if (!pathMatch) { alert('无效的房间链接'); throw new Error('Invalid room URL'); }
        const gameType = pathMatch[1];
        const roomId = pathMatch[2];
        let roomPassword = sessionStorage.getItem(`roomPassword_${roomId}`) || null;

        // 全局状态
        let board = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
        let numberOfHands = 1;
        let currentPlayer = 1;
        let lastMovePlayerColor = null;
        let mySlot = null;
        let gameOver = false;
        let winner = null;
        let lastMoveMarkers = [];
        let moveHighlightMarkers = [];    // 易位高亮标记 {row, col, color, frameOnly}
        let showEstimateActive = false;
        let cachedLiveBoard = null;
        let cachedTerritory = null;
        let waitingScoreConfirm = false; // 数子确认等待中
        let iRejected = false;

        // 易位相关
        let selectedPiece = null;         // 当前选中的己方棋子 {row, col}
        let canTransposition = true;      // 当前是否允许移子（前300手）
        let moveCount = 0;                // 总手数

        let ws;
        let isMyTurn = false;
        let slots = { black: false, white: false };
        let reconnectTimer = null;

        let replayMode = false;
        let replayBoards = [];
        let replayMarkers = [];
        let replayHighlights = [];
        let replayMovePlayerColors = [];
        let replayStepPlayers = [];
        let replayStep = 0;
        let replayTotalSteps = 0;

        let tryPlayMode = false;
        let tryPlayBaseStep = 0;
        let tryPlayBoards = [];
        let tryPlayMarkers = [];
        let tryPlayHighlights = [];
        let tryPlayMovePlayerColors = [];
        let tryPlayCurrentPlayer = 1;
        let tryPlayStep = 0;
        let tryPlayTotalSteps = 0;
        let tryPlayPlyCount = 0;
        let tryPlaySelectedPiece = null;

        let moveCoords = [];
        let liveReplayBoards = [];
        let liveReplayMarkers = [];
        let liveReplayHighlights = [];
        let liveReplayMovePlayerColors = [];
        let liveReplayStepPlayers = [];
        let liveViewStep = 0;
        let liveFollowLatest = true;

        /** 本地棋盘标记（仅本机） */
        let userBoardMarks = Object.create(null);
        const BOARD_MARK_CHAR_LIST = (() => {
            const a = [];
            a.push('?', '!');
            for (let i = 0; i < 26; i++) a.push(String.fromCharCode(65 + i));
            a.push('△', '▽', '♡', '○', '◇', '□', '☆', '×', '🚩');
            return a;
        })();

        // DOM
        const canvas = document.getElementById('goBoard');
        const ctx = canvas.getContext('2d');
        const turnDisplay = document.getElementById('turnDisplay');
        const colorStatus = document.getElementById('colorStatus');
        const radioBlack = document.getElementById('radioBlack');
        const radioWhite = document.getElementById('radioWhite');
        const labelBlack = document.getElementById('labelBlack');
        const labelWhite = document.getElementById('labelWhite');
        const scoreTitle = document.getElementById('scoreTitle');
        const scoreBoard = document.getElementById('scoreBoard');
        const leadInfo = document.getElementById('leadInfo');
        const scoreConfirmPanel = document.getElementById('scoreConfirmPanel');
        const scoreConfirmText = document.getElementById('scoreConfirmText');
        const scoreConfirmYes = document.getElementById('scoreConfirmYes');
        const scoreConfirmNo = document.getElementById('scoreConfirmNo');
        const boardMarkSelect = document.getElementById('boardMarkSelect');

        (function initBoardMarkSelect() {
            if (!boardMarkSelect) return;
            const frag = document.createDocumentFragment();
            const optEmpty = document.createElement('option');
            optEmpty.value = '';
            optEmpty.textContent = '清除';
            frag.appendChild(optEmpty);
            for (const ch of BOARD_MARK_CHAR_LIST) {
                const o = document.createElement('option');
                o.value = ch;
                o.textContent = ch;
                if (ch === '?') o.selected = true;
                frag.appendChild(o);
            }
            boardMarkSelect.appendChild(frag);
        })();

        (function initBoardMarkFold() {
            const panel = document.getElementById('boardMarkPanel');
            const foldBtn = document.getElementById('boardMarkFoldBtn');
            const expandBtn = document.getElementById('boardMarkExpandBtn');
            if (!panel || !foldBtn || !expandBtn) return;
            function setCollapsed(collapsed) {
                panel.hidden = collapsed;
                expandBtn.hidden = !collapsed;
                foldBtn.setAttribute('aria-expanded', String(!collapsed));
                expandBtn.setAttribute('aria-expanded', String(!collapsed));
            }
            foldBtn.onclick = () => setCollapsed(true);
            expandBtn.onclick = () => setCollapsed(false);
            setCollapsed(true);
        })();

        let hoverRow = -1, hoverCol = -1, isHoverValid = false;
        const isMouseDevice = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

        /** 手机端、棋盘大于 9 路：落子/易位对方子需预览确认；选己方子仍为单次点击 */
        function mobileTwoStepPlacing() {
            return !isMouseDevice && BOARD_SIZE > 9;
        }
        function clearMobileMovePreview() {
            hoverRow = -1;
            hoverCol = -1;
            isHoverValid = false;
        }

        // ======================== 形势判断 ========================
        function deepCopyBoard(src) { return src.map(row => row.slice()); }

        function countGroupLiberties(board, row, col) {
            const color = board[row][col];
            if (color === 0) return 0;
            const visited = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(false));
            const queue = [[row, col]];
            visited[row][col] = true;
            const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
            const liberties = new Set();
            while (queue.length) {
                const [r, c] = queue.shift();
                for (let [dr, dc] of dirs) {
                    const nr = r + dr, nc = c + dc;
                    if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE) continue;
                    if (board[nr][nc] === 0) {
                        liberties.add(nr + ',' + nc);
                    } else if (board[nr][nc] === color && !visited[nr][nc]) {
                        visited[nr][nc] = true;
                        queue.push([nr, nc]);
                    }
                }
            }
            return liberties.size;
        }

        function removeGroup(board, row, col, color) {
            const queue = [[row, col]];
            board[row][col] = 0;
            const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
            while (queue.length) {
                const [r, c] = queue.shift();
                for (let [dr, dc] of dirs) {
                    const nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === color) {
                        board[nr][nc] = 0;
                        queue.push([nr, nc]);
                    }
                }
            }
        }

        function tryPlaceStone(boardBefore, row, col, playerVal) {
            if (boardBefore[row][col] !== 0) return null;
            const newBoard = deepCopyBoard(boardBefore);
            newBoard[row][col] = playerVal;
            const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
            const affectedEnemy = new Set();
            for (let [dr, dc] of dirs) {
                const nr = row + dr, nc = col + dc;
                if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && newBoard[nr][nc] === 3 - playerVal)
                    affectedEnemy.add(`${nr},${nc}`);
            }
            for (let key of affectedEnemy) {
                const [r, c] = key.split(',').map(Number);
                if (newBoard[r][c] === 3 - playerVal && countGroupLiberties(newBoard, r, c) === 0)
                    removeGroup(newBoard, r, c, 3 - playerVal);
            }
            if (newBoard[row][col] === playerVal && countGroupLiberties(newBoard, row, col) === 0)
                removeGroup(newBoard, row, col, playerVal);
            return newBoard;
        }

        function trySwapPiece(boardBefore, fromRow, fromCol, toRow, toCol, playerVal) {
            if (fromRow < 0 || fromRow >= BOARD_SIZE || fromCol < 0 || fromCol >= BOARD_SIZE ||
                toRow < 0 || toRow >= BOARD_SIZE || toCol < 0 || toCol >= BOARD_SIZE) return null;
            if (boardBefore[fromRow][fromCol] !== playerVal) return null;
            if (boardBefore[toRow][toCol] !== 3 - playerVal) return null;
            if (Math.abs(fromRow - toRow) + Math.abs(fromCol - toCol) !== 1) return null;
            const newBoard = deepCopyBoard(boardBefore);
            newBoard[fromRow][fromCol] = 3 - playerVal;
            newBoard[toRow][toCol] = playerVal;
            const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
            const enemyPositions = new Set();
            enemyPositions.add(`${fromRow},${fromCol}`);
            for (let [dr, dc] of dirs) {
                const nr = toRow + dr, nc = toCol + dc;
                if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && newBoard[nr][nc] === 3 - playerVal)
                    enemyPositions.add(`${nr},${nc}`);
            }
            for (let key of enemyPositions) {
                const [r, c] = key.split(',').map(Number);
                if (newBoard[r][c] === 3 - playerVal && countGroupLiberties(newBoard, r, c) === 0)
                    removeGroup(newBoard, r, c, 3 - playerVal);
            }
            const friendlyPositions = new Set();
            for (let [dr, dc] of dirs) {
                const nr = fromRow + dr, nc = fromCol + dc;
                if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && newBoard[nr][nc] === playerVal)
                    friendlyPositions.add(`${nr},${nc}`);
            }
            for (let key of friendlyPositions) {
                const [r, c] = key.split(',').map(Number);
                if (newBoard[r][c] === playerVal && countGroupLiberties(newBoard, r, c) === 0)
                    removeGroup(newBoard, r, c, playerVal);
            }
            return newBoard;
        }

        function isLibertySurroundedByOpponent(board, libertyRow, libertyCol, opponentColor) {
            const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
            for (let [dr, dc] of dirs) {
                const nr = libertyRow + dr, nc = libertyCol + dc;
                if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === opponentColor) return true;
            }
            return false;
        }

        function removeDeadAndDying(srcBoard) {
            let boardCopy = deepCopyBoard(srcBoard);
            let changed = true;
            while (changed) {
                changed = false;
                const visited = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(false));
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        const val = boardCopy[r][c];
                        if ((val === 1 || val === 2) && !visited[r][c]) {
                            const color = val;
                            const queue = [[r, c]];
                            visited[r][c] = true;
                            const stones = [[r, c]];
                            const liberties = new Set();
                            let idx = 0;
                            const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
                            while (idx < queue.length) {
                                const [rr, cc] = queue[idx++];
                                for (let [dr, dc] of dirs) {
                                    const nr = rr + dr, nc = cc + dc;
                                    if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE) continue;
                                    if (boardCopy[nr][nc] === 0) liberties.add(nr + ',' + nc);
                                    else if (boardCopy[nr][nc] === color && !visited[nr][nc]) {
                                        visited[nr][nc] = true;
                                        queue.push([nr, nc]);
                                        stones.push([nr, nc]);
                                    }
                                }
                            }
                            if (liberties.size === 0) {
                                for (let [rr, cc] of stones) boardCopy[rr][cc] = 0;
                                changed = true;
                                continue;
                            }
                            if (liberties.size <= 2) {
                                let allControlled = true;
                                for (let lib of liberties) {
                                    const [lr, lc] = lib.split(',').map(Number);
                                    if (!isLibertySurroundedByOpponent(boardCopy, lr, lc, 3 - color)) {
                                        allControlled = false;
                                        break;
                                    }
                                }
                                if (allControlled) {
                                    for (let [rr, cc] of stones) boardCopy[rr][cc] = 0;
                                    changed = true;
                                }
                            }
                        }
                    }
                }
            }
            return boardCopy;
        }

        function assignTerritoryWithRange(liveBoard) {
            const territory = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (liveBoard[r][c] !== 0) continue;
                    const maxDist = (r <= 1 || r >= BOARD_SIZE - 2 || c <= 1 || c >= BOARD_SIZE - 2) ? 5 : 4;
                    let blackMin = Infinity, whiteMin = Infinity;
                    const dist = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(Infinity));
                    dist[r][c] = 0;
                    const queue = [[r, c]];
                    const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
                    let front = 0;
                    while (front < queue.length) {
                        const [cr, cc] = queue[front++];
                        const d = dist[cr][cc];
                        if (d > maxDist) continue;
                        if (liveBoard[cr][cc] === 1 && d < blackMin) blackMin = d;
                        if (liveBoard[cr][cc] === 2 && d < whiteMin) whiteMin = d;
                        for (let [dr, dc] of dirs) {
                            const nr = cr + dr, nc = cc + dc;
                            if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && liveBoard[nr][nc] !== -1 && dist[nr][nc] === Infinity) {
                                dist[nr][nc] = d + 1;
                                queue.push([nr, nc]);
                            }
                        }
                    }
                    if (blackMin <= maxDist && whiteMin <= maxDist) {
                        if (blackMin < whiteMin) territory[r][c] = 1;
                        else if (whiteMin < blackMin) territory[r][c] = 2;
                        else territory[r][c] = 3;
                    } else if (blackMin <= maxDist) territory[r][c] = 1;
                    else if (whiteMin <= maxDist) territory[r][c] = 2;
                    else territory[r][c] = 3;
                }
            }
            return territory;
        }

        function computeScore(liveBoard, territory) {
            let blackStones = 0, whiteStones = 0, blackTerritory = 0, whiteTerritory = 0, publicTerritory = 0;
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (liveBoard[r][c] === 1) blackStones++;
                    else if (liveBoard[r][c] === 2) whiteStones++;
                    else if (liveBoard[r][c] === 0) {
                        if (territory[r][c] === 1) blackTerritory++;
                        else if (territory[r][c] === 2) whiteTerritory++;
                        else if (territory[r][c] === 3) publicTerritory++;
                    }
                }
            }
            const blackTotal = blackStones + blackTerritory + publicTerritory / 2;
            const whiteTotal = whiteStones + whiteTerritory + publicTerritory / 2;
            return { blackTotal, whiteTotal };
        }

        function computeScoreFromBoard(srcBoard) {
            const liveBoard = removeDeadAndDying(srcBoard);
            const territory = assignTerritoryWithRange(liveBoard);
            return computeScore(liveBoard, territory);
        }

        function computeLead() {
            const { blackTotal, whiteTotal } = computeScoreFromBoard(board);
            return blackTotal - whiteTotal - 2 * KOMI;
        }

        function isTranspositionHoverPreviewAt(r, c) {
            if (hoverRow !== r || hoverCol !== c || !isHoverValid) return false;
            if (tryPlayMode && replayMode) {
                const pv = tryPlayCurrentPlayer;
                const tsp = tryPlaySelectedPiece;
                if (tsp) {
                    const { row: fromRow, col: fromCol } = tsp;
                    return Math.abs(fromRow - r) + Math.abs(fromCol - c) === 1 && board[r][c] === 3 - pv;
                }
                return board[r][c] === 0;
            }
            if (gameOver || !isMyTurn) return false;
            const playerVal = mySlot === 'black' ? 1 : 2;
            if (selectedPiece) {
                const { row: fromRow, col: fromCol } = selectedPiece;
                return Math.abs(fromRow - r) + Math.abs(fromCol - c) === 1 && board[r][c] === 3 - playerVal;
            }
            return board[r][c] === 0;
        }

        function isUserBoardMarkVisibleAt(r, c) {
            if (showEstimateActive) return false;
            if (r < 0 || r >= BOARD_SIZE || c < 0 || c >= BOARD_SIZE) return false;
            if (board[r][c] !== 0) return false;
            for (const m of moveHighlightMarkers) {
                if (m.row === r && m.col === c) return false;
            }
            const sel = tryPlayMode ? tryPlaySelectedPiece : selectedPiece;
            if (sel && sel.row === r && sel.col === c) return false;
            if (isTranspositionHoverPreviewAt(r, c)) return false;
            return true;
        }

        // ======================== 绘制 ========================
        function drawBoard()
        {
            ctx.clearRect(0, 0, 600, 600);
            const cellSize = CELL_SIZE;
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = '#3a281c';
            for (let i = 0; i < BOARD_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(PADDING + i * cellSize, PADDING);
                ctx.lineTo(PADDING + i * cellSize, 600 - PADDING);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(PADDING, PADDING + i * cellSize);
                ctx.lineTo(600 - PADDING, PADDING + i * cellSize);
                ctx.stroke();
            }

            const starPoints = getStarPoints(BOARD_SIZE);
            ctx.fillStyle = '#3a281c';
            for (let [r, c] of starPoints) {
                ctx.beginPath();
                ctx.arc(PADDING + c * cellSize, PADDING + r * cellSize, cellSize * 0.12, 0, 2 * Math.PI);
                ctx.fill();
            }

            /* 坐标在棋子下层：星位之后、棋子之前 */
            ctx.font = `bold ${17 - 0.2 * BOARD_SIZE}px Arial`;
            ctx.fillStyle = '#3a281c';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            for (let c = 0; c < BOARD_SIZE; c++) {
                const letter = String.fromCharCode(65 + c);
                const x = PADDING + c * cellSize;
                const y = 0.6 * PADDING;
                ctx.fillText(letter, x, y);
            }
            for (let r = 0; r < BOARD_SIZE; r++) {
                const number = (r + 1).toString();
                const x = PADDING / 2;
                const y = PADDING + r * cellSize;
                ctx.fillText(number, x, y);
            }

            const stoneRadius = cellSize * 0.44;
            const markLenDefault = cellSize * 0.352;
            const lowerLastMoveMarker = showMoveNumbers || showEstimateActive;
            if (lowerLastMoveMarker) {
                for (let { row, col, color } of lastMoveMarkers) {
                    const x = PADDING + col * cellSize;
                    const y = PADDING + row * cellSize;
                    ctx.beginPath();
                    ctx.moveTo(x + stoneRadius, y + stoneRadius);
                    ctx.lineTo(x, y + stoneRadius);
                    ctx.lineTo(x + stoneRadius, y);
                    ctx.closePath();
                    ctx.fillStyle = color === 1 ? '#fff' : '#222';
                    ctx.fill();
                }
            }

            // 棋子
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const val = board[r][c];
                    if (val !== 1 && val !== 2) continue;
                    const x = PADDING + c * cellSize;
                    const y = PADDING + r * cellSize;
                    const radius = stoneRadius;
                    ctx.save();
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = 'rgba(0,0,0,0.5)';
                    ctx.shadowOffsetY = 2;
                    const grad = ctx.createRadialGradient(x - 3, y - 3, radius * 0.2, x, y, radius * 1.2);
                    if (val === 1) {
                        grad.addColorStop(0, '#444');
                        grad.addColorStop(0.6, '#222');
                        grad.addColorStop(1, '#111');
                    } else {
                        grad.addColorStop(0, '#fff');
                        grad.addColorStop(0.5, '#eee');
                        grad.addColorStop(1, '#aaa');
                    }
                    ctx.beginPath();
                    ctx.arc(x, y, radius, 0, 2 * Math.PI);
                    ctx.fillStyle = grad;
                    ctx.fill();
                    ctx.restore();
                    ctx.beginPath();
                    ctx.arc(x - 3, y - 3, radius * 0.15, 0, 2 * Math.PI);
                    ctx.fillStyle = val === 1 ? '#444' : '#fff';
                    ctx.fill();
                }
            }
            // 最后落子标记（平常：棋子之上）
            if (!lowerLastMoveMarker) {
                const markLen = markLenDefault;
                for (let { row, col, color } of lastMoveMarkers) {
                    const x = PADDING + col * cellSize;
                    const y = PADDING + row * cellSize;
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x + markLen, y);
                    ctx.lineTo(x, y + markLen);
                    ctx.closePath();
                    ctx.fillStyle = color === 1 ? '#fff' : '#222';
                    ctx.fill();
                }
            }
            for (const key of Object.keys(userBoardMarks)) {
                const [r, c] = key.split(',').map(Number);
                if (r < 0 || r >= BOARD_SIZE || c < 0 || c >= BOARD_SIZE) continue;
                if (!isUserBoardMarkVisibleAt(r, c)) continue;
                const ch = userBoardMarks[key];
                const x = PADDING + c * cellSize;
                const y = PADDING + r * cellSize;
                const markBgR = cellSize * 0.3;
                ctx.beginPath();
                ctx.arc(x, y, markBgR, 0, 2 * Math.PI);
                ctx.fillStyle = '#deb887';
                ctx.fill();
                const fontPx = cellSize * (ch === '🚩' ? 0.6 : 0.66);
                ctx.font = `bold ${fontPx}px "Segoe UI", "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#3a281c';
                ctx.fillText(ch, x, y + 1);
            }

            if (lastMovePlayerColor !== null)
            {
                const strokeColor = lastMovePlayerColor === 1 ? '#ff9900' : '#0099ff';
                for (let { row, col, frameOnly } of moveHighlightMarkers)
                {
                    const x = PADDING + col * CELL_SIZE;
                    const y = PADDING + row * CELL_SIZE;
                    ctx.strokeStyle = strokeColor;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(x, y, CELL_SIZE * 0.44, 0, 2 * Math.PI);
                    ctx.stroke();
                    if (!frameOnly)
                    {
                        ctx.globalAlpha = 0.3;
                        const pieceColor = (board[row] && board[row][col]) || (lastMovePlayerColor === 1 ? 1 : 2);
                        ctx.fillStyle = pieceColor === 1 ? '#222' : '#ddd';
                        ctx.fill();
                        ctx.globalAlpha = 1.0;
                    }
                }
            }
            // 选中棋子外框
            const sel = tryPlayMode ? tryPlaySelectedPiece : selectedPiece;
            const selMyTurn = tryPlayMode ? true : (isMyTurn && canTransposition && !gameOver);
            const selColor = tryPlayMode ? (tryPlayCurrentPlayer === 1 ? '#ff9900' : '#0099ff') : (mySlot === 'black' ? '#ff9900' : '#0099ff');
            if (sel && selMyTurn) {
                const { row, col } = sel;
                const x = PADDING + col * cellSize;
                const y = PADDING + row * cellSize;
                ctx.strokeStyle = selColor;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(x, y, cellSize * 0.48, 0, 2 * Math.PI);
                ctx.stroke();
            }
            // 悬停预览
            let showPreview = false;
            let previewColor = '#222';
            if (tryPlayMode && replayMode) {
                const pv = tryPlayCurrentPlayer;
                const tsp = tryPlaySelectedPiece;
                if (isHoverValid && hoverRow >= 0 && hoverCol >= 0) {
                    if (tsp) {
                        const { row: fromRow, col: fromCol } = tsp;
                        if (Math.abs(fromRow - hoverRow) + Math.abs(fromCol - hoverCol) === 1 &&
                            board[hoverRow][hoverCol] === 3 - pv)
                            showPreview = true;
                    } else if (board[hoverRow][hoverCol] === 0) {
                        showPreview = true;
                    }
                }
                previewColor = pv === 1 ? '#222' : '#ddd';
            } else if (!gameOver && isMyTurn && isHoverValid && hoverRow >= 0 && hoverCol >= 0) {
                if (selectedPiece) {
                    const { row: fromRow, col: fromCol } = selectedPiece;
                    if (Math.abs(fromRow - hoverRow) + Math.abs(fromCol - hoverCol) === 1 &&
                        board[hoverRow][hoverCol] === 3 - (mySlot === 'black' ? 1 : 2)) {
                        showPreview = true;
                    }
                } else {
                    if (board[hoverRow][hoverCol] === 0) showPreview = true;
                }
                previewColor = mySlot === 'black' ? '#222' : '#ddd';
            }
            if (showPreview) {
                ctx.globalAlpha = 0.45;
                ctx.beginPath();
                ctx.arc(PADDING + hoverCol * cellSize, PADDING + hoverRow * cellSize, cellSize * 0.44, 0, 2 * Math.PI);
                ctx.fillStyle = previewColor;
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
            // 形势判断覆盖层
            if (showEstimateActive && cachedLiveBoard && cachedTerritory) {
                const dotRadius = cellSize * 0.18;
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        if (board[r][c] !== 0 && cachedLiveBoard[r][c] === 0) {
                            const x = PADDING + c * cellSize;
                            const y = PADDING + r * cellSize;
                            ctx.fillStyle = board[r][c] === 1 ? '#fff' : '#222';
                            ctx.fillRect(x - dotRadius, y - dotRadius, dotRadius * 2, dotRadius * 2);
                        } else if (board[r][c] === 0 && cachedTerritory[r][c] === 1) {
                            const x = PADDING + c * cellSize;
                            const y = PADDING + r * cellSize;
                            ctx.fillStyle = '#222';
                            ctx.fillRect(x - dotRadius, y - dotRadius, dotRadius * 2, dotRadius * 2);
                        } else if (board[r][c] === 0 && cachedTerritory[r][c] === 2) {
                            const x = PADDING + c * cellSize;
                            const y = PADDING + r * cellSize;
                            ctx.fillStyle = '#f0f0f0';
                            ctx.fillRect(x - dotRadius, y - dotRadius, dotRadius * 2, dotRadius * 2);
                        }
                    }
                }
            }
        }

        function updateTurn() {
            if (replayMode) {
                drawBoard();
                return;
            }
            const liveTotal = liveReplayBoards.length > 0 ? liveReplayBoards.length - 1 : 0;
            const browsingLive = liveReplayBoards.length > 0 && liveViewStep < liveTotal;
            if (browsingLive) {
                if (liveViewStep === 0) {
                    turnDisplay.innerText = '初始局面';
                } else {
                    const emoji = liveReplayStepPlayers[liveViewStep] === 1 ? '⚫' : '⚪';
                    turnDisplay.innerText = `${emoji} 第${liveViewStep}手`;
                }
                isMyTurn = false;
                drawBoard();
                return;
            }
            if (gameOver) {
                turnDisplay.innerText = '对局结束';
                if (winner === 'black') scoreTitle.innerText = '黑胜';
                else if (winner === 'white') scoreTitle.innerText = '白胜';
                else if (winner === 'draw') scoreTitle.innerText = '和棋';
                else scoreTitle.innerText = '　';
                isMyTurn = false;
                drawBoard();
                return;
            }
            const total = liveReplayBoards.length > 0 ? liveReplayBoards.length - 1 : 0;
            if (liveReplayBoards.length === 0) {
                const emptyBoard = !board.some(row => row.some(v => v === 1 || v === 2));
                turnDisplay.innerText = emptyBoard ? '初始局面' : `${currentPlayer === 1 ? '⚫' : '⚪'} 第${numberOfHands}手`;
            } else if (total === 0) {
                turnDisplay.innerText = '初始局面';
            } else {
                const p = liveReplayStepPlayers[total];
                turnDisplay.innerText = `${p === 1 ? '⚫' : '⚪'} 第${total}手`;
            }
            isMyTurn = (mySlot !== null) && ((mySlot === 'black' && currentPlayer === 1) || (mySlot === 'white' && currentPlayer === 2));
            drawBoard();
        }

        function showEstimate()
        {
            if (!showEstimateActive) { clearEstimate(); return; }
            cachedLiveBoard = removeDeadAndDying(board);
            cachedTerritory = assignTerritoryWithRange(cachedLiveBoard);
            const { blackTotal, whiteTotal } = computeScore(cachedLiveBoard, cachedTerritory);
            const lead = blackTotal - whiteTotal - 2 * KOMI;
            scoreTitle.innerText = '形势判断';
            scoreBoard.innerText = `黑: ${blackTotal.toFixed(0)}　白: ${whiteTotal.toFixed(0)}`;

            const dateStr = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
            const filename = `易位围棋_${data.boardSize}路_${dateStr}.json`;

        function enterReplayMode(data) {
            const size = BOARD_SIZE;
            replayBoards = [];

            replayHighlights = [];
            replayMovePlayerColors = [];
            replayStepPlayers = [0];

            let curBoard = Array(size).fill().map(() => Array(size).fill(0));
            if (data.initialPosition) {
                if (Array.isArray(data.initialPosition.black)) {
                    for (const pos of data.initialPosition.black) {
                        if (Array.isArray(pos) && pos.length === 2)
                            curBoard[pos[0]][pos[1]] = 1;
                    }
                }
                if (Array.isArray(data.initialPosition.white)) {
                    for (const pos of data.initialPosition.white) {
                        if (Array.isArray(pos) && pos.length === 2)
                            curBoard[pos[0]][pos[1]] = 2;
                    }
                }
            }
            replayBoards.push(deepCopyBoard(curBoard));
            replayMarkers.push([]);
            replayHighlights.push([]);
            replayMovePlayerColors.push(null);

            for (const move of (data.moves || [])) {
                const playerVal = move.player === 'black' ? 1 : 2;
                replayStepPlayers.push(playerVal);
                if (move.type === 'move') {
                    const nb = tryPlaceStone(curBoard, move.row, move.col, playerVal);
                    if (nb) curBoard = nb;
                    replayBoards.push(deepCopyBoard(curBoard));
                    replayMarkers.push([{ row: move.row, col: move.col, color: playerVal }]);
                    replayHighlights.push([]);
                    replayMovePlayerColors.push(playerVal);
                } else if (move.type === 'swap') {
                    const nb = trySwapPiece(curBoard, move.fromRow, move.fromCol, move.row, move.col, playerVal);
                    if (nb) curBoard = nb;
                    replayBoards.push(deepCopyBoard(curBoard));
                    let nmm = [];
                    if (curBoard[move.row][move.col] === playerVal)
                        nmm = [{ row: move.row, col: move.col, color: playerVal }];
                    replayMarkers.push(nmm);
                    replayHighlights.push([
                        { row: move.fromRow, col: move.fromCol, frameOnly: curBoard[move.fromRow][move.fromCol] === 0 },
                        { row: move.row, col: move.col, frameOnly: curBoard[move.row][move.col] === 0 }
                    ]);
                    replayMovePlayerColors.push(playerVal);
                } else if (move.type === 'pass') {
                    replayBoards.push(deepCopyBoard(curBoard));
                    replayMarkers.push([]);
                    replayHighlights.push([]);
                    replayMovePlayerColors.push(null);
                }
            }

            replayTotalSteps = replayBoards.length - 1;

            slider.max = replayTotalSteps;

        function tryPlayAfterStep(newBoard, newMarkers, newHighlights, newMpc) {
            if (tryPlayStep < tryPlayTotalSteps) {
                tryPlayBoards.length = tryPlayStep + 1;
                tryPlayMarkers.length = tryPlayStep + 1;
                tryPlayHighlights.length = tryPlayStep + 1;
                tryPlayMovePlayerColors.length = tryPlayStep + 1;
            }
            tryPlayBoards.push(deepCopyBoard(newBoard));
            tryPlayMarkers.push(newMarkers.map(m => ({ ...m })));
            tryPlayHighlights.push(newHighlights.map(m => ({ ...m })));
            tryPlayMovePlayerColors.push(newMpc);
            tryPlayTotalSteps = tryPlayBoards.length - 1;
            tryPlayStep = tryPlayTotalSteps;
            tryPlayPlyCount++;
            tryPlayCurrentPlayer = 3 - tryPlayCurrentPlayer;
            board = deepCopyBoard(newBoard);
            lastMoveMarkers = newMarkers.map(m => ({ ...m }));
            moveHighlightMarkers = newHighlights.map(m => ({ ...m }));
            lastMovePlayerColor = newMpc;
            document.getElementById('replaySlider').max = tryPlayTotalSteps;
            document.getElementById('replaySlider').value = tryPlayStep;
            updateTryPlayDisplay();
            if (showEstimateActive) showEstimate();
            else drawBoard();

        function tryPlayPlaceAt(row, col) {
            const playerVal = tryPlayCurrentPlayer;
            const newBoard = tryPlaceStone(board, row, col, playerVal);
            if (!newBoard) return;
            tryPlayAfterStep(newBoard, [{ row, col, color: playerVal }], [], playerVal);
        }

        function tryPlaySwapAt(fromRow, fromCol, row, col) {
            const playerVal = tryPlayCurrentPlayer;
            if (!tryPlayCanSwap()) return;
            const newBoard = trySwapPiece(board, fromRow, fromCol, row, col, playerVal);
            if (!newBoard) return;
            let nmm = [];
            if (newBoard[row][col] === playerVal)
                nmm = [{ row, col, color: playerVal }];
            const nh = [
                { row: fromRow, col: fromCol, frameOnly: newBoard[fromRow][fromCol] === 0 },
                { row, col, frameOnly: newBoard[row][col] === 0 }
            ];
            tryPlayAfterStep(newBoard, nmm, nh, playerVal);
        }

                    let nmm = [];
                    if (curBoard[move.row][move.col] === playerVal)

                    liveReplayBoards.push(deepCopyBoard(curBoard));

        // ======================== WebSocket ========================
        function connectWebSocket()
        {
            if (reconnectTimer)
                clearTimeout(reconnectTimer);
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${location.host}/qi/ws?game=${gameType}&room=${roomId}`;
            ws = new WebSocket(wsUrl);
            ws.onopen = () =>
            {
                const sizeSelect = document.getElementById('boardSizeSelect');
                const currentSize = (sizeSelect && sizeSelect.style.display !== 'none') ? parseInt(sizeSelect.value, 10) : BOARD_SIZE; 
                ws.send(JSON.stringify({ type: 'join', password: roomPassword, requestedSlot: null, boardSize: currentSize }));
            };
            ws.onmessage = (e) =>
            {
                const msg = JSON.parse(e.data);
                handleMessage(msg);
            };
            ws.onclose = (event) =>
            {
                if (event.code === 1008 && event.reason.includes('房间不存在')) {
                    alert('房间不存在，请返回大厅');
                    window.location.href = '/qi';
                    return;
                }
                colorStatus.innerText = '连接断开，重连中...';
                reconnectTimer = setTimeout(connectWebSocket, 2000);
            };
        }

        function computeMaxTranspositionMoves(size) {
            let total = size * size;
            let limit = Math.ceil(total * 0.8);
            if (limit % 2 !== 0) limit++;
            return limit;
        }

        // 动态生成星位数组
        function getStarPoints(boardSize)
        {
            const stars = [];
            // 角星
            let cornerOffset = boardSize <= 11 ? 2 : 3;  // 索引从0开始，3路对应索引2，4路对应索引3
            const corners = [
                [cornerOffset, cornerOffset],
                [cornerOffset, boardSize - 1 - cornerOffset],
                [boardSize - 1 - cornerOffset, cornerOffset],
                [boardSize - 1 - cornerOffset, boardSize - 1 - cornerOffset]
            ];
            stars.push(...corners);
            if (boardSize >= 9 && boardSize % 2 === 1)
            {
                const center = Math.floor(boardSize / 2);
                stars.push([center, center]);
            }
            if (boardSize >= 15 && boardSize % 2 === 1) {
                const center = Math.floor(boardSize / 2);
                const sideOffset = 3; // 4路对应索引3
                stars.push([sideOffset, center]);      // 上边
                stars.push([boardSize - 1 - sideOffset, center]); // 下边
                stars.push([center, sideOffset]);      // 左边
                stars.push([center, boardSize - 1 - sideOffset]); // 右边
            }
            return stars;
        }

        function initBoardArray(size)
        {
            return Array(size).fill().map(() => Array(size).fill(0));
        }

        {

            CELL_SIZE = (600 - 2 * PADDING) / (BOARD_SIZE - 1);
            drawBoard();
