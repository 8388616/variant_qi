            const dx = t.clientX - longMarkStart.x;
            const dy = t.clientY - longMarkStart.y;
            if (dx * dx + dy * dy > LONG_MARK_MOVE_CANCEL * LONG_MARK_MOVE_CANCEL) {
                clearTimeout(longMarkTimer);
                longMarkTimer = null;
            }
        }, { passive: true });

        function clearLongMarkTouch() {
            if (longMarkTimer) {
                clearTimeout(longMarkTimer);
                longMarkTimer = null;
            }
            longMarkStart = null;
        }
        canvas.addEventListener('touchend', clearLongMarkTouch);
        canvas.addEventListener('touchcancel', clearLongMarkTouch);

        canvas.addEventListener('click', (e) => {
            if (suppressCanvasClickAfterLongMark) {
                e.preventDefault();
                return;
            }
            const rect = canvas.getBoundingClientRect();
            const scale = 600 / rect.width;
            const x = (e.clientX - rect.left) * scale;
            const y = (e.clientY - rect.top) * scale;
            const { row, col } = getClosestCell(x, y);
            if (tryPlayMode && replayMode) {
                if (row < 0 || col < 0) {
                    if (mobileTwoStepPlacing()) clearMobileMovePreview();
                    drawBoard();
                    return;
                }
                if (board[row][col] !== 0) return;
                if (mobileTwoStepPlacing()) {
                    if (hoverRow === row && hoverCol === col && isHoverValid) {
                        clearMobileMovePreview();
                        tryPlayMove(row, col);
                    } else {
                        hoverRow = row;
                        hoverCol = col;
                        isHoverValid = true;
                        drawBoard();
                    }
                    return;
                }
                tryPlayMove(row, col);
                return;
            }
            if (gameOver) return;
            if (!isMyTurn) return;
            if (waitingScoreConfirm) return;
            if (row < 0 || col < 0) {
                if (mobileTwoStepPlacing()) clearMobileMovePreview();
                drawBoard();
                return;
            }
            if (board[row][col] !== 0) return;
            if (mobileTwoStepPlacing()) {
                if (hoverRow === row && hoverCol === col && isHoverValid) {
                    clearMobileMovePreview();
                    commitMove(row, col);
                    drawBoard();
                } else {
                    hoverRow = row;
                    hoverCol = col;
                    isHoverValid = true;
                    drawBoard();
                }
                return;
            }
            commitMove(row, col);
        });

        if (isMouseDevice) {
            canvas.addEventListener('mousemove', (e) => {
                if (waitingScoreConfirm) {
                    if (isHoverValid) { isHoverValid = false; hoverRow = -1; hoverCol = -1; drawBoard(); }
                    return;
                }
                const rect = canvas.getBoundingClientRect();
                const scale = 600 / rect.width;
                const x = (e.clientX - rect.left) * scale;
                const y = (e.clientY - rect.top) * scale;
                const { row, col } = getClosestCell(x, y);
                hoverRow = row; hoverCol = col;
                isHoverValid = (row >= 0 && col >= 0 && board[row][col] === 0);
                drawBoard();
            });
            canvas.addEventListener('mouseleave', () => {
                if (!waitingScoreConfirm) {
                    isHoverValid = false;
                    hoverRow = -1; hoverCol = -1;
                    drawBoard();
                }
            });
        }

        document.getElementById('newGameBtn').onclick = () => {
            if (replayMode) {
                ws.send(JSON.stringify({ type: 'resetRoom' }));
                return;
            }
            if (!mySlot) { alert('只有对局者可以开始新局'); return; }
            const opponentSlot = mySlot === 'black' ? 'white' : 'black';
            const hasOpponent = slots[opponentSlot];
            if (hasOpponent) {
                if (confirm('确定向对方申请开始新局吗？')) ws.send(JSON.stringify({ type: 'requestNewGame' }));
            } else {
                if (confirm('确定开始新局吗？')) ws.send(JSON.stringify({ type: 'requestNewGame' }));
            }
        };
        document.getElementById('estimateBtn').onclick = () => {
            showEstimateActive = !showEstimateActive;
            if (showEstimateActive) showEstimate();
            else clearEstimate();
        };
        document.getElementById('passBtn').onclick = () => {
            if (!isMyTurn) return;
            ws.send(JSON.stringify({ type: 'pass' }));
        };
        document.getElementById('undoBtn').onclick = () => {
            if (!mySlot) { alert('只有对局者可以悔棋'); return; }
            const opponentSlot = mySlot === 'black' ? 'white' : 'black';
            const hasOpponent = slots[opponentSlot];
            if (hasOpponent) {
                if (confirm('确定向对方申请悔棋吗？')) ws.send(JSON.stringify({ type: 'requestUndo' }));
            } else {
                if (confirm('确定悔棋吗？')) ws.send(JSON.stringify({ type: 'requestUndo' }));
            }
        };
        document.getElementById('resignBtn').onclick = () => {
            if (!mySlot) { alert('只有对局者可以认输'); return; }
            if (confirm('确定认输吗？')) ws.send(JSON.stringify({ type: 'resign' }));
        };
        document.getElementById('drawBtn').onclick = () => {
            if (!mySlot) { alert('只有对局者可以申请和棋'); return; }
            ws.send(JSON.stringify({ type: 'requestDraw' }));
        };
        document.getElementById('endReqBtn').onclick = () => {
            if (!mySlot) { alert('只有对局者可以申请数子'); return; }
            ws.send(JSON.stringify({ type: 'requestEnd' }));
        };
        document.getElementById('exportBtn').onclick = () => {
            ws.send(JSON.stringify({ type: 'exportRecord' }));
        };
        document.getElementById('importBtn').onclick = () => {
            document.getElementById('importFileInput').click();
        };
        document.getElementById('importFileInput').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    ws.send(JSON.stringify({ type: 'importRecord', data }));
                } catch (err) {
                    alert('棋谱文件解析失败');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        };
        document.getElementById('tryPlayBtn').onclick = () => {
            if (tryPlayMode) exitTryPlay();
            else enterTryPlay();
        };
        document.getElementById('showNumbersCheck').onchange = (e) => {
            showMoveNumbers = e.target.checked;
            drawBoard();
        };
        document.getElementById('boardSizeSelect').addEventListener('change', (e) => {
            const newSize = parseInt(e.target.value, 10);
            if (ws && ws.readyState === WebSocket.OPEN)
                ws.send(JSON.stringify({ type: 'setBoardSize', size: newSize }));
        });
        document.getElementById('backToLobbyBtn').onclick = () => { window.location.href = '/qi'; };
        radioBlack.onchange = function () { if (this.checked && !this.disabled) ws.send(JSON.stringify({ type: 'selectColor', color: 'black' })); };
        radioWhite.onchange = function () { if (this.checked && !this.disabled) ws.send(JSON.stringify({ type: 'selectColor', color: 'white' })); };

        if (scoreConfirmYes) {
            scoreConfirmYes.onclick = () => {
                ws.send(JSON.stringify({ type: 'scoreResponse', accept: true }));
                hideScoreConfirm();
            };
            scoreConfirmNo.onclick = () => {
                iRejected = true;
                ws.send(JSON.stringify({ type: 'scoreResponse', accept: false }));
                hideScoreConfirm();
                if (showEstimateActive) { showEstimateActive = false; clearEstimate(); }
                waitingScoreConfirm = false;
            };
        }

        document.getElementById('replayBackBtn').onclick = () => {
            if (replayMode) {
                if (tryPlayMode) setTryPlayStep(tryPlayStep - 1);
                else setReplayStep(replayStep - 1);
            } else {
                setLiveViewStep(liveViewStep - 1);
            }
        };
        document.getElementById('replayForwardBtn').onclick = () => {
            if (replayMode) {
                if (tryPlayMode) setTryPlayStep(tryPlayStep + 1);
                else setReplayStep(replayStep + 1);
            } else {
                setLiveViewStep(liveViewStep + 1);
            }
        };
        document.getElementById('replaySlider').addEventListener('input', (e) => {
            const val = parseInt(e.target.value, 10);
            if (replayMode) {
                if (tryPlayMode) setTryPlayStep(val);
                else setReplayStep(val);
            } else {
                setLiveViewStep(val);
            }
        });

        const modal = document.getElementById('rulesModal');
        document.getElementById('helpBtn').onclick = () => modal.style.display = 'flex';
        document.getElementById('closeRulesBtn').onclick = () => modal.style.display = 'none';
        modal.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };

        connectWebSocket();
    </script>
</body>
</html>
