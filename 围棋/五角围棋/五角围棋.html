<!DOCTYPE html>
<html lang="zh">

    <title>五角围棋</title>

<body>
    <div class="game-wrapper">
        <div class="top-panel">

                    <label id="labelWhite"><input type="radio" name="color" value="white" id="radioWhite"> ⚪ 白方</label>
                </div>

            <div class="right-buttons">

            </div>
        </div>

        <div id="rulesModal" class="rules-modal">
            <div class="rules-content">
                <span class="close-rules" id="closeRulesBtn">&times;</span>
                <h3>五角围棋</h3>
                <p>
                    基本规则同标准围棋。<br /><br />
                    棋盘由开罗式五边形密铺构成；路数 n 为 (n−1)²+(n−2)² 个单元六边形区域（主格与半格嵌入）。支持 3～9 路。<br />
                </p>
            </div>
        </div>

        <div class="main-area">
            <div class="button-panel">
                <button class="ctrl-btn" id="newGameBtn">新局</button>
                <button class="ctrl-btn" id="estimateBtn">形势判断</button>
                <button class="ctrl-btn" id="tryPlayBtn">试下</button>
                <button class="ctrl-btn" id="passBtn" style="display:none;">虚着</button>
                <button class="ctrl-btn" id="undoBtn" style="display:none;">悔棋</button>
                <button class="ctrl-btn" id="resignBtn" style="display:none;">认输</button>
                <button class="ctrl-btn" id="drawBtn" style="display:none;">和棋</button>
                <button class="ctrl-btn" id="endReqBtn" style="display:none;">申请数子</button>
                <button class="ctrl-btn" id="importBtn">导入棋谱</button>
                <button class="ctrl-btn" id="exportBtn" style="display:none;">导出棋谱</button>
            </div>
            <div class="board-container">
                <canvas id="goBoard" width="600" height="600"></canvas>
            </div>
            <div class="info-panel">
                <div class="turn-box" id="turnDisplay">　</div>
                <div class="score-box">
                    <div class="score-title" id="scoreTitle">　</div>
                    <div class="score-content">
                        <div id="scoreBoard">　</div>
                        <div id="leadInfo" style="margin-top:6px; color:#ffb870;">　</div>
                    </div>
                </div>
                <!-- 数子确认面板 -->
                <div id="scoreConfirmPanel" class="score-confirm-panel" style="display: none;">
                    <p id="scoreConfirmText">黑胜0点，是否同意该结果？</p>
                    <div class="score-confirm-buttons">
                        <button id="scoreConfirmYes">确定</button>
                        <button id="scoreConfirmNo">取消</button>
                    </div>
                </div>
                <div id="replayPanel" class="replay-panel" style="display: none;">
                    <div class="replay-step-display" id="replayStepDisplay">0 / 0</div>
                    <div class="replay-nav">
                        <button class="replay-nav-btn" id="replayBackBtn">◀ 后退</button>
                        <button class="replay-nav-btn" id="replayForwardBtn">前进 ▶</button>
                    </div>
                    <input type="range" id="replaySlider" min="0" max="0" value="0" class="replay-slider">
                </div>
            </div>
        </div>
    </div>
    <input type="file" id="importFileInput" accept=".json" style="display:none;">

    <script src="/qi/qi.js"></script>

    <script>
        // ======================== 棋盘生成（与后端 pentagon-weiqi.js 一致） ========================
        const CANVAS_SIZE = 600;
        const FRAME_CENTER = CANVAS_SIZE / 2;
        const OUTER_HEX_RADIUS = 280;
        const FRAME_CORNER_RADIUS = 12;

        const SQRT3 = Math.sqrt(3);
        const PENT_T = SQRT3 - 1;
        const PENT_STACK_H = 2;
        const PENT_TEMPLATE = {
            A: [0, 1.3660254037844388],
            B: [0.8660254037844386, 0.8660254037844386],
            C: [0.3660254037844386, 0],
            D: [-0.3660254037844386, 0],
            E: [-0.8660254037844386, 0.8660254037844386]
        };

        function alignPentagon(pent, mapC, mapD, flipY) {
            const pts = {};
            for (const k of Object.keys(pent)) {
                let p = [...pent[k]];
                if (flipY) p[1] = -p[1];
                pts[k] = p;
            }
            const Cs = pts.C, Ds = pts.D;
            const a1 = Math.atan2(Ds[1] - Cs[1], Ds[0] - Cs[0]);
            const a2 = Math.atan2(mapD[1] - mapC[1], mapD[0] - mapC[0]);
            const ang = a2 - a1;
            const c = Math.cos(ang), s = Math.sin(ang);
            function rot(p) { return [c * p[0] - s * p[1], s * p[0] + c * p[1]]; }
            const Cs2 = rot(Cs);
            const tx = mapC[0] - Cs2[0], ty = mapC[1] - Cs2[1];
            const out = {};
            for (const k of Object.keys(pts)) {
                const p = rot(pts[k]);
                out[k] = [p[0] + tx, p[1] + ty];
            }
            return out;
        }

        function oneCompound(ox, oy) {
            const P4 = alignPentagon(PENT_TEMPLATE, [PENT_T / 2 + ox, oy], [-PENT_T / 2 + ox, oy], false);
            const P1 = alignPentagon(PENT_TEMPLATE, [PENT_T / 2 + ox, PENT_STACK_H + oy], [-PENT_T / 2 + ox, PENT_STACK_H + oy], true);
            const P2 = alignPentagon(PENT_TEMPLATE, P4.A, P1.A, false);
            const P3 = alignPentagon(PENT_TEMPLATE, P1.A, P4.A, false);
            return [P1, P2, P3, P4];
        }

        function vertexKey(x, y) {
            return `${Math.round(x * 1e6) / 1e6},${Math.round(y * 1e6) / 1e6}`;
        }

        let BOARD_LANES = 5;
        let V;
        let transformed;
        let neighbors;
        let edgePairs;
        let clickThreshold;
        let cellSize;
        let centerX;
        let centerY;

        function generatePentBoard(n) {
            const ux = 1 + SQRT3, uy = 0, vx = 0, vy = 2;
            const positions = [];
            for (let i = 0; i <= n - 2; i++)
                for (let j = 0; j <= n - 2; j++)
                    positions.push([i, j]);
            for (let i = 0; i <= n - 3; i++)
                for (let j = 0; j <= n - 3; j++)
                    positions.push([i + 0.5, j + 0.5]);

            const vertexMap = new Map();
            const vertices = [];
            const edgeSet = new Set();

            function addVertex(x, y) {
                const k = vertexKey(x, y);
                if (!vertexMap.has(k)) {
                    vertexMap.set(k, vertices.length);
                    vertices.push({ x, y });
                }
                return vertexMap.get(k);
            }

            function addEdge(a, b) {
                if (a === b) return;
                edgeSet.add(a < b ? `${a},${b}` : `${b},${a}`);
            }

            for (const [px, py] of positions) {
                const ox = px * ux + py * vx;
                const oy = px * uy + py * vy;
                for (const P of oneCompound(ox, oy)) {
                    const order = ['A', 'B', 'C', 'D', 'E'];
                    const ids = order.map(k => addVertex(P[k][0], P[k][1]));
                    for (let i = 0; i < 5; i++)
                        addEdge(ids[i], ids[(i + 1) % 5]);
                }
            }

            for (let i = 0; i < vertices.length; i++) {
                const { x, y } = vertices[i];
                vertices[i] = { x: -y, y: x };
            }

            const vc = vertices.length;
            const pairs = [];
            for (const e of edgeSet) {
                const [a, b] = e.split(',').map(Number);
                pairs.push([a, b]);
            }

            const PADDING = Math.max(40, 78 - 5 * n);
            const R_inner = OUTER_HEX_RADIUS - PADDING;

            let cx = 0, cy = 0;
            for (const v of vertices) { cx += v.x; cy += v.y; }
            cx /= vc;
            cy /= vc;
            let maxDist = 0;
            for (const v of vertices) {
                const d = Math.hypot(v.x - cx, v.y - cy);
                if (d > maxDist) maxDist = d;
            }
            const scale = maxDist > 0 ? R_inner / maxDist : 1;

            const transformedPts = vertices.map(v => ({
                x: FRAME_CENTER + (v.x - cx) * scale,
                y: FRAME_CENTER + (v.y - cy) * scale
            }));

            let totalDist = 0;
            let edgeCount = 0;
            for (const [a, b] of pairs) {
                const ddx = transformedPts[a].x - transformedPts[b].x;
                const ddy = transformedPts[a].y - transformedPts[b].y;
                totalDist += Math.sqrt(ddx * ddx + ddy * ddy);
                edgeCount++;
            }
            const cs = edgeCount > 0 ? totalDist / edgeCount : 12;
            const ct = cs * 0.4;

            const neighborSets = Array.from({ length: vc }, () => new Set());
            for (const [a, b] of pairs) {
                neighborSets[a].add(b);
                neighborSets[b].add(a);
            }
            const neighborList = neighborSets.map(set => Array.from(set));

            return {
                vertexCount: vc,
                transformed: transformedPts,
                neighborList,
                edgePairs: pairs,
                clickThreshold: ct,
                cellSize: cs,
                centerX: FRAME_CENTER,
                centerY: FRAME_CENTER
            };
        }

        function applyPentGeometry(data) {
            V = data.vertexCount;
            transformed = data.transformed;
            neighbors = data.neighborList;
            edgePairs = data.edgePairs;
            clickThreshold = data.clickThreshold;
            cellSize = data.cellSize;
            centerX = data.centerX;
            centerY = data.centerY;
        }

        applyPentGeometry(generatePentBoard(BOARD_LANES));

        (function fillBoardSizeSelect() {
            const sel = document.getElementById('boardSizeSelect');
            if (!sel) return;
            for (let n = 3; n <= 9; n++) {
                const opt = document.createElement('option');
                opt.value = String(n);
                opt.textContent = n + '路';
                if (n === BOARD_LANES) opt.selected = true;
                sel.appendChild(opt);
            }
        })();

        // ======================== 房间参数 ========================
        const pathMatch = window.location.pathname.match(/^\/qi\/([^/]+)\/(\d+)$/);
        if (!pathMatch) { alert('无效的房间链接'); throw new Error('Invalid room URL'); }
        const gameType = pathMatch[1];
        const roomId = pathMatch[2];
        let roomPassword = sessionStorage.getItem(`roomPassword_${roomId}`) || null;

        // ======================== 游戏状态 ========================
        let board = Array(V).fill(0);
        let numberOfHands = 1;
        let currentPlayer = 1;
        let mySlot = null;               // 'black' or 'white'
        let gameOver = false;
        let winner = null;
        let lastMoveMarkers = [];
        let showEstimateActive = false;
        let cachedLiveBoard = null;
        let cachedTerritory = null;
        let waitingScoreConfirm = false;
        let iRejected = false;

        let ws;
        let isMyTurn = false;
        let slots = { black: false, white: false };
        let reconnectTimer = null;

        let replayMode = false;
        let replayBoards = [];
        let replayMarkers = [];
        let replayStepPlayers = [];
        let replayStep = 0;
        let replayTotalSteps = 0;

        let showMoveNumbers = false;
        let moveLog = [];

        let tryPlayMode = false;
        let tryPlayBaseStep = 0;
        let tryPlayBoards = [];
        let tryPlayMarkers = [];
        let tryPlayCurrentPlayer = 1;
        let tryPlayStep = 0;
        let tryPlayTotalSteps = 0;

        // DOM
        const canvas = document.getElementById('goBoard');
        const ctx = canvas.getContext('2d');
        const turnDisplay = document.getElementById('turnDisplay');
        const colorStatus = document.getElementById('colorStatus');
        const radioBlack = document.getElementById('radioBlack');
        const radioWhite = document.getElementById('radioWhite');
        const labelBlack = document.getElementById('labelBlack');
        const labelWhite = document.getElementById('labelWhite');
        const scoreTitle = document.getElementById('scoreTitle');
        const scoreBoard = document.getElementById('scoreBoard');
        const leadInfo = document.getElementById('leadInfo');
        const scoreConfirmPanel = document.getElementById('scoreConfirmPanel');
        const scoreConfirmText = document.getElementById('scoreConfirmText');
        const scoreConfirmYes = document.getElementById('scoreConfirmYes');
        const scoreConfirmNo = document.getElementById('scoreConfirmNo');

        let hoverVertex = -1;
        let isHoverValid = false;
        const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        const isMouseDevice = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

        // ======================== 工具函数 ========================
        const KOMI = 3.25;

        function formatScore(num) {
            let str = num.toFixed(2);
            return str.replace(/\.?0+$/, '');
        }

        function deepCopyBoard(src) { return src.slice(); }

        // 气计算
        function hasLiberty(boardState, start, visited = null) {
            const color = boardState[start];
            if (color === 0) return false;
            const queue = [start];
            const visitedLocal = visited || new Array(V).fill(false);
            visitedLocal[start] = true;
            let idx = 0;
            while (idx < queue.length) {
                const v = queue[idx++];
                for (let nb of neighbors[v]) {
                    if (boardState[nb] === 0) return true;
                    if (boardState[nb] === color && !visitedLocal[nb]) {
                        visitedLocal[nb] = true;
                        queue.push(nb);
                    }
                }
            }
            return false;
        }

        function removeGroup(boardState, start) {
            const color = boardState[start];
            if (color === 0) return;
            const queue = [start];
            boardState[start] = 0;
            let idx = 0;
            while (idx < queue.length) {
                const v = queue[idx++];
                for (let nb of neighbors[v]) {
                    if (boardState[nb] === color) {
                        boardState[nb] = 0;
                        queue.push(nb);
                    }
                }
            }
        }

        function tryPlaceStone(boardBefore, vertex, playerVal) {
            if (boardBefore[vertex] !== 0) return null;
            let newBoard = deepCopyBoard(boardBefore);
            newBoard[vertex] = playerVal;

            // 移除对方无气棋子
            for (let v = 0; v < V; v++) {
                if (newBoard[v] === 3 - playerVal && !hasLiberty(newBoard, v)) {
                    removeGroup(newBoard, v);
                }
            }

            // 检查己方刚落子是否有气
            if (!hasLiberty(newBoard, vertex)) return null;
            return newBoard;
        }

        // 形势判断函数（复用原代码中的）
        function isLibertySurroundedByOpponent(boardState, libertyVertex, opponentColor) {
            for (let nb of neighbors[libertyVertex]) {
                if (boardState[nb] === opponentColor) return true;
            }
            return false;
        }

        function removeDeadAndDying(srcBoard) {
            let newBoard = deepCopyBoard(srcBoard);
            let changed = true;
            while (changed) {
                changed = false;
                let visited = new Array(V).fill(false);
                for (let v = 0; v < V; v++) {
                    if (newBoard[v] !== 0 && !visited[v]) {
                        let color = newBoard[v];
                        let queue = [v];
                        visited[v] = true;
                        let stones = [v];
                        let liberties = new Set();
                        let idx = 0;
                        while (idx < queue.length) {
                            let cur = queue[idx++];
                            for (let nb of neighbors[cur]) {
                                if (newBoard[nb] === 0) liberties.add(nb);
                                else if (newBoard[nb] === color && !visited[nb]) {
                                    visited[nb] = true;
                                    queue.push(nb);
                                    stones.push(nb);
                                }
                            }
                        }
                        if (liberties.size === 0) {
                            for (let s of stones) newBoard[s] = 0;
                            changed = true;
                            continue;
                        }
                        if (liberties.size <= 2) {
                            let allControlled = true;
                            for (let lib of liberties) {
                                if (!isLibertySurroundedByOpponent(newBoard, lib, 3 - color)) {
                                    allControlled = false;
                                    break;
                                }
                            }
                            if (allControlled) {
                                for (let s of stones) newBoard[s] = 0;
                                changed = true;
                            }
                        }
                    }
                }
            }
            return newBoard;
        }

        function multiSourceBFS(liveBoard, color) {
            let dist = new Array(V).fill(Infinity);
            let queue = [];
            for (let v = 0; v < V; v++) {
                if (liveBoard[v] === color) {
                    dist[v] = 0;
                    queue.push(v);
                }
            }
            let head = 0;
            while (head < queue.length) {
                let cur = queue[head++];
                for (let nb of neighbors[cur]) {
                    if (dist[nb] > dist[cur] + 1) {
                        dist[nb] = dist[cur] + 1;
                        queue.push(nb);
                    }
                }
            }
            return dist;
        }

        function assignTerritory(liveBoard) {
            let territory = new Array(V).fill(0);
            let blackCount = 0, whiteCount = 0;
            for (let v = 0; v < V; v++) {
                if (liveBoard[v] === 1) blackCount++;
                else if (liveBoard[v] === 2) whiteCount++;
            }
            if (blackCount === 0 && whiteCount === 0) return territory;
            if (blackCount === 0) {
                for (let v = 0; v < V; v++) if (liveBoard[v] === 0) territory[v] = 2;
                return territory;
            }
            if (whiteCount === 0) {
                for (let v = 0; v < V; v++) if (liveBoard[v] === 0) territory[v] = 1;
                return territory;
            }
            let distBlack = multiSourceBFS(liveBoard, 1);
            let distWhite = multiSourceBFS(liveBoard, 2);
            for (let v = 0; v < V; v++) {
                if (liveBoard[v] !== 0) continue;
                if (distBlack[v] < distWhite[v]) territory[v] = 1;
                else if (distWhite[v] < distBlack[v]) territory[v] = 2;
                else territory[v] = 3;
            }
            return territory;
        }

        function computeScore(liveBoard, territory) {
            let blackStones = 0, whiteStones = 0;
            let blackTerritory = 0, whiteTerritory = 0, publicTerritory = 0;
            for (let v = 0; v < V; v++) {
                if (liveBoard[v] === 1) blackStones++;
                else if (liveBoard[v] === 2) whiteStones++;
                else {
                    if (territory[v] === 1) blackTerritory++;
                    else if (territory[v] === 2) whiteTerritory++;
                    else if (territory[v] === 3) publicTerritory++;
                }
            }
            let blackTotal = blackStones + blackTerritory + publicTerritory / 2;
            let whiteTotal = whiteStones + whiteTerritory + publicTerritory / 2;
            return { blackTotal, whiteTotal };
        }

        function computeScoreFromBoard(srcBoard) {
            let liveBoard = removeDeadAndDying(srcBoard);
            let territory = assignTerritory(liveBoard);
            return computeScore(liveBoard, territory);
        }

        function computeLead() {
            let { blackTotal, whiteTotal } = computeScoreFromBoard(board);
            return blackTotal - whiteTotal - 2 * KOMI;
        }

        function computeStoneNumbers() {
            const nums = new Array(V).fill(0);
            if (replayMode) {
                const baseStep = tryPlayMode ? tryPlayBaseStep : replayStep;
                for (let i = 1; i <= baseStep; i++) {
                    const markers = replayMarkers[i];
                    if (markers && markers.length > 0) {
                        const m = markers[0];
                        if (m.vertex !== undefined && board[m.vertex] !== 0)
                            nums[m.vertex] = i;
                    }
                }
                if (tryPlayMode) {
                    for (let i = 1; i <= tryPlayStep; i++) {
                        const markers = tryPlayMarkers[i];
                        if (markers && markers.length > 0) {
                            const m = markers[0];
                            if (m.vertex !== undefined && board[m.vertex] !== 0)
                                nums[m.vertex] = baseStep + i;
                        }
                    }
                }
            } else {
                for (let i = 0; i < moveLog.length; i++) {
                    const m = moveLog[i];
                    if (m && m.vertex !== undefined && board[m.vertex] !== 0)
                        nums[m.vertex] = i + 1;
                }
            }
            return nums;
        }

        // ======================== 绘制函数 ========================
        function drawRoundedHexagon(ctx, vertices, radius) {
            if (vertices.length !== 6) return;
            const startPoints = [];
            const endPoints = [];
            for (let i = 0; i < 6; i++) {
                const curr = vertices[i];
                const prev = vertices[(i - 1 + 6) % 6];
                const next = vertices[(i + 1) % 6];
                const v1 = { x: prev.x - curr.x, y: prev.y - curr.y };
                const v2 = { x: next.x - curr.x, y: next.y - curr.y };
                const len1 = Math.hypot(v1.x, v1.y);
                const len2 = Math.hypot(v2.x, v2.y);
                const dx1 = v1.x / len1;
                const dy1 = v1.y / len1;
                const dx2 = v2.x / len2;
                const dy2 = v2.y / len2;
                startPoints.push({ x: curr.x + dx1 * radius, y: curr.y + dy1 * radius });
                endPoints.push({ x: curr.x + dx2 * radius, y: curr.y + dy2 * radius });
            }
            ctx.beginPath();
            ctx.moveTo(startPoints[0].x, startPoints[0].y);
            for (let i = 0; i < 6; i++) {
                ctx.arcTo(vertices[i].x, vertices[i].y, endPoints[i].x, endPoints[i].y, radius);
                if (i < 5) ctx.lineTo(startPoints[i + 1].x, startPoints[i + 1].y);
            }
            ctx.lineTo(startPoints[0].x, startPoints[0].y);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }

        function drawEstimateOverlay(liveBoard, territory) {
            const markSize = cellSize * 0.2;
            for (let v = 0; v < V; v++) {
                if (board[v] !== 0 && liveBoard[v] === 0) {
                    let { x, y } = transformed[v];
                    ctx.fillStyle = board[v] === 1 ? '#ffffff' : '#222222';
                    ctx.fillRect(x - markSize, y - markSize, markSize * 2, markSize * 2);
                }
            }
            for (let v = 0; v < V; v++) {
                if (board[v] !== 0) continue;
                let owner = territory[v];
                if (owner === 0 || owner === 3) continue;
                ctx.fillStyle = owner === 1 ? '#222' : '#f0f0f0';
                let { x, y } = transformed[v];
                ctx.fillRect(x - markSize, y - markSize, markSize * 2, markSize * 2);
            }
        }

        function drawBoard() {
            ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
            const angles = [0, 60, 120, 180, 240, 300].map(deg => deg * Math.PI / 180);
            const outerVerts = angles.map(angle => ({
                x: FRAME_CENTER + OUTER_HEX_RADIUS * Math.cos(angle),
                y: FRAME_CENTER + OUTER_HEX_RADIUS * Math.sin(angle)
            }));
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 15;
            ctx.shadowOffsetY = 5;
            ctx.fillStyle = '#deb887';
            ctx.strokeStyle = '#6b4a2e';
            ctx.lineWidth = 1;
            drawRoundedHexagon(ctx, outerVerts, FRAME_CORNER_RADIUS);
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = '#3a281c';
            ctx.lineJoin = 'miter';
            for (const [a, b] of edgePairs) {
                ctx.beginPath();
                ctx.moveTo(transformed[a].x, transformed[a].y);
                ctx.lineTo(transformed[b].x, transformed[b].y);
                ctx.stroke();
            }
            for (let v = 0; v < V; v++) {
                if (board[v] === 0) continue;
                const radius = cellSize * 0.44;
                const { x, y } = transformed[v];
                ctx.shadowBlur = 6;
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowOffsetY = 2;
                const gradient = ctx.createRadialGradient(x - 3, y - 3, radius * 0.2, x, y, radius * 1.2);
                if (board[v] === 1) {
                    gradient.addColorStop(0, '#444');
                    gradient.addColorStop(0.6, '#222');
                    gradient.addColorStop(1, '#111');
                } else {
                    gradient.addColorStop(0, '#fff');
                    gradient.addColorStop(0.5, '#eee');
                    gradient.addColorStop(1, '#aaa');
                }
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, 2 * Math.PI);
                ctx.fillStyle = gradient;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;
                if (!showMoveNumbers) {
                    ctx.beginPath();
                    ctx.arc(x - 3, y - 3, radius * 0.15, 0, 2 * Math.PI);
                    ctx.fillStyle = board[v] === 1 ? '#444' : '#fff';
                    ctx.fill();
                }
            }
            if (showMoveNumbers) {
                const nums = computeStoneNumbers();
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                for (let v = 0; v < V; v++) {
                    if (nums[v] > 0 && board[v] !== 0) {
                        const { x, y } = transformed[v];
                        const numStr = nums[v].toString();
                        const fontSize = Math.max(8, Math.floor(cellSize * (numStr.length >= 3 ? 0.28 : 0.36)));
                        ctx.font = `bold ${fontSize}px Arial`;
                        ctx.fillStyle = board[v] === 1 ? '#fff' : '#000';
                        ctx.fillText(numStr, x, y + 1);
                    }
                }
            }
            const markSize = cellSize * 0.3;
            for (let { vertex, color } of lastMoveMarkers) {
                if (vertex === undefined) continue;
                const { x, y } = transformed[vertex];
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + markSize, y);
                ctx.lineTo(x, y + markSize);
                ctx.closePath();
                ctx.fillStyle = color === 1 ? '#fff' : '#222';
                ctx.fill();
            }
            const canHover = tryPlayMode || (!gameOver && isMyTurn);
            if (isMouseDevice && canHover && isHoverValid && hoverVertex >= 0 && board[hoverVertex] === 0) {
                const { x, y } = transformed[hoverVertex];
                ctx.globalAlpha = 0.45;
                ctx.beginPath();
                ctx.arc(x, y, cellSize * 0.42, 0, 2 * Math.PI);
                const hoverColor = tryPlayMode ? (tryPlayCurrentPlayer === 1 ? '#222' : '#ddd') : (mySlot === 'black' ? '#222' : '#ddd');
                ctx.fillStyle = hoverColor;
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
            if (showEstimateActive && cachedLiveBoard && cachedTerritory) {
                drawEstimateOverlay(cachedLiveBoard, cachedTerritory);
            }
        }

        function drawBoardWithOverlay() {
            drawBoard();
        }

        function showEstimate()
        {
            if (!showEstimateActive) { clearEstimate(); return; }
            cachedLiveBoard = removeDeadAndDying(board);
            cachedTerritory = assignTerritory(cachedLiveBoard);
            let { blackTotal, whiteTotal } = computeScore(cachedLiveBoard, cachedTerritory);
            let lead = blackTotal - whiteTotal - 2 * KOMI;
            scoreTitle.innerText = '形势判断';
            scoreBoard.innerText = `黑: ${formatScore(blackTotal)} | 白: ${formatScore(whiteTotal)}`;
            leadInfo.innerText = `黑${lead >= 0 ? '+' : ''}${formatScore(lead)}点`;
            drawBoardWithOverlay();
        }

        function clearEstimate()
        {
            cachedLiveBoard = null;
            cachedTerritory = null;
            scoreTitle.innerText = '　';
            scoreBoard.innerText = '　';
            leadInfo.innerText = '　';
            drawBoardWithOverlay();
        }

        function updateTurn()
        {
            if (gameOver) {
                turnDisplay.innerText = '对局结束';
                if (winner === 'black') scoreTitle.innerText = '黑胜';
                else if (winner === 'white') scoreTitle.innerText = '白胜';
                else if (winner === 'draw') scoreTitle.innerText = '和棋';
                else scoreTitle.innerText = '　';
                isMyTurn = false;
                drawBoardWithOverlay();
                return;
            }
            if (tryPlayMode) {
                if (showEstimateActive) showEstimate();
                else drawBoardWithOverlay();
                return;
            }
            if (replayMode) {
                isMyTurn = false;
                if (showEstimateActive) showEstimate();
                else drawBoardWithOverlay();
                return;
            }
            turnDisplay.innerText = `${currentPlayer === 1 ? '⚫' : '⚪'} 第${numberOfHands}手`;
            isMyTurn = (mySlot !== null) && ((mySlot === 'black' && currentPlayer === 1) || (mySlot === 'white' && currentPlayer === 2));
            if (showEstimateActive) showEstimate();
            else drawBoardWithOverlay();
        }

        function showScoreConfirm(lead) {
            const absLead = Math.abs(lead).toFixed(1);
            const winnerText = lead > 0 ? `黑胜${absLead}点` : (lead < 0 ? `白胜${absLead}点` : '和棋');
            scoreConfirmText.innerText = `${winnerText}，是否同意该结果？`;
            scoreConfirmPanel.style.display = 'block';
        }

        function hideScoreConfirm() {
            scoreConfirmPanel.style.display = 'none';
        }

        function downloadRecord(data) {
            const now = new Date();
            const pad = n => n.toString().padStart(2, '0');
            const dateStr = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
            const filename = `五角围棋_${data.boardLanes || data.boardSize}路_${dateStr}.json`;
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function enterReplayMode(data) {
            replayBoards = [];
            replayMarkers = [];
            replayStepPlayers = [0];

            let curBoard = Array(V).fill(0);
            if (data.initialPosition) {
                if (Array.isArray(data.initialPosition.black)) {
                    for (const pos of data.initialPosition.black) {
                        const vi = typeof pos === 'number' ? pos : pos[0];
                        if (vi >= 0 && vi < V) curBoard[vi] = 1;
                    }
                }
                if (Array.isArray(data.initialPosition.white)) {
                    for (const pos of data.initialPosition.white) {
                        const vi = typeof pos === 'number' ? pos : pos[0];
                        if (vi >= 0 && vi < V) curBoard[vi] = 2;
                    }
                }
            }
            replayBoards.push(deepCopyBoard(curBoard));
            replayMarkers.push([]);

            for (const move of (data.moves || [])) {
                const playerVal = move.player === 'black' ? 1 : 2;
                replayStepPlayers.push(playerVal);
                if (move.type === 'move') {
                    const newBoard = tryPlaceStone(curBoard, move.vertex, playerVal);
                    if (newBoard) curBoard = newBoard;
                    replayBoards.push(deepCopyBoard(curBoard));
                    replayMarkers.push([{ vertex: move.vertex, color: playerVal }]);
                } else if (move.type === 'pass') {
                    replayBoards.push(deepCopyBoard(curBoard));
                    replayMarkers.push([]);
                }
            }

            replayTotalSteps = replayBoards.length - 1;
            replayMode = true;

            const slider = document.getElementById('replaySlider');
            slider.max = replayTotalSteps;
            setReplayStep(replayTotalSteps);
            updateReplayUI();
        }

        function exitReplayMode() {
            tryPlayMode = false;
            tryPlayBoards = [];
            tryPlayMarkers = [];
            tryPlayStep = 0;
            tryPlayTotalSteps = 0;
            replayMode = false;
            replayBoards = [];
            replayMarkers = [];
            replayStepPlayers = [];
            replayStep = 0;
            replayTotalSteps = 0;
            updateReplayUI();
        }

        function setReplayStep(step) {
            if (step < 0) step = 0;
            if (step > replayTotalSteps) step = replayTotalSteps;
            replayStep = step;
            board = deepCopyBoard(replayBoards[step]);
            lastMoveMarkers = replayMarkers[step].map(m => ({ ...m }));

            document.getElementById('replaySlider').value = step;
            document.getElementById('replayStepDisplay').innerText = `${step} / ${replayTotalSteps}`;

            if (step === 0) {
                turnDisplay.innerText = '初始局面';
            } else {
                const emoji = replayStepPlayers[step] === 1 ? '⚫' : '⚪';
                turnDisplay.innerText = `${emoji} 第${step}手`;
            }
            isMyTurn = false;

            if (showEstimateActive) showEstimate();
            else drawBoardWithOverlay();
        }

        function updateReplayUI() {
            const gameButtonIds = ['passBtn', 'undoBtn', 'resignBtn', 'drawBtn', 'endReqBtn'];
            const replayPanel = document.getElementById('replayPanel');
            const tryPlayBtn = document.getElementById('tryPlayBtn');
            if (replayMode) {
                for (const id of gameButtonIds)
                    document.getElementById(id).style.display = 'none';
                replayPanel.style.display = '';
                tryPlayBtn.style.display = '';
                tryPlayBtn.innerText = tryPlayMode ? '试下结束' : '试下';
            } else {
                for (const id of gameButtonIds)
                    document.getElementById(id).style.display = '';
                replayPanel.style.display = 'none';
                tryPlayBtn.style.display = 'none';
                tryPlayBtn.innerText = '试下';
            }
            updateRecordButtons();
        }

        function enterTryPlay() {
            tryPlayMode = true;
            tryPlayBaseStep = replayStep;
            tryPlayBoards = [deepCopyBoard(board)];
            tryPlayMarkers = [lastMoveMarkers.map(m => ({ ...m }))];

            if (replayStep === 0) {
                tryPlayCurrentPlayer = 1;
            } else {
                tryPlayCurrentPlayer = replayStepPlayers[replayStep] === 1 ? 2 : 1;
            }
            tryPlayStep = 0;
            tryPlayTotalSteps = 0;

            const slider = document.getElementById('replaySlider');
            slider.min = 0;
            slider.max = 0;
            slider.value = 0;
            updateTryPlayDisplay();
            updateReplayUI();
        }

        function exitTryPlay() {
            tryPlayMode = false;
            tryPlayBoards = [];
            tryPlayMarkers = [];
            tryPlayStep = 0;
            tryPlayTotalSteps = 0;

            const slider = document.getElementById('replaySlider');
            slider.min = 0;
            slider.max = replayTotalSteps;
            setReplayStep(tryPlayBaseStep);
            updateReplayUI();
        }

        function tryPlayMove(vertex) {
            if (board[vertex] !== 0) return;
            const playerVal = tryPlayCurrentPlayer;
            const newBoard = tryPlaceStone(board, vertex, playerVal);
            if (!newBoard) return;

            if (tryPlayStep < tryPlayTotalSteps) {
                tryPlayBoards.length = tryPlayStep + 1;
                tryPlayMarkers.length = tryPlayStep + 1;
            }

            tryPlayBoards.push(deepCopyBoard(newBoard));
            tryPlayMarkers.push([{ vertex, color: playerVal }]);
            tryPlayTotalSteps = tryPlayBoards.length - 1;
            tryPlayStep = tryPlayTotalSteps;
            tryPlayCurrentPlayer = 3 - tryPlayCurrentPlayer;

            board = deepCopyBoard(newBoard);
            lastMoveMarkers = [{ vertex, color: playerVal }];

            const slider = document.getElementById('replaySlider');
            slider.max = tryPlayTotalSteps;
            slider.value = tryPlayStep;
            updateTryPlayDisplay();
            if (showEstimateActive) showEstimate();
            else drawBoardWithOverlay();
        }

        function setTryPlayStep(step) {
            if (step < 0) step = 0;
            if (step > tryPlayTotalSteps) step = tryPlayTotalSteps;
            tryPlayStep = step;
            board = deepCopyBoard(tryPlayBoards[step]);
            lastMoveMarkers = tryPlayMarkers[step].map(m => ({ ...m }));

            const basePlayer = tryPlayBaseStep === 0 ? 1 : (3 - replayStepPlayers[tryPlayBaseStep]);
            tryPlayCurrentPlayer = step % 2 === 0 ? basePlayer : (3 - basePlayer);

            document.getElementById('replaySlider').value = step;
            updateTryPlayDisplay();
            if (showEstimateActive) showEstimate();
            else drawBoardWithOverlay();
        }

        function updateTryPlayDisplay() {
            const stepDisplay = document.getElementById('replayStepDisplay');
            if (tryPlayMode) {
                stepDisplay.innerText = `试下 ${tryPlayStep} / ${tryPlayTotalSteps}`;
                const emoji = tryPlayCurrentPlayer === 1 ? '⚫' : '⚪';
                turnDisplay.innerText = `${emoji} 试下`;
            }
        }

        function updateRecordButtons() {
            const importBtn = document.getElementById('importBtn');
            const exportBtn = document.getElementById('exportBtn');
            if (replayMode) {
                importBtn.style.display = 'none';
                exportBtn.style.display = 'none';
            } else {
                const hasAnyStone = board.some(v => v !== 0);
                const noPlayers = !slots.black && !slots.white;
                if (noPlayers && !hasAnyStone) {
                    importBtn.style.display = '';
                    exportBtn.style.display = 'none';
                } else {
                    importBtn.style.display = 'none';
                    exportBtn.style.display = '';
                }
            }
        }

        // ======================== WebSocket ========================
        function connectWebSocket() {
            if (reconnectTimer) clearTimeout(reconnectTimer);
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${location.host}/qi/ws?game=${gameType}&room=${roomId}`;
            ws = new WebSocket(wsUrl);
            ws.onopen = () => {
                ws.send(JSON.stringify({ type: 'join', password: roomPassword, requestedSlot: null }));
            };
            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                handleMessage(msg);
            };
            ws.onclose = (event) => {
                if (event.code === 1008 && event.reason.includes('房间不存在')) {
                    alert('房间不存在，请返回大厅');
                    window.location.href = '/qi';
                    return;
                }
                colorStatus.innerText = '连接断开，重连中...';
                reconnectTimer = setTimeout(connectWebSocket, 2000);
            };
        }

        function syncState(state)
        {
            const lanes = state.boardLanes != null ? state.boardLanes : state.boardSize;
            if (lanes != null && lanes !== BOARD_LANES) {
                BOARD_LANES = lanes;
                applyPentGeometry(generatePentBoard(BOARD_LANES));
                const sizeSelect = document.getElementById('boardSizeSelect');
                if (sizeSelect) sizeSelect.value = String(BOARD_LANES);
            }
            board = state.board;
            numberOfHands = state.numberOfHands || 1;
            currentPlayer = state.currentPlayer;
            gameOver = state.gameOver || false;
            winner = state.winner || null;
            lastMoveMarkers = state.lastMoveMarkers || [];
            if (state.moveCoords)
                moveLog = state.moveCoords.map(m => m.type === 'move' ? { vertex: m.vertex } : null);
            if (state.slots)
                slots = state.slots;

            const hasAnyStone = board.some(v => v !== 0);
            const hasPlayer = slots.black || slots.white;
            const sizeSelect = document.getElementById('boardSizeSelect');
            if (!hasAnyStone && !hasPlayer && !gameOver && mySlot === null)
                sizeSelect.style.display = 'inline-block';
            else
                sizeSelect.style.display = 'none';

            if (showEstimateActive) {
                cachedLiveBoard = removeDeadAndDying(board);
                cachedTerritory = assignTerritory(cachedLiveBoard);
            }
            updateTurn();
        }

        function handleMessage(msg)
        {
            switch (msg.type) {
                case 'joined':
                    sessionStorage.removeItem(`roomPassword_${roomId}`);
                    const jl = msg.state && (msg.state.boardLanes != null ? msg.state.boardLanes : msg.state.boardSize);
                    if (jl != null && jl !== BOARD_LANES) {
                        BOARD_LANES = jl;
                        applyPentGeometry(generatePentBoard(BOARD_LANES));
                        const joinSel = document.getElementById('boardSizeSelect');
                        if (joinSel) joinSel.value = String(BOARD_LANES);
                    }
                    if (msg.role === 'player') {
                        mySlot = msg.slot;
                        colorStatus.innerText = `已选择: ${mySlot === 'black' ? '黑方' : '白方'}`;
                        if (msg.state) syncState(msg.state);
                    } else {
                        mySlot = null;
                        colorStatus.innerText = '观战';
                        if (msg.state) syncState(msg.state);
                    }
                    updateRadioStyles();
                    break;
                case 'slotOccupied':
                    if (msg.slot === 'black') slots.black = true;
                    else if (msg.slot === 'white') slots.white = true;
                    updateRadioStyles();
                    break;
                case 'slotReleased':
                    if (msg.slot === 'black') slots.black = false;
                    else if (msg.slot === 'white') slots.white = false;
                    if (mySlot === msg.slot) {
                        mySlot = null;
                        colorStatus.innerText = '观战';
                    }
                    updateRadioStyles();
                    break;
                case 'colorAssigned':
                    mySlot = msg.color;
                    colorStatus.innerText = `已选择: ${mySlot === 'black' ? '黑方' : '白方'}`;
                    if (mySlot === 'black') slots.black = true;
                    else slots.white = true;
                    updateRadioStyles();
                    break;
                case 'gameState':
                    syncState(msg);
                    updateRadioStyles();
                    break;
                case 'broadcast':
                    {
                        const wasOver = gameOver;
                        syncState(msg);
                        if (msg.gameOver && !wasOver) {
                            if (msg.winner === 'black') alert('黑胜。');
                            else if (msg.winner === 'white') alert('白胜。');
                            else if (msg.winner === 'draw') alert('和棋。');
                        } else if (msg.action === 'drawAgreed' && !wasOver)
                            alert('和棋。');
                        else if (msg.action === 'resign' && !wasOver)
                            alert(`${msg.player === 'black' ? '黑方' : '白方'}认输`);
                    }
                    break;
                case 'newGameStarted':
                    exitReplayMode();
                    // 必须在 syncState 之前重置本地身份：syncState 根据 mySlot 决定是否显示路数选择；
                    // 若仍为上一局的执棋方，会误判为隐藏，需刷新页面才能出现。
                    mySlot = null;
                    colorStatus.innerText = '观战';
                    slots = { black: false, white: false };
                    syncState(msg);
                    clearEstimate();
                    hideScoreConfirm();
                    waitingScoreConfirm = false;
                    iRejected = false;
                    scoreTitle.innerText = '　';
                    updateRadioStyles();
                    break;
                case 'newGameRequest':
                    if (confirm('对方请求开始新的一局，是否同意？'))
                        ws.send(JSON.stringify({ type: 'newGameResponse', accept: true }));
                    else
                        ws.send(JSON.stringify({ type: 'newGameResponse', accept: false }));
                    break;
                case 'undoRequest':
                    if (confirm('对方请求悔棋，是否同意？'))
                        ws.send(JSON.stringify({ type: 'undoResponse', accept: true }));
                    else
                        ws.send(JSON.stringify({ type: 'undoResponse', accept: false }));
                    break;
                case 'drawRequest':
                    if (confirm('对方申请和棋，是否同意？'))
                        ws.send(JSON.stringify({ type: 'drawResponse', accept: true }));
                    else
                        ws.send(JSON.stringify({ type: 'drawResponse', accept: false }));
                    break;
                case 'scoreProposal':
                    {
                        const lead = msg.lead;
                        waitingScoreConfirm = true;
                        iRejected = false;
                        if (!showEstimateActive) {
                            showEstimateActive = true;
                            showEstimate();
                        } else {
                            showEstimate();
                        }
                        showScoreConfirm(lead);
                    }
                    break;
                case 'scoreAgreed':
                    gameOver = true;
                    winner = msg.winner;
                    const finalLead = msg.lead;
                    const finalWinnerText = finalLead > 0 ? `黑胜${finalLead.toFixed(1)}点` : (finalLead < 0 ? `白胜${(-finalLead).toFixed(1)}点` : '和棋');
                    scoreTitle.innerText = finalWinnerText;
                    turnDisplay.innerText = '对局结束';
                    if (showEstimateActive) {
                        showEstimateActive = false;
                        clearEstimate();
                    }
                    hideScoreConfirm();
                    waitingScoreConfirm = false;
                    iRejected = false;
                    updateTurn();
                    break;
                case 'scoreRejected':
                    if (iRejected) {
                        iRejected = false;
                    } else {
                        alert('对方拒绝数子结果，对局继续');
                    }
                    if (showEstimateActive) {
                        showEstimateActive = false;
                        clearEstimate();
                    }
                    hideScoreConfirm();
                    waitingScoreConfirm = false;
                    break;
                case 'requestEnd':
                    if (confirm('对方申请数子，是否同意？'))
                        ws.send(JSON.stringify({ type: 'endResponse', accept: true }));
                    else
                        ws.send(JSON.stringify({ type: 'endResponse', accept: false }));
                    break;
                case 'gameRecord':
                    downloadRecord(msg.data);
                    break;
                case 'importSuccess':
                    const impL = msg.boardLanes != null ? msg.boardLanes : msg.boardSize;
                    if (impL != null && impL !== BOARD_LANES) {
                        BOARD_LANES = impL;
                        applyPentGeometry(generatePentBoard(BOARD_LANES));
                        const importSizeSelect = document.getElementById('boardSizeSelect');
                        if (importSizeSelect) importSizeSelect.value = String(impL);
                    }
                    syncState(msg);
                    clearEstimate();
                    hideScoreConfirm();
                    waitingScoreConfirm = false;
                    if (msg.replayData) enterReplayMode(msg.replayData);
                    updateRadioStyles();
                    break;
                case 'roomReset':
                    exitReplayMode();
                    syncState(msg);
                    clearEstimate();
                    hideScoreConfirm();
                    waitingScoreConfirm = false;
                    updateRadioStyles();
                    break;
                case 'boardSizeChanged':
                    {
                        const bs = msg.boardLanes != null ? msg.boardLanes : msg.boardSize;
                        if (bs != null) {
                            if (bs !== BOARD_LANES) {
                                BOARD_LANES = bs;
                                applyPentGeometry(generatePentBoard(BOARD_LANES));
                            }
                            const sel = document.getElementById('boardSizeSelect');
                            if (sel) sel.value = String(bs);
                            drawBoardWithOverlay();
                        }
                    }
                    break;
                case 'error':
                    if (msg.message === '密码错误') {
                        sessionStorage.removeItem(`roomPassword_${roomId}`);
                        window.location.href = `/qi?game=${gameType}&room=${roomId}&needPassword=1`;
                    }
                    else alert(msg.message);
                    break;
                default:
                    console.log('未知消息', msg);
            }
        }

        function updateRadioStyles() {
            labelBlack.classList.remove('self-radio', 'opponent-radio', 'checked-disabled');
            labelWhite.classList.remove('self-radio', 'opponent-radio', 'checked-disabled');
            if (slots.black) {
                labelBlack.classList.add(mySlot === 'black' ? 'self-radio' : 'opponent-radio');
                labelBlack.classList.add('checked-disabled');
                radioBlack.disabled = true;
                radioBlack.checked = true;
            } else {
                radioBlack.disabled = false;
                radioBlack.checked = false;
            }
            if (slots.white) {
                labelWhite.classList.add(mySlot === 'white' ? 'self-radio' : 'opponent-radio');
                labelWhite.classList.add('checked-disabled');
                radioWhite.disabled = true;
                radioWhite.checked = true;
            } else {
                radioWhite.disabled = false;
                radioWhite.checked = false;
            }
            updateRecordButtons();
        }

        function commitMove(vertex) {
            if (gameOver) return false;
            if (!isMyTurn) return false;
            if (board[vertex] !== 0) return false;
            ws.send(JSON.stringify({ type: 'move', vertex }));
            return true;
        }

        function getNearestVertex(x, y) {
            let minDist = Infinity, best = -1;
            for (let v = 0; v < V; v++) {
                const { x: vx, y: vy } = transformed[v];
                const dx = vx - x, dy = vy - y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < minDist) {
                    minDist = dist;
                    best = v;
                }
            }
            return minDist < clickThreshold ? best : -1;
        }

        // 事件绑定
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scale = CANVAS_SIZE / rect.width;
            const x = (e.clientX - rect.left) * scale;
            const y = (e.clientY - rect.top) * scale;
            const v = getNearestVertex(x, y);
            if (tryPlayMode && replayMode) {
                if (v !== -1 && !waitingScoreConfirm) tryPlayMove(v);
                return;
            }
            if (gameOver) return;
            if (!isMyTurn) return;
            if (waitingScoreConfirm) return;
            if (v !== -1) commitMove(v);
        });

        if (isMouseDevice)
        {
            canvas.addEventListener('mousemove', (e) =>
            {
                if (waitingScoreConfirm) {
                    if (isHoverValid) { isHoverValid = false; hoverVertex = -1; drawBoardWithOverlay(); }
                    return;
                }
                const canHover = tryPlayMode || (!gameOver && isMyTurn);
                if (!canHover) {
                    if (isHoverValid) { isHoverValid = false; hoverVertex = -1; drawBoardWithOverlay(); }
                    return;
                }
                const rect = canvas.getBoundingClientRect();
                const scale = CANVAS_SIZE / rect.width;
                const x = (e.clientX - rect.left) * scale;
                const y = (e.clientY - rect.top) * scale;
                const v = getNearestVertex(x, y);
                hoverVertex = v;
                isHoverValid = (v !== -1 && board[v] === 0);
                drawBoardWithOverlay();
            });
            canvas.addEventListener('mouseleave', () => {
                if (!waitingScoreConfirm) {
                    hoverVertex = -1;
                    isHoverValid = false;
                    drawBoardWithOverlay();
                }
            });
        }

        document.getElementById('newGameBtn').onclick = () => {
            if (replayMode) {
                ws.send(JSON.stringify({ type: 'resetRoom' }));
                return;
            }
            if (!mySlot) { alert('只有对局者可以开始新局'); return; }
            const opponentSlot = mySlot === 'black' ? 'white' : 'black';
            const hasOpponent = slots[opponentSlot];
            if (hasOpponent) {
                if (confirm('确定向对方申请开始新局吗？')) ws.send(JSON.stringify({ type: 'requestNewGame' }));
            } else {
                if (confirm('确定开始新局吗？')) ws.send(JSON.stringify({ type: 'requestNewGame' }));
            }
        };
        document.getElementById('estimateBtn').onclick = () => {
            showEstimateActive = !showEstimateActive;
            if (showEstimateActive) showEstimate();
            else clearEstimate();
        };
        document.getElementById('tryPlayBtn').onclick = () => {
            if (tryPlayMode) exitTryPlay();
            else enterTryPlay();
        };
        document.getElementById('showNumbersCheck').onchange = (e) => {
            showMoveNumbers = e.target.checked;
            drawBoardWithOverlay();
        };
        document.getElementById('passBtn').onclick = () => {
            if (!isMyTurn) return;
            ws.send(JSON.stringify({ type: 'pass' }));
        };
        document.getElementById('undoBtn').onclick = () => {
            if (!mySlot) { alert('只有对局者可以悔棋'); return; }
            const opponentSlot = mySlot === 'black' ? 'white' : 'black';
            const hasOpponent = slots[opponentSlot];
            if (hasOpponent) {
                if (confirm('确定向对方申请悔棋吗？')) ws.send(JSON.stringify({ type: 'requestUndo' }));
            } else {
                if (confirm('确定悔棋吗？')) ws.send(JSON.stringify({ type: 'requestUndo' }));
            }
        };
        document.getElementById('resignBtn').onclick = () => {
            if (!mySlot) { alert('只有对局者可以认输'); return; }
            if (confirm('确定认输吗？')) ws.send(JSON.stringify({ type: 'resign' }));
        };
        document.getElementById('drawBtn').onclick = () => {
            if (!ps.mySlot) { alert('只有对局者可以申请和棋'); return; }
            const opponentSlot = ps.mySlot === 'black' ? 'white' : 'black';
            const hasOpponent = ps.slots[opponentSlot];
            if (hasOpponent) {
                if (confirm('确定向对方申请和棋吗？')) ps.ws.send(JSON.stringify({ type: 'requestDraw' }));
            } else {
                if (confirm('确定和棋吗？')) ps.ws.send(JSON.stringify({ type: 'requestDraw' }));
            }
        };
        document.getElementById('endReqBtn').onclick = () => {
            if (!mySlot) { alert('只有对局者可以申请数子'); return; }
            ws.send(JSON.stringify({ type: 'requestEnd' }));
        };
        document.getElementById('exportBtn').onclick = () => {
            ws.send(JSON.stringify({ type: 'exportRecord' }));
        };
        document.getElementById('importBtn').onclick = () => {
            document.getElementById('importFileInput').click();
        };
        document.getElementById('importFileInput').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    ws.send(JSON.stringify({ type: 'importRecord', data }));
                } catch (err) {
                    alert('棋谱文件解析失败');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        };
        document.getElementById('boardSizeSelect').addEventListener('change', (e) => {
            const newSize = parseInt(e.target.value, 10);
            if (ws && ws.readyState === WebSocket.OPEN)
                ws.send(JSON.stringify({ type: 'setBoardSize', size: newSize }));
        });
        document.getElementById('replayBackBtn').onclick = () => {
            if (!replayMode) return;
            if (tryPlayMode) setTryPlayStep(tryPlayStep - 1);
            else setReplayStep(replayStep - 1);
        };
        document.getElementById('replayForwardBtn').onclick = () => {
            if (!replayMode) return;
            if (tryPlayMode) setTryPlayStep(tryPlayStep + 1);
            else setReplayStep(replayStep + 1);
        };
        document.getElementById('replaySlider').addEventListener('input', (e) => {
            if (!replayMode) return;
            const val = parseInt(e.target.value, 10);
            if (tryPlayMode) setTryPlayStep(val);
            else setReplayStep(val);
        });
        document.getElementById('backToLobbyBtn').onclick = () => { window.location.href = '/qi'; };
        radioBlack.onchange = function () { if (this.checked && !this.disabled) ws.send(JSON.stringify({ type: 'selectColor', color: 'black' })); };
        radioWhite.onchange = function () { if (this.checked && !this.disabled) ws.send(JSON.stringify({ type: 'selectColor', color: 'white' })); };

        if (scoreConfirmYes)
        {
            scoreConfirmYes.onclick = () =>
            {
                ws.send(JSON.stringify({ type: 'scoreResponse', accept: true }));
                hideScoreConfirm();
            };
            scoreConfirmNo.onclick = () => {
                iRejected = true;
                ws.send(JSON.stringify({ type: 'scoreResponse', accept: false }));
                hideScoreConfirm();
                if (showEstimateActive) {
                    showEstimateActive = false;
                    clearEstimate();
                }
                waitingScoreConfirm = false;
            };
        }

        const modal = document.getElementById('rulesModal');
        document.getElementById('helpBtn').onclick = () => modal.style.display = 'flex';
        document.getElementById('closeRulesBtn').onclick = () => modal.style.display = 'none';
        modal.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };

        updateRecordButtons();
        connectWebSocket();
    </script>
</body>
</html>
