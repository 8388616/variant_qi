<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>变体棋类研究中心</title>
    <!-- 大厅字体：CDN 分包按需加载（jsdmirror 国内镜像，路径与 jsDelivr 兼容）。
         400/500/700 权重分包（game-name-pill 等用粗体）；CDN 不可达时回退页面字体栈。 -->
    <link rel="stylesheet" href="https://cdn.jsdmirror.com/npm/lxgw-wenkai-gb-web@1.522.0/lxgwwenkaigb-regular/result.css">
    <link rel="stylesheet" href="https://cdn.jsdmirror.com/npm/lxgw-wenkai-gb-web@1.522.0/lxgwwenkaigb-medium/result.css">
    <link rel="stylesheet" href="https://cdn.jsdmirror.com/npm/lxgw-wenkai-gb-web@1.522.0/lxgwwenkaigb-bold/result.css">
    <style>
        :root {
            --bg: #f6f0e3;
            --bg-deep: #eadcc2;
            --paper: rgba(255, 250, 241, 0.84);
            --ink: #4e3219;
            --muted: #806350;
            --line: rgba(108, 76, 46, 0.16);
            --accent: #b86e34;
            --accent-strong: #8e4a1a;
            --forest: #3e7053;
            --shadow-soft: 0 22px 44px rgba(94, 68, 38, 0.12);
            --shadow-strong: 0 30px 70px rgba(87, 58, 28, 0.16);
            --radius-xl: 34px;
            --radius-lg: 24px;
            /* 霞鹜文楷不可用时退回系统楷体（勿用黑体） */
            --body-font: "LXGW WenKai GB", "Kaiti SC", "STKaiti", "KaiTi", "KaiTi_GB2312", "BiauKai", serif;
            --serif-font: "LXGW WenKai GB", "Kaiti SC", "STKaiti", "KaiTi", "KaiTi_GB2312", "BiauKai", serif;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
        }

        body.platform-home {
            margin: 0;
            min-height: 100vh;
            font-family: var(--body-font);
            color: var(--ink);
            background:
                radial-gradient(circle at 14% 18%, rgba(171, 212, 189, 0.38), transparent 0 24rem),
                radial-gradient(circle at 84% 12%, rgba(248, 206, 145, 0.44), transparent 0 26rem),
                radial-gradient(circle at 50% 78%, rgba(255, 236, 202, 0.52), transparent 0 28rem),
                linear-gradient(180deg, #fcf8f1 0%, var(--bg) 46%, var(--bg-deep) 100%);
            overflow-x: hidden;
        }

        body.platform-home::before,
        body.platform-home::after {
            content: "";
            position: fixed;
            inset: auto;
            z-index: 0;
            pointer-events: none;
            filter: blur(12px);
        }

        body.platform-home::before {
            top: -8rem;
            right: -5rem;
            width: 24rem;
            height: 24rem;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 219, 165, 0.7) 0%, rgba(255, 219, 165, 0) 72%);
        }

        body.platform-home::after {
            left: -9rem;
            bottom: -10rem;
            width: 26rem;
            height: 26rem;
            border-radius: 40%;
            background: radial-gradient(circle, rgba(133, 187, 160, 0.5) 0%, rgba(133, 187, 160, 0) 74%);
        }

        body.platform-home a {
            color: inherit;
            text-decoration: none;
        }

        body.platform-home button {
            font: inherit;
        }

        .home-shell {
            position: relative;
            z-index: 1;
            width: min(1480px, calc(100% - 32px));
            margin: 0 auto;
            padding: 14px 0 18px;
        }

        .site-header {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 14px;
            align-items: center;
            padding: 12px 18px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: rgba(255, 250, 241, 0.7);
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow-soft);
        }

        .brand-lockup {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .brand-emblem {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border-radius: 15px;
            border: 1px solid rgba(108, 76, 46, 0.18);
            background: linear-gradient(145deg, rgba(255, 249, 240, 0.96), rgba(245, 229, 202, 0.9));
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85);
            color: var(--accent-strong);
            font-family: var(--body-font);
            font-size: 22px;
            font-weight: 500;
        }

        .brand-copy {
            display: grid;
            gap: 4px;
        }

        .brand-title {
            font-size: 23px;
            font-weight: 700;
            letter-spacing: 0.01em;
        }

        .brand-subtitle {
            color: var(--muted);
            font-size: 12px;
        }

        .site-nav {
            display: none;
        }

        .header-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px;
        }

        .header-action-btn {
            min-height: 38px;
            padding: 0 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 999px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            transition:
                transform 0.16s ease,
                background 0.16s ease,
                color 0.16s ease;
        }

        .header-action-btn:hover,
        .header-action-btn:focus-visible {
            background: rgba(184, 110, 52, 0.12);
            color: var(--accent-strong);
        }

        .landing-main {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(260px, 320px);
            gap: 16px;
            align-items: start;
            margin-top: 14px;
        }

        .matrix-section,
        .rooms-panel {
            border: 1px solid var(--line);
            border-radius: var(--radius-xl);
            background: linear-gradient(180deg, rgba(255, 251, 244, 0.88), rgba(255, 246, 233, 0.74));
            box-shadow: var(--shadow-soft);
            backdrop-filter: blur(10px);
        }

        .matrix-section {
            position: relative;
            padding: 18px;
            min-width: 0;
        }

        .game-category-head-tools {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
            margin-left: auto;
            min-width: 0;
        }

        .game-view-mode {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 0 0 auto;
            white-space: nowrap;
        }

        .game-view-mode-option {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin: 0;
            color: var(--muted);
            font: 400 13px/1 var(--body-font);
            cursor: pointer;
            user-select: none;
        }

        .game-view-mode-option input {
            margin: 0;
            accent-color: var(--accent-strong);
            cursor: pointer;
        }

        .game-view-mode-option:hover {
            color: var(--accent-strong);
        }

        .game-category-head .game-search-input {
            flex: 0 1 auto;
            width: min(220px, 36vw);
            height: 24px; /* 与 .game-category-title 行高一致，不抬高分类头 */
            margin: 0;
            padding: 0 12px;
            border: 1px solid rgba(108, 76, 46, 0.18);
            border-radius: 999px;
            background: rgba(255, 251, 244, 0.92);
            color: var(--ink);
            font-family: var(--body-font);
            font-size: 13px;
            font-weight: 400;
            line-height: 22px;
            outline: none;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.78);
            user-select: text;
            -webkit-user-select: text;
        }

        .game-category-head .game-search-input::placeholder {
            color: rgba(128, 99, 80, 0.7);
        }

        .game-category-head .game-search-input:focus {
            border-color: rgba(184, 110, 52, 0.45);
            box-shadow: 0 0 0 3px rgba(184, 110, 52, 0.12);
        }

        .game-category-head.is-first-category .game-category-divider {
            flex: 1 1 auto;
            min-width: 12px;
        }

        .matrix-grid {
            display: grid;
            gap: 22px;
        }

        .game-category-row.is-search-hidden,
        .game-card.is-search-hidden {
            display: none !important;
        }

        .game-category-row {
            display: grid;
            gap: 12px;
            margin-bottom: 28px;
        }

        .game-category-row:last-child {
            margin-bottom: 0;
        }

        .game-category-head {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 4px;
        }

        .game-category-title {
            margin: 0;
            flex: 0 0 auto;
            color: var(--ink);
            font-family: var(--body-font);
            font-size: 20px;
            font-weight: 700;
            line-height: 1.2;
        }

        .game-category-divider {
            display: block;
            height: 1px;
            flex: 1 1 auto;
            background: linear-gradient(90deg, rgba(108, 76, 46, 0.32), rgba(108, 76, 46, 0.06));
        }

        .game-category-cards {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            grid-auto-rows: 150px;
        }

        .game-card {
            position: relative;
            height: 100%;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 8px;
            border: 1px solid rgba(108, 76, 46, 0.12);
            border-radius: 24px;
            background: linear-gradient(180deg, rgba(255, 252, 247, 0.95), rgba(247, 238, 223, 0.82));
            box-shadow: none;
            overflow: hidden;
            transition:
                transform 0.14s ease,
                box-shadow 0.14s ease,
                border-color 0.14s ease,
                background 0.14s ease;
        }

        .game-card.is-live {
            border-color: rgba(108, 76, 46, 0.12);
            box-shadow: none;
        }

        .game-card.is-disabled {
            opacity: 1;
            cursor: default;
            pointer-events: none;
            border-color: rgba(108, 76, 46, 0.1);
            box-shadow: none;
            background: linear-gradient(180deg, rgba(245, 240, 232, 0.9), rgba(236, 230, 220, 0.82));
            color: #9a8b7a;
        }

        .game-card.is-not-recommended .game-name-pill {
            font-weight: 700;
        }

        .game-card.has-recommend-badge .game-name-pill {
            color: #492e17;
            font-weight: 700;
        }

        .game-card.has-recommend-badge.is-disabled .game-name-pill {
            color: #9a8b7a;
        }

        .game-card.has-recommend-badge .random-level {
            background: rgba(58, 109, 80, 0.135);
            color: #2b5c40;
        }

        .game-card.has-recommend-badge.is-disabled .random-level {
            background: rgba(154, 139, 122, 0.14);
            color: #9a8b7a;
        }

        .game-card.has-recommend-badge .game-intro {
            color: #7b5c48;
        }

        .game-card.has-recommend-badge .game-create-hint {
            color: rgba(132, 93, 67, 0.79);
        }

        .game-card.has-recommend-badge.is-disabled .game-intro,
        .game-card.has-recommend-badge.is-disabled .game-create-hint {
            color: #9a8b7a;
        }

        /* 推荐：右上角 ✨（文本呈现以便套用丝带色） */
        .game-card.has-recommend-badge::after {
            content: '✨';
            position: absolute;
            top: 12px;
            right: 10px;
            color: rgb(142, 74, 26);
            font-size: 1.3rem;
            line-height: 1;
            font-variant-emoji: text;
            pointer-events: none;
            z-index: 2;
        }

        .game-card.has-recommend-badge.is-disabled::after {
            color: #9a8b7a;
            opacity: 0.7;
        }

        .game-card-linkable {
            cursor: pointer;
        }

        .game-card-linkable:hover,
        .game-card-linkable:focus-visible {
            transform: translateY(-2px);
            border-color: rgba(138, 75, 28, 0.22);
            box-shadow: 0 10px 18px rgba(97, 71, 39, 0.08);
        }

        .game-card-linkable:active {
            transform: translateY(1px) scale(0.986);
            border-color: rgba(138, 75, 28, 0.22);
            box-shadow: 0 10px 18px rgba(97, 71, 39, 0.08);
            background: linear-gradient(180deg, rgba(251, 243, 229, 0.98), rgba(240, 226, 202, 0.9));
        }

        .game-card-linkable:focus-visible {
            outline: 2px solid rgba(138, 75, 28, 0.26);
            outline-offset: 3px;
        }

        .game-card-head {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 8px;
        }

        .game-name-pill {
            margin: 0;
            padding: 0;
            border: none;
            border-radius: 0;
            background: none;
            font-family: var(--body-font);
            font-size: 1em;
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: 0.01em;
            color: #492e17;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-card.is-disabled .game-name-pill {
            color: #9a8b7a;
        }

        .random-level {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
            min-height: 22px;
            padding: 0 10px;
            border-radius: 999px;
            background: rgba(62, 112, 83, 0.12);
            color: #2f6044;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.02em;
            line-height: 1;
            white-space: nowrap;
            margin-left: auto;
        }

        .game-card.is-disabled .random-level {
            background: rgba(154, 139, 122, 0.14);
            color: #9a8b7a;
        }

        .game-intro {
            margin: 0px 0 0;
            color: #7b5c48;
            font-family: var(--body-font);
            font-size: 12px;
            font-weight: 500;
            line-height: 1.2;
            min-height: 1.2em;
        }

        .game-card.is-disabled .game-intro,
        .game-card.is-disabled .game-create-hint {
            color: #9a8b7a;
        }

        .game-card-foot {
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            min-width: 0;
        }

        .game-create-hint {
            margin: 0;
            flex: 1 1 auto;
            min-width: 0;
            color: rgba(132, 93, 67, 0.79);
            font-size: 12px;
            line-height: 1.2;
            font-weight: 500;
        }

        .random-level-num {
            display: none;
        }

        /* —— 列表视图：名称 + 右侧数字等级，纵向滚动 —— */
        #platform-games.games-view-list .game-category-row {
            gap: 8px;
            margin-bottom: 18px;
        }

        #platform-games.games-view-list .game-category-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, 148px);
            grid-auto-rows: auto;
            justify-content: start;
            gap: 6px 10px;
        }

        #platform-games.games-view-list .game-card {
            width: 148px;
            height: auto;
            min-height: 0;
            min-width: 0;
            padding: 7px 22px 7px 10px;
            gap: 0;
            border-radius: 14px;
            box-shadow: none;
            background: rgba(255, 251, 244, 0.55);
            display: block;
        }

        #platform-games.games-view-list .game-card.is-live {
            box-shadow: none;
            border-color: rgba(108, 76, 46, 0.12);
            background: rgba(255, 251, 244, 0.72);
        }

        #platform-games.games-view-list .game-card-linkable:hover,
        #platform-games.games-view-list .game-card-linkable:focus-visible {
            transform: none;
            border-color: rgba(138, 75, 28, 0.22);
            background: rgba(255, 246, 230, 0.95);
            box-shadow: 0 10px 18px rgba(97, 71, 39, 0.08);
        }

        #platform-games.games-view-list .game-card.has-recommend-badge .game-name-pill {
            color: #492e17;
            font-weight: 500;
        }

        #platform-games.games-view-list .game-card.has-recommend-badge .random-level {
            color: #2b5c40;
        }

        #platform-games.games-view-list .game-card.has-recommend-badge.is-disabled .random-level {
            color: #9a8b7a;
        }

        #platform-games.games-view-list .game-card.is-not-recommended .game-name-pill {
            font-weight: 500;
        }

        #platform-games.games-view-list .game-card-linkable:active {
            transform: scale(0.99);
            box-shadow: none;
        }

        #platform-games.games-view-list .game-card-head {
            display: block;
            min-width: 0;
        }

        #platform-games.games-view-list .game-name-pill {
            display: block;
            max-width: 100%;
            font-size: 0.98rem;
            font-weight: 500;
            line-height: 1.35;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #platform-games.games-view-list .game-card-foot {
            position: absolute;
            right: 8px;
            bottom: 7px;
            margin-top: 0;
            padding-right: 0;
            z-index: 1;
        }

        #platform-games.games-view-list .game-card.has-recommend-badge::after {
            top: 4px;
            right: 5px;
            font-size: 0.64rem;
        }

        #platform-games.games-view-list .random-level {
            min-height: 0;
            padding: 0;
            border-radius: 0;
            background: none;
            color: #2f6044;
            font-size: 0.68rem;
            font-weight: 500;
            line-height: 1;
            margin: 0;
        }

        #platform-games.games-view-list .game-card.is-disabled .random-level {
            background: none;
            color: #9a8b7a;
        }

        #platform-games.games-view-list .random-level-full {
            display: none;
        }

        #platform-games.games-view-list .random-level-num {
            display: inline;
        }

        #platform-games.games-view-list .game-intro,
        #platform-games.games-view-list .game-create-hint {
            display: none;
        }

        .rooms-panel {
            padding: 16px;
            display: flex;
            flex-direction: column;
            min-height: 420px;
            max-height: calc(100vh - 120px);
            position: sticky;
            top: 14px;
        }

        .rooms-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 0 4px 10px;
            border-bottom: 1px solid var(--line);
            margin-bottom: 10px;
        }

        .rooms-title {
            margin: 0;
            font-family: var(--body-font);
            font-size: 20px;
            font-weight: 700;
        }

        .refresh-btn {
            min-height: 34px;
            padding: 0 12px;
            border: none;
            border-radius: 999px;
            background: rgba(184, 110, 52, 0.12);
            color: var(--accent-strong);
            font-weight: 800;
            cursor: pointer;
            transition: background 0.16s ease, transform 0.16s ease;
        }

        .refresh-btn:hover {
            background: rgba(184, 110, 52, 0.2);
            transform: translateY(-1px);
        }

        .rooms-list-container {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
            min-height: 0;
        }

        .rooms-list-container::-webkit-scrollbar {
            width: 8px;
        }

        .rooms-list-container::-webkit-scrollbar-track {
            background: rgba(108, 76, 46, 0.06);
            border-radius: 10px;
        }

        .rooms-list-container::-webkit-scrollbar-thumb {
            background: rgba(184, 110, 52, 0.45);
            border-radius: 10px;
        }

        .room-item {
            background: rgba(255, 251, 244, 0.9);
            margin: 0 0 10px;
            padding: 12px 14px;
            border-radius: 18px;
            border: 1px solid rgba(108, 76, 46, 0.12);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            transition: border-color 0.14s ease, box-shadow 0.14s ease;
        }

        .room-item:hover {
            border-color: rgba(138, 75, 28, 0.22);
            box-shadow: 0 10px 18px rgba(97, 71, 39, 0.08);
        }

        .room-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            font-weight: 600;
            color: var(--ink);
        }

        .room-id,
        .game-badge,
        .player-count {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            padding: 0 10px;
            border-radius: 999px;
            font-size: 0.85rem;
        }

        .room-id {
            background: rgba(78, 50, 25, 0.08);
            letter-spacing: 1px;
        }

        .game-badge,
        .player-count {
            background: rgba(62, 112, 83, 0.12);
            color: #2f6044;
        }

        .enter-btn {
            background: linear-gradient(135deg, #edac70, #dd8c50);
            border: none;
            color: #fff8ef;
            font-weight: 800;
            padding: 6px 16px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.9rem;
            box-shadow: 0 10px 18px rgba(133, 73, 25, 0.16);
            transition: transform 0.14s ease, box-shadow 0.14s ease;
        }

        .enter-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 22px rgba(133, 73, 25, 0.2);
        }

        .enter-btn:active {
            transform: translateY(1px);
        }

        .empty-rooms {
            text-align: center;
            color: var(--muted);
            padding: 28px 12px;
            font-style: italic;
        }

        .random-level-hint {
            margin-top: 12px;
            padding: 0 6px;
            font-size: 0.8rem;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .help-icon {
            display: inline-grid;
            place-items: center;
            width: 18px;
            height: 18px;
            border: 1px solid rgba(108, 76, 46, 0.16);
            background: rgba(184, 110, 52, 0.12);
            color: var(--accent-strong);
            border-radius: 50%;
            font-weight: 700;
            cursor: pointer;
            font-size: 11px;
            line-height: 1;
            position: relative;
            transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease;
        }

        .help-icon:hover,
        .help-icon:focus-visible {
            background: rgba(184, 110, 52, 0.2);

    <div class="home-shell">
        <header class="site-header">
            <a class="brand-lockup" href="/qi" aria-label="变体棋类研究中心">

                <div class="brand-copy">

        /** 与 qi.js 中 sessionStorage 键一致：大厅导入成功后由游戏页在 joined 时发送 importRecord */
        const QI_LOBBY_PENDING_IMPORT_KEY = 'qiLobbyPendingImport';

        function lobbyGetQrcodeFactory() {
            if (typeof qrcode === 'function') return qrcode;
            return null;
        }

        /**
         * @param {string} text
         * @returns {{ record: object } | { error: string }}
         */
        function lobbyBuildWeiqiRecordFromQrText(text) {
            const mk = lobbyGetQrcodeFactory();
            if (!mk) {
                return { error: '二维码库未加载，请检查网络后刷新页面重试。' };
            }
            let qr;
            try {
                qr = mk(0, 'L');
                qr.addData(text);
                qr.make();
            } catch (e) {
                return { error: '无法生成二维码：' + (e && e.message ? e.message : String(e)) };
            }
            const n = qr.getModuleCount();
            if (!Number.isFinite(n) || n < 1) {
                return { error: '二维码生成结果无效。' };
            }
            if (n > 49) {
                return { error: `二维码过大，无法显视。` };
            }
            const initialPosition = [];
            for (let r = 0; r < n; r++) {
                for (let c = 0; c < n; c++) {
                    if (qr.isDark(r, c)) initialPosition.push(`B${r},${c}`);
                    else initialPosition.push(`W${r},${c}`);
                }
            }
            const boardSize = n;
            return {
                record: {
                    format: 'muzei',
                    version: 1,
                    gameType: '围棋',
                    gameId: 'weiqi',
                    boardSize,
                    komi: boardSize <= 8 ? 4.25 : 3.25,
                    players: { black: null, white: null },
                    initialPosition,
                    moves: []
                }
            };
        }

        async function lobbyCreateRoomWithPendingWeiqiImport(record) {
            const gameId = 'weiqi';
            const game = GAMES_DATA.find(g => g.id === gameId);
            if (!game || !game.enabled) {
                qiAlert('标准围棋未开放，无法创建房间');
                return;
            }
            try {
                const res = await fetch(`${API_BASE}/qi/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ game: game.id, password: null })
                });
                const result = await res.json();
                if (!result.success) {
                    qiAlert('创建房间失败：' + (result.error || '未知错误'));
                    return;
                }
                const roomId = String(result.roomId);
                sessionStorage.setItem(`roomPassword_${roomId}`, '');
                try { sessionStorage.removeItem('qiLobbyFreshRoom'); } catch (e) {}
                sessionStorage.setItem(QI_LOBBY_PENDING_IMPORT_KEY, JSON.stringify({
                    record,
                    expectedGameId: gameId,
                    expectedRoomId: roomId
                }));
                window.location.href = `/qi/${game.path}/${roomId}`;
            } catch (err) {
                qiAlert('网络错误，请稍后重试');
            }
        }

            } catch (e) {

                return;
            }
            const gameId = data && data.gameId;
            if (!gameId || typeof gameId !== 'string') {
                qiAlert('无法识别棋类或该棋类未开放');
                return;
            }
            const game = GAMES_DATA.find(g => g.id === gameId);
            if (!game || !game.enabled) {
                qiAlert('无法识别棋类或该棋类未开放');
                return;
            }
            try {
                const res = await fetch(`${API_BASE}/qi/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ game: game.id, password: null })
                });
                const result = await res.json();
                if (!result.success) {
                    qiAlert('创建房间失败：' + (result.error || '未知错误'));
                    return;
                }
                const roomId = String(result.roomId);

                sessionStorage.setItem(QI_LOBBY_PENDING_IMPORT_KEY, JSON.stringify({

                    expectedRoomId: roomId
                }));

        }

        async function fetchAllRooms() {
            const activeGames = GAMES_DATA.filter(g => g.enabled === true);
            const results = await Promise.all(activeGames.map(async (game) => {
                try {
                    const res = await fetch(`${API_BASE}/qi/rooms?game=${game.id}`);
                    if (res.ok) {
                        const rooms = await res.json();
                        return rooms.map(room => ({
                            ...room,
                            gameId: game.id,
                            gameName: game.name,
                            gamePath: game.path
                        }));
                    }
                } catch (e) { console.warn(`获取${game.id}房间失败`, e); }
                return [];
            }));
            return results.flat();
        }

        function renderRooms(rooms) {
            const container = document.getElementById('roomsListContainer');
            if (!rooms.length) {
                container.innerHTML = '<div class="empty-rooms">暂无房间</div>';
                return;
            }
            rooms.sort((a, b) => {
                const playerDiff = (b.playerCount || 0) - (a.playerCount || 0);
                if (playerDiff !== 0) return playerDiff;
                return a.roomId - b.roomId;
            });
            const html = rooms.map(room => `
                            <div class="room-item" data-room-id="${room.roomId}" data-game-id="${room.gameId}" data-game-path="${room.gamePath}" data-has-password="${room.hasPassword}">
                                <div class="room-info">
                                    <span class="room-id">${room.roomId}</span>
                                    <span class="game-badge">${room.gameName}</span>
                                    <span class="player-count">${room.playerCount || 0}/${room.maxPlayers || 2}</span>
                                    ${room.hasPassword ? '<span class="player-count">私密</span>' : '<span class="player-count">公开</span>'}
                                </div>
                                <button class="enter-btn" type="button" data-room-id="${room.roomId}" data-game-id="${room.gameId}" data-game-path="${room.gamePath}" data-has-password="${room.hasPassword}">进入房间</button>
                            </div>
                        `).join('');
            container.innerHTML = html;

            document.querySelectorAll('.enter-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const roomId = btn.getAttribute('data-room-id');
                    const gameId = btn.getAttribute('data-game-id');
                    const gamePath = btn.getAttribute('data-game-path');
                    const hasPassword = btn.getAttribute('data-has-password') === 'true';

                    let password = null;
                    if (hasPassword) {
                        password = prompt('房间设置了密码，请输入密码：');
                        if (password === null) return;
                    }

                    try {
                        const res = await fetch(`${API_BASE}/qi/join`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ game: gameId, roomId, password: password || '' })
                        });
                        const data = await res.json();
                        if (data.success) {
                            sessionStorage.setItem(`roomPassword_${roomId}`, password || '');
                            try { sessionStorage.removeItem('qiLobbyFreshRoom'); } catch (e) {}
                            window.location.href = `/qi/${gamePath}/${roomId}`;
                        } else {
                            qiAlert('加入失败：' + (data.error || '密码错误或房间不存在'));
                        }
                    } catch (err) {
                        qiAlert('网络错误，请稍后重试');
                    }
                });
            });
        }

                card.classList.add('is-live', 'game-card-linkable');
                card.tabIndex = 0;
            } else {
                card.classList.add('is-disabled');
                card.setAttribute('aria-disabled', 'true');
            }
            if (game.recommended) {
                card.classList.add('has-recommend-badge');
            } else {
                card.classList.add('is-not-recommended');
            }

            const head = document.createElement('div');
            head.className = 'game-card-head';

            const namePill = document.createElement('span');
            namePill.className = 'game-name-pill';
            namePill.textContent = game.name;
            head.append(namePill);

            const intro = document.createElement('p');
            intro.className = 'game-intro';
            intro.textContent = game.intro || '';

            const foot = document.createElement('div');
            foot.className = 'game-card-foot';

            if (game.enabled) {
                const hint = document.createElement('p');
                hint.className = 'game-create-hint';
                hint.textContent = '点击创建房间';
                foot.append(hint);
            }

            const level = document.createElement('span');
            level.className = 'random-level';
            const levelFull = document.createElement('span');
            levelFull.className = 'random-level-full';
            levelFull.textContent = `${game.randomLevel}级随机`;
            const levelNum = document.createElement('span');
            levelNum.className = 'random-level-num';
            levelNum.textContent = String(game.randomLevel);
            level.append(levelFull, levelNum);
            foot.append(level);

                    document.getElementById('roomPasswordInput').value = '';

                card.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        openCreate();
                    }
                });

            return card;

        function syncGamesViewMode() {
            const section = document.getElementById('platform-games');
            if (section) {
                section.classList.toggle('games-view-list', gamesViewMode === 'list');

        function renderGamesCatalog() {
            const gridContainer = document.getElementById('platform-games-grid');
            const prevQuery = document.getElementById('gameSearchInput')?.value || '';
            gridContainer.innerHTML = '';

            const categories = ['围棋', '五子棋', '象棋', '其它'];
            const fragment = document.createDocumentFragment();
            let firstCategoryRendered = false;

            for (let catIdx = 0; catIdx < categories.length; catIdx++) {
                const cat = categories[catIdx];
                const catGames = GAMES_DATA.filter(g => g.category === cat);
                if (!catGames.length) continue;

                const section = document.createElement('section');
                section.className = 'game-category-row';
                const titleId = `game-category-title-${catIdx}`;
                section.setAttribute('aria-labelledby', titleId);

                const head = document.createElement('div');
                head.className = 'game-category-head';

                const title = document.createElement('h2');
                title.className = 'game-category-title';
                title.id = titleId;
                title.textContent = cat;

                const divider = document.createElement('span');
                divider.className = 'game-category-divider';
                divider.setAttribute('aria-hidden', 'true');

                head.append(title, divider);

                if (!firstCategoryRendered) {
                    firstCategoryRendered = true;
                    head.classList.add('is-first-category');

                    const tools = document.createElement('div');
                    tools.className = 'game-category-head-tools';

                    const viewMode = document.createElement('div');
                    viewMode.className = 'game-view-mode';
                    viewMode.setAttribute('role', 'radiogroup');
                    viewMode.setAttribute('aria-label', '棋类展示方式');

                    const makeOption = (value, labelText) => {
                        const label = document.createElement('label');
                        label.className = 'game-view-mode-option';
                        const radio = document.createElement('input');
                        radio.type = 'radio';
                        radio.name = 'gameViewMode';
                        radio.value = value;
                        radio.checked = gamesViewMode === value;
                        radio.addEventListener('change', () => {
                            if (!radio.checked) return;
                            gamesViewMode = value;
                            syncGamesViewMode();
                        });
                        label.append(radio, document.createTextNode(labelText));
                        return label;
                    };

                    viewMode.append(
                        makeOption('card', '显示卡片'),
                        makeOption('list', '显示列表')
                    );

                    const search = document.createElement('input');
                    search.type = 'search';
                    search.id = 'gameSearchInput';
                    search.className = 'game-search-input';
                    search.placeholder = '搜索棋类…';
                    search.autocomplete = 'off';
                    search.setAttribute('enterkeyhint', 'search');
                    search.setAttribute('aria-label', '搜索棋类');
                    search.value = prevQuery;
                    search.addEventListener('input', applyGameSearchFilter);
                    search.addEventListener('search', applyGameSearchFilter);

                    tools.append(viewMode, search);
                    head.appendChild(tools);
                }

                const cards = document.createElement('div');
                cards.className = 'game-category-cards';
                catGames.forEach((game) => {
                    cards.appendChild(createGameCard(game));
                });

                section.append(head, cards);
                fragment.appendChild(section);
            }

            gridContainer.appendChild(fragment);
            syncGamesViewMode();
            applyGameSearchFilter();
        }

        function applyGameSearchFilter() {
            const input = document.getElementById('gameSearchInput');
            const query = (input && input.value ? String(input.value) : '').trim().toLowerCase();
            const rows = document.querySelectorAll('#platform-games-grid .game-category-row');

            rows.forEach((row) => {
                const cards = row.querySelectorAll('.game-card');
                const keepHead = !!row.querySelector('#gameSearchInput');
                let visibleCount = 0;
                cards.forEach((card) => {
                    if (!query) {
                        card.classList.remove('is-search-hidden');
                        visibleCount += 1;
                        return;
                    }
                    const haystack = [
                        card.dataset.gameName || '',
                        card.dataset.gameId || '',
                        card.dataset.gameIntro || '',
                        card.dataset.gameCategory || ''
                    ].join(' ').toLowerCase();
                    const matched = haystack.includes(query);
                    card.classList.toggle('is-search-hidden', !matched);
                    if (matched) visibleCount += 1;
                });
                // 首个分类头含搜索框，即使无匹配也不隐藏整行
                row.classList.toggle('is-search-hidden', visibleCount === 0 && !keepHead);
            });
        }

                tempTooltip.classList.add('show');
                activeTooltip = tempTooltip;

                const tooltipRect = tempTooltip.getBoundingClientRect();
                const rect = helpIcon.getBoundingClientRect();
                let top = 8 + rect.bottom;
                let left = rect.left;
                if (left + tooltipRect.width > window.innerWidth - 12) {
                    left = Math.max(12, window.innerWidth - tooltipRect.width - 12);
                }
                if (top + tooltipRect.height > window.innerHeight - 12) {
                    top = Math.max(12, rect.top - tooltipRect.height - 8);
                }
                tempTooltip.style.top = top + 'px';
                tempTooltip.style.left = left + 'px';
                return;
            }

            if (activeTooltip && activeTooltip.classList.contains('show')) {
                activeTooltip.classList.remove('show');
                activeTooltip = null;
            }
        });
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
                pendingGame = null;
            }
        });

        (function () {
            const urlParams = new URLSearchParams(window.location.search);
            const needPassword = urlParams.get('needPassword');
            const gameId = urlParams.get('game');
            const roomId = urlParams.get('room');

            if (needPassword === '1' && gameId && roomId) {
                setTimeout(() => {
                    const password = prompt(`房间 ${roomId} 设置了密码，请输入密码：`);
                    if (password === null) {
                        window.history.replaceState({}, '', '/qi');
                        return;
                    }
                    fetch(`${API_BASE}/qi/join`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ game: gameId, roomId, password })
                    })
                        .then(res => res.json())
                        .then(data => {
                            if (data.success) {
                                sessionStorage.setItem(`roomPassword_${roomId}`, password);
                                try { sessionStorage.removeItem('qiLobbyFreshRoom'); } catch (e) {}
                                const gameInfo = GAMES_DATA.find(g => g.id === gameId);
                                if (gameInfo) {
                                    window.location.href = `/qi/${gameInfo.path}/${roomId}`;
                                } else {
                                    qiAlert('游戏不存在。');
                                }
                            } else {
                                qiAlert('密码错误，无法进入房间。');
                                window.history.replaceState({}, '', '/qi');
                            }
                        })
                        .catch(err => {
                            qiAlert('网络错误，请重试。');
                            window.history.replaceState({}, '', '/qi');
                        });
                }, 100);
            }
        })();

        renderGamesCatalog();
        refreshRoomList();
        setInterval(() => {
            refreshRoomList();
        }, 15000);
    </script>
</body>
</html>
