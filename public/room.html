<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
    <title>房间</title>
    <link rel="stylesheet" href="/qi/fonts/lxgw-wenkai-gb/index.css">
    <link rel="stylesheet" href="/qi/room.css">
</head>
<body class="qi-room" id="gameWrapper">
    <div class="top-panel">
        <div class="left-group">
            <div class="komi-info" id="gameTitleInfo">围棋</div>
            <div class="komi-info" id="komiInfo">黑贴白3.25点</div>
            <div class="side-select" id="sideSelect" hidden>
                <label id="labelBlack"><input type="radio" name="color" value="black" id="radioBlack"> ⚫ 黑方</label>
                <label id="labelWhite"><input type="radio" name="color" value="white" id="radioWhite"> ⚪ 白方</label>
            </div>
            <div class="color-status" id="colorStatus">观战</div>
            <select id="styleSelect" class="board-size-select" hidden aria-label="洞显示样式">
                <option value="block" selected>方块</option>
                <option value="hole">洞</option>
                <option value="void">空</option>
            </select>
            <select id="boardSizeSelect" class="board-size-select" style="display: none;"></select>
            <label class="show-numbers-label">
                <input type="checkbox" id="showNumbersCheck"> 显示序号
            </label>
            <label class="chk-inline" id="showLibertyStonesLabel" hidden>
                <input type="checkbox" id="showLibertyStonesCheck"> 显示有气棋子
            </label>
            <label class="chk-inline" id="showAdjacentLinesLabel" hidden>
                <input type="checkbox" id="showAdjacentLinesCheckbox" checked> 显示相邻连线
            </label>
            <label class="chk-inline" id="showLibertyLabel" hidden>
                <input type="checkbox" id="showLibertyCheck"> 显示气数
            </label>
            <label class="chk-inline" id="showGridLabel" hidden>
                <input type="checkbox" id="showGridCheck" checked> 参考刻度
            </label>
            <div id="editControls" class="edit-controls" hidden>
                <label class="edit-checkbox">
                    <input type="checkbox" id="editModeCheckbox"> 编辑
                </label>
                <select id="editToolSelect" class="edit-tool-select hidden"></select>
                <button type="button" id="clearBoardBtn" class="edit-clear-btn hidden">清空</button>
            </div>
        </div>
        <div class="right-buttons">
            <button class="help-btn" id="helpBtn">说明</button>
            <button class="back-to-lobby-btn" id="backToLobbyBtn">返回大厅</button>
        </div>
    </div>

    <div id="rulesModal" class="rules-modal">
        <div class="rules-content">
            <span class="close-rules" id="closeRulesBtn">&times;</span>
            <h3 id="rulesTitle">围棋</h3>
            <p id="rulesBody"></p>
        </div>
    </div>

    <div class="main-area">
        <div class="left-rail">
        <div class="button-panel">
            <button class="ctrl-btn" id="newGameBtn">新局</button>
            <button class="ctrl-btn" id="estimateBtn">形势判断</button>
            <button class="ctrl-btn" id="tryPlayBtn">试下</button>
            <button class="ctrl-btn" id="passBtn" style="display:none;">虚着</button>
            <button class="ctrl-btn" id="undoBtn" style="display:none;">悔棋</button>
            <button class="ctrl-btn" id="resignBtn" style="display:none;">认输</button>
            <button class="ctrl-btn" id="drawBtn" style="display:none;">和棋</button>
            <button class="ctrl-btn" id="endReqBtn" style="display:none;">申请数点</button>
            <div id="replayMinesRow" class="replay-perspective-panel" hidden style="display:none;">
                <div class="replay-perspective-options">
                    <label class="replay-perspective-label"><input type="radio" name="replayMinesVis" value="show" id="replayMinesShow" checked> 显示雷</label>
                    <label class="replay-perspective-label"><input type="radio" name="replayMinesVis" value="hide" id="replayMinesHide"> 不显示雷</label>
                </div>
            </div>
            <div id="replayPerspectiveRow" class="replay-perspective-panel" hidden style="display:none;">
                <div class="replay-perspective-options">
                    <label class="replay-perspective-label"><input type="radio" name="replayPerspective" value="both" id="replayPerspBoth" checked> 全视角</label>
                    <label class="replay-perspective-label"><input type="radio" name="replayPerspective" value="black" id="replayPerspBlack"> 黑方视角</label>
                    <label class="replay-perspective-label"><input type="radio" name="replayPerspective" value="white" id="replayPerspWhite"> 白方视角</label>
                </div>
            </div>
            <button class="ctrl-btn" id="buryFinishBtn" style="display:none;">埋雷结束</button>
            <button class="ctrl-btn" id="importBtn">导入棋谱</button>
            <button class="ctrl-btn" id="exportBtn" style="display:none;">导出棋谱</button>
        </div>
        <div class="room-chat" id="roomChat" aria-label="房间聊天">
            <div class="room-chat-log" id="roomChatLog" role="log" aria-live="polite"></div>
            <div class="room-chat-compose">
                <div class="room-chat-select-wrap">
                    <div class="room-chat-select-face" id="roomChatSelectFace" aria-hidden="true"></div>
                    <select id="roomChatSelect" class="room-chat-select" aria-label="预设消息"></select>
                </div>
                <button type="button" class="room-chat-send" id="roomChatSendBtn">发送</button>
            </div>
        </div>
        </div>
        <div class="board-and-info" id="boardAndInfo">
            <div class="board-container" id="boardContainer">
                <div class="weiqi-board-view-stack" id="boardViewStack">
                    <div class="weiqi-board-view-row">
                        <canvas id="goBoard" width="600" height="600" style="touch-action: none;"></canvas>
                        <input type="range" id="boardScrollY" class="weiqi-board-scrollbar weiqi-board-scrollbar--y"
                            min="0" max="1000" value="500" step="1" tabindex="-1" aria-label="棋盘上下平移">
                    </div>
                    <input type="range" id="boardScrollX" class="weiqi-board-scrollbar weiqi-board-scrollbar--x"
                        min="0" max="1000" value="500" step="1" tabindex="-1" aria-label="棋盘左右平移">
                </div>
                <div class="dual-boards-container" id="dualBoardsContainer" hidden>
                    <div class="dual-boards">
                        <div class="board-wrap">
                            <canvas id="boardA" class="go-canvas board-a" width="450" height="450"></canvas>
                        </div>
                        <div class="board-wrap">
                            <canvas id="boardB" class="go-canvas board-b" width="450" height="450"></canvas>
                        </div>
                    </div>
                </div>
                <div class="ms-board-wrap" id="msBoardWrap" hidden>
                    <div class="ms-grid" id="msGrid"></div>
                </div>
                <div class="board-mark-outer" id="boardMarkOuter">
                    <div class="board-mark-panel" id="boardMarkPanel" hidden title="右键或长按空点放置标记；再次放置可清除">
                        <label for="boardMarkSelect">标记</label>
                        <select id="boardMarkSelect" class="board-mark-select" aria-label="棋盘标记符号"></select>
                        <button type="button" class="board-mark-fold-btn" id="boardMarkFoldBtn" title="收起">‹</button>
                    </div>
                    <button type="button" class="board-mark-expand-btn" id="boardMarkExpandBtn" title="展开标记">›</button>
                </div>
            </div>
            <div class="bottom-palette vl-bags-wrap" id="vlBagsPalette" hidden>
                <div class="vl-bags-row">
                    <div class="vl-bag-col vl-white-side">
                        <div class="vl-bag-frame">
                            <div class="vl-bag-inner" id="whiteBagRow"></div>
                        </div>
                    </div>
                    <div class="vl-bag-col vl-black-side">
                        <div class="vl-bag-frame">
                            <div class="vl-bag-inner" id="blackBagRow"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="bottom-palette qd-bags-wrap" id="quoridorBagsPalette" hidden>
                <div class="qd-bags-row">
                    <div class="qd-bag-col qd-white-side">
                        <div class="qd-bag-frame">
                            <div class="qd-bag-inner" id="whiteWallsRow"></div>
                        </div>
                    </div>
                    <div class="qd-bag-col qd-black-side">
                        <div class="qd-bag-frame">
                            <div class="qd-bag-inner" id="blackWallsRow"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="bottom-palette dyeing-bags-wrap" id="dyeingBagsPalette" hidden>
                <div class="dyeing-bags-row">
                    <div class="dyeing-bag-col dyeing-red-side">
                        <div class="dyeing-bag-frame">
                            <div class="dyeing-bag-inner" id="dyeingRedBagRow"></div>
                        </div>
                    </div>
                    <div class="dyeing-bag-col dyeing-green-side">
                        <div class="dyeing-bag-frame">
                            <div class="dyeing-bag-inner" id="dyeingGreenBagRow"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="palette-stack-aside" id="paletteStackAside">
                <div class="main-area-right">
                    <div class="info-panel">
                        <div class="turn-box" id="turnDisplay">　</div>
                        <div class="score-box">
                            <div class="russian-compound-score-tools" id="scoreCompoundRow" hidden>
                                <div class="compound-preview-host" id="compoundPreviewHost" aria-hidden="true">
                                    <div class="shape-grid" id="compoundShapeGrid"></div>
                                </div>
                                <div id="compoundTransformButtons"></div>
                            </div>
                            <div class="score-title" id="scoreTitle">　</div>
                            <div class="score-content">
                                <div id="scoreBoard">　</div>
                                <div id="leadInfo" style="margin-top:6px;">　</div>
                            </div>
                        </div>
                        <div id="replayPanel" class="replay-panel">
                            <div class="replay-nav">
                                <button class="replay-nav-btn" id="replayBackBtn">◀</button>
                                <div class="replay-step-display" id="replayStepDisplay">0 / 0</div>
                                <button class="replay-nav-btn" id="replayForwardBtn">▶</button>
                            </div>
                            <input type="range" id="replaySlider" min="0" max="0" value="0" class="replay-slider">
                        </div>
                    </div>
                </div>
                <div id="goTimerPanel" class="go-timer-panel" hidden>
                    <div class="go-timer-block go-timer-black" data-go-timer="black" id="goTimerBlack">
                        <div class="go-timer-title" id="goTimerBlackTitle"><span class="qi-side-dot qi-side-dot--black" aria-hidden="true"></span>黑方</div>
                        <div class="go-timer-line2">
                            <span class="go-timer-count">—</span>
                            <span class="go-timer-over">—</span>
                        </div>
                        <div class="go-timer-rule">　</div>
                    </div>
                    <div class="go-timer-block go-timer-white" data-go-timer="white" id="goTimerWhite">
                        <div class="go-timer-title" id="goTimerWhiteTitle"><span class="qi-side-dot qi-side-dot--white" aria-hidden="true"></span>白方</div>
                        <div class="go-timer-line2">
                            <span class="go-timer-count">—</span>
                            <span class="go-timer-over">—</span>
                        </div>
                        <div class="go-timer-rule">　</div>
                    </div>
                    <div class="go-timer-block is-active" id="sharedTimerBlock" hidden>
                        <div class="go-timer-title" id="timerLabel">时间</div>
                        <div class="go-timer-line2">
                            <span class="go-timer-count" id="timerCount">—</span>
                        </div>
                    </div>
                    <div class="go-timer-block" id="progBlackBlock" hidden>
                        <div class="go-timer-title">⚫ 黑方进度</div>
                        <div class="go-timer-line2">
                            <span class="go-timer-count" id="progBlack">0%</span>
                        </div>
                    </div>
                    <div class="go-timer-block" id="progWhiteBlock" hidden>
                        <div class="go-timer-title">⚪ 白方进度</div>
                        <div class="go-timer-line2">
                            <span class="go-timer-count" id="progWhite">0%</span>
                        </div>
                    </div>
                </div>
                <div class="bottom-palette" id="bottomPalette" hidden>
                    <div class="piece-row" id="shapeSelector"></div>
                    <div class="transform-buttons">
                        <button class="transform-btn" id="rotateBtn">↻ 旋转</button>
                        <button class="transform-btn" id="flipBtn">⇄ 翻折</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="scoreConfirmPanel" class="qi-time-control-modal score-confirm-modal" style="display: none;">
        <div class="qi-time-control-dialog score-confirm-dialog">
            <p id="scoreConfirmText">黑胜0点，是否同意该结果？</p>
            <div class="score-confirm-buttons">
                <button id="scoreConfirmYes">确定</button>
                <button id="scoreConfirmNo">取消</button>
            </div>
        </div>
    </div>
    <div id="settingsModal" class="qi-time-control-modal ms-settings-modal" style="display:none;">
        <div class="qi-time-control-dialog">
            <h3 id="settingsTitle">设置对战规则</h3>
            <p id="settingsHint" style="margin:0 0 8px; opacity:0.85;"></p>
            <div id="settingsFields">
                <label>棋盘大小 <select id="setBoardSize"></select></label>
                <label>雷数 <input type="number" id="setMineCount" min="1" max="900" value="72"></label>
                <label>埋雷时间（分） <input type="number" id="setBuryMin" min="1" max="60" value="2"></label>
                <label>扫雷时间（分） <input type="number" id="setSweepMin" min="1" max="120" value="5"></label>
            </div>
            <div class="score-confirm-buttons" style="margin-top:14px; display:flex; gap:10px; justify-content:center;">
                <button type="button" id="settingsConfirmBtn">确认</button>
                <button type="button" id="settingsAcceptBtn" hidden>接受</button>
                <button type="button" id="settingsAdjustBtn" hidden>调整</button>
            </div>
        </div>
    </div>
    <input type="file" id="importFileInput" accept=".json" style="display:none;">

    <script src="/qi/room.js"></script>
</body>
</html>
