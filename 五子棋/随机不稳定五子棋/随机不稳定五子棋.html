<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
    <title>随机不稳定五子棋</title>
    <link rel="stylesheet" href="/qi/qi.css">
</head>
<body>
    <div class="game-wrapper">
        <div class="top-panel">
            <div class="left-group">
                <div class="side-select">
                    <label style="color: #b1d1fc;" id="labelBlack"><input type="radio" name="color" value="black" id="radioBlack"> ⚫ 黑方</label>
                    <label style="color: #ffeeaa;" id="labelWhite"><input type="radio" name="color" value="white" id="radioWhite"> ⚪ 白方</label>
                </div>
                <div class="komi-info">无禁手</div>
                <div class="color-status" id="colorStatus">观战</div>
                <select id="boardSizeSelect" class="board-size-select" style="display: none;">
                    <option value="7">7路</option>
                    <option value="8">8路</option>
                    <option value="9" selected>9路</option>
                    <option value="10">10路</option>
                    <option value="11">11路</option>
                    <option value="12">12路</option>
                    <option value="13">13路</option>
                    <option value="14">14路</option>
                    <option value="15">15路</option>
                </select>
                <label style="cursor:pointer; display:inline-flex; align-items:center; gap:5px; font-size:0.95rem;">
                    <input type="checkbox" id="showNumbersCheck"> 显示序号
                </label>
            </div>
            <div class="right-buttons">
                <button class="help-btn" id="helpBtn">说明</button>
                <button class="back-to-lobby-btn" id="backToLobbyBtn">返回大厅</button>
            </div>
        </div>

        <div id="rulesModal" class="rules-modal">
            <div class="rules-content">
                <span class="close-rules" id="closeRulesBtn">&times;</span>
                <h3>随机不稳定五子棋</h3>
                <p>
                    基本规则同五子棋。<br /><br />
                    每个棋子都会获得一个随机寿命。每下一手棋所有棋子的寿命减1，寿命归零的棋子消失。<br><br />
                    随着棋局的进程，棋子寿命的随机范围会逐渐增长。<br>
                </p>
            </div>
        </div>

        <div class="main-area">
            <div class="button-panel">
                <button class="ctrl-btn" id="newGameBtn">新局</button>
                <button class="ctrl-btn" id="undoBtn">悔棋</button>
                <button class="ctrl-btn" id="resignBtn">认输</button>
                <button class="ctrl-btn" id="drawBtn">和棋</button>
                <button class="ctrl-btn" id="tryPlayBtn" style="display:none;">试下</button>
                <button class="ctrl-btn" id="importBtn">导入棋谱</button>
                <button class="ctrl-btn" id="exportBtn" style="display:none;">导出棋谱</button>
            </div>

            <div class="board-container">
                <canvas id="goBoard" width="600" height="600"></canvas>
                <div class="board-mark-outer" id="boardMarkOuter">
                    <div class="board-mark-panel" id="boardMarkPanel" hidden title="右键或长按空点放置标记；悬停预览覆盖时隐藏">
                        <label for="boardMarkSelect">标记</label>
                        <select id="boardMarkSelect" class="board-mark-select" aria-label="棋盘标记符号"></select>
                        <button type="button" class="board-mark-fold-btn" id="boardMarkFoldBtn" title="收起">‹</button>
                    </div>
                    <button type="button" class="board-mark-expand-btn" id="boardMarkExpandBtn" title="展开标记">›</button>
                </div>
            </div>

            <div class="info-panel">
                <div class="turn-box" id="turnDisplay">　</div>
                <div class="score-box">
                    <div class="score-title" id="scoreTitle">　</div>
                    <div class="score-content">
                        <div id="scoreBoard">　</div>
                        <div id="leadInfo" style="margin-top:12px; color: #ffb870;">　</div>
                    </div>
                </div>
                <div id="replayPanel" class="replay-panel">
                    <div class="replay-step-display" id="replayStepDisplay">0 / 0</div>
                    <div class="replay-nav">
                        <button class="replay-nav-btn" id="replayBackBtn">◀ 后退</button>
                        <button class="replay-nav-btn" id="replayForwardBtn">前进 ▶</button>
                    </div>
                    <input type="range" id="replaySlider" min="0" max="0" value="0" class="replay-slider">
                </div>
            </div>
        </div>
    </div>
    <input type="file" id="importFileInput" accept=".json" style="display:none;">

    <script src="/qi/qi.js"></script>

    <script>
        const pathMatch = window.location.pathname.match(/^\/qi\/([^/]+)\/(\d+)$/);
        if (!pathMatch) {
            alert('无效的房间链接');
            throw new Error('Invalid room URL');
        }
        const gameType = pathMatch[1];
        const roomId = pathMatch[2];

        let roomPassword = sessionStorage.getItem(`roomPassword_${roomId}`) || null;

        let BOARD_SIZE = 9;
        let PADDING = 63 - 2 * BOARD_SIZE;
        let CELL_SIZE = (600 - 2 * PADDING) / (BOARD_SIZE - 1);

        // 游戏状态
        let board = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
        let lifetimes = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
        let currentPlayer = 'black';
        let moveCount = 0;
        let nextLifetimePreview = 0;
        let gameOver = false;
        let winner = null;
        let lastMoveMarkers = [];

        let replayMode = false;
        let replaySnapshots = [];
        let replayStep = 0;
        let replayTotalSteps = 0;
        let moveLog = [];
        let liveReplaySnapshots = [];
        let liveViewStep = 0;
        let liveFollowLatest = true;
        let showMoveNumbers = false;
        let tryPlayMode = false;
        let tryPlayBaseStep = 0;
        let tryPlayBoards = [];
        let tryPlayLifetimes = [];
        let tryPlayMarkers = [];
        let tryPlayCurrentPlayer = 1;
        let tryPlayStep = 0;
        let tryPlayTotalSteps = 0;
        let tryPlayMeta = [];

        let userBoardMarks = Object.create(null);
        const BOARD_MARK_CHAR_LIST = (() => {
            const a = [];
            a.push('?', '!');
            for (let i = 0; i < 26; i++) a.push(String.fromCharCode(65 + i));
            a.push('△', '▽', '♡', '○', '◇', '□', '☆', '×', '🚩');
            return a;
        })();

        let mySlot = null;
        let slots = { black: false, white: false };
        let ws;
        let isMyTurn = false;
        let reconnectTimer = null;

        // 悬停预览
        const isMouseDevice = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
        let hoverRow = -1, hoverCol = -1;
        let isHoverValid = false;

        function mobileTwoStepPlacing() {
            return !isMouseDevice && BOARD_SIZE > 9;
        }
        function clearMobileMovePreview() {
            hoverRow = -1;
            hoverCol = -1;
            isHoverValid = false;
        }

        // DOM
        const canvas = document.getElementById('goBoard');
        const ctx = canvas.getContext('2d');
        const turnDisplay = document.getElementById('turnDisplay');
        const colorStatus = document.getElementById('colorStatus');
        const radioBlack = document.getElementById('radioBlack');
        const radioWhite = document.getElementById('radioWhite');
        const labelBlack = document.getElementById('labelBlack');
        const labelWhite = document.getElementById('labelWhite');
        const scoreTitle = document.getElementById('scoreTitle');
        const scoreBoard = document.getElementById('scoreBoard');
        const leadInfo = document.getElementById('leadInfo');
        const boardMarkSelect = document.getElementById('boardMarkSelect');

        QiSquareWeiqiCanvas.initBoardMarkSelectDom(boardMarkSelect, BOARD_MARK_CHAR_LIST);
        QiSquareWeiqiCanvas.initBoardMarkFoldDom(
            document.getElementById('boardMarkPanel'),
            document.getElementById('boardMarkFoldBtn'),
            document.getElementById('boardMarkExpandBtn')
        );

        function isUserBoardMarkVisibleAt(r, c) {
            if (typeof showEstimateActive !== 'undefined' && showEstimateActive) return false;
            if (r < 0 || r >= BOARD_SIZE || c < 0 || c >= BOARD_SIZE) return false;
            if (board[r][c] !== 0) return false;
            if ((isMouseDevice || mobileTwoStepPlacing()) && isMyTurn && !gameOver && !replayMode && isHoverValid && hoverRow === r && hoverCol === c) return false;
            if ((isMouseDevice || mobileTwoStepPlacing()) && tryPlayMode && replayMode && !gameOver && isHoverValid && hoverRow === r && hoverCol === c) return false;
            return true;
        }

        // 规则弹窗
        const modal = document.getElementById('rulesModal');
        const helpBtn = document.getElementById('helpBtn');
        const closeRulesBtn = document.getElementById('closeRulesBtn');
        helpBtn.onclick = () => modal.style.display = 'flex';
        closeRulesBtn.onclick = () => modal.style.display = 'none';
        modal.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };

        function initBoardArray(size) {
            return Array(size).fill().map(() => Array(size).fill(0));
        }

        function updateBoardGeometry() {
            PADDING = 63 - 2 * BOARD_SIZE;
            CELL_SIZE = (600 - 2 * PADDING) / (BOARD_SIZE - 1);
        }

        function getStarPoints(boardSize) {
            const stars = [];
            let cornerOffset = boardSize <= 11 ? 2 : 3;
            stars.push(
                [cornerOffset, cornerOffset],
                [cornerOffset, boardSize - 1 - cornerOffset],
                [boardSize - 1 - cornerOffset, cornerOffset],
                [boardSize - 1 - cornerOffset, boardSize - 1 - cornerOffset]
            );
            if (boardSize >= 9 && boardSize % 2 === 1) {
                const c = Math.floor(boardSize / 2);
                stars.push([c, c]);
            }
            if (boardSize >= 15 && boardSize % 2 === 1) {
                const c = Math.floor(boardSize / 2);
                const o = 3;
                stars.push([o, c], [boardSize - 1 - o, c], [c, o], [c, boardSize - 1 - o]);
            }
            return stars;
        }

        function deepCopyBoard(src) {
            return src.map(row => row.slice());
        }

        function deepCopyLifetimes(src) {
            return src.map(row => row.slice());
        }

        function _checkWinBoardRI(board, row, col, colorVal, bs) {
            const directions = [[1, 0], [0, 1], [1, 1], [1, -1]];
            for (const [dx, dy] of directions) {
                let count = 1;
                for (let step = 1; step < 5; step++) {
                    const nr = row + dx * step, nc = col + dy * step;
                    if (nr < 0 || nr >= bs || nc < 0 || nc >= bs || board[nr][nc] !== colorVal) break;
                    count++;
                }
                for (let step = 1; step < 5; step++) {
                    const nr = row - dx * step, nc = col - dy * step;
                    if (nr < 0 || nr >= bs || nc < 0 || nc >= bs || board[nr][nc] !== colorVal) break;
                    count++;
                }
                if (count >= 5) return true;
            }
            return false;
        }

        function parseRIMoveEntry(entry) {
            if (entry && typeof entry === 'object' && entry.player) {
                return {
                    player: entry.player,
                    row: entry.row,
                    col: entry.col,
                    lifetime: entry.lifetime,
                    nextPreview: entry.nextPreview != null ? entry.nextPreview : null
                };
            }
            if (typeof entry !== 'string' || entry.length < 2) return null;
            const head = entry[0];
            if (head !== 'B' && head !== 'W') return null;
            const player = head === 'B' ? 'black' : 'white';
            const parts = entry.slice(1).split(',');
            if (parts.length < 3) return null;
            const row = +parts[0];
            const col = +parts[1];
            const lifetime = +parts[2];
            const nextPv = parts.length >= 4 ? +parts[3] : null;
            if (!Number.isFinite(row) || !Number.isFinite(col) || !Number.isFinite(lifetime)) return null;
            return { player, row, col, lifetime, nextPreview: Number.isFinite(nextPv) ? nextPv : null };
        }

        function buildLiveSnapshotsFromMoveLog(moves, openingPreview, boardSize) {
            const size = boardSize;
            const snapshots = [];
            let b = initBoardArray(size);
            let lifetimes = initBoardArray(size);
            let currentPlayer = 'black';
            let moveCount = 0;
            const arr = moves || [];
            let nextPreview;
            if (arr.length > 0) {
                const m0 = parseRIMoveEntry(arr[0]);
                if (!m0) return null;
                nextPreview = m0.lifetime;
            } else {
                nextPreview = openingPreview;
            }
            let lastMoveMarkers = [];
            snapshots.push({
                board: b.map(r => r.slice()),
                lifetimes: lifetimes.map(r => r.slice()),
                currentPlayer,
                moveCount,
                nextLifetimePreview: nextPreview,
                lastMoveMarkers: [],
                gameOver: false,
                winner: null
            });
            for (let i = 0; i < arr.length; i++) {
                const m = parseRIMoveEntry(arr[i]);
                if (!m) return null;
                const slot = m.player;
                if (slot !== currentPlayer) return null;
                const lifetimePlaced = m.lifetime;
                if (lifetimePlaced !== nextPreview) return null;
                for (let r = 0; r < size; r++) {
                    for (let c = 0; c < size; c++) {
                        if (lifetimes[r][c] > 0) {
                            lifetimes[r][c]--;
                            if (lifetimes[r][c] === 0) b[r][c] = 0;
                        }
                    }
                }
                const playerVal = slot === 'black' ? 1 : 2;
                b[m.row][m.col] = playerVal;
                lifetimes[m.row][m.col] = lifetimePlaced;
                lastMoveMarkers = [{ row: m.row, col: m.col, color: playerVal }];
                let gameOver = false;
                let winner = null;
                if (_checkWinBoardRI(b, m.row, m.col, playerVal, size)) {
                    gameOver = true;
                    winner = slot;
                } else {
                    let full = true;
                    for (let r = 0; r < size && full; r++)
                        for (let c = 0; c < size; c++)
                            if (b[r][c] === 0) { full = false; break; }
                    if (full) {
                        gameOver = true;
                        winner = 'draw';
                    }
                }
                if (gameOver) {
                    snapshots.push({
                        board: b.map(r => r.slice()),
                        lifetimes: lifetimes.map(r => r.slice()),
                        currentPlayer: slot,
                        moveCount,
                        nextLifetimePreview: null,
                        lastMoveMarkers: lastMoveMarkers.map(x => ({ ...x })),
                        gameOver: true,
                        winner
                    });
                    break;
                }
                currentPlayer = currentPlayer === 'black' ? 'white' : 'black';
                moveCount++;
                if (i + 1 < arr.length) {
                    const mn = parseRIMoveEntry(arr[i + 1]);
                    if (!mn) return null;
                    nextPreview = mn.lifetime;
                } else {
                    nextPreview = m.nextPreview != null ? m.nextPreview : null;
                }
                snapshots.push({
                    board: b.map(r => r.slice()),
                    lifetimes: lifetimes.map(r => r.slice()),
                    currentPlayer,
                    moveCount,
                    nextLifetimePreview: nextPreview,
                    lastMoveMarkers: lastMoveMarkers.map(x => ({ ...x })),
                    gameOver: false,
                    winner: null
                });
            }
            return snapshots;
        }

        function computeStoneNumbersFromRISnapshots(snapshots, maxStep) {
            const nums = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
            if (!snapshots || snapshots.length < 2) return nums;
            let num = 0;
            for (let s = 1; s <= maxStep && s < snapshots.length; s++) {
                const prev = snapshots[s - 1].board;
                const cur = snapshots[s].board;
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        if (cur[r][c] !== 0 && prev[r][c] === 0) {
                            num++;
                            nums[r][c] = num;
                        }
                    }
                }
            }
            return nums;
        }

        function computeStoneNumbers() {
            if (replayMode && tryPlayMode) {
                const nums = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
                let num = 0;
                for (let s = 1; s <= tryPlayStep && s < tryPlayBoards.length; s++) {
                    const prev = tryPlayBoards[s - 1];
                    const cur = tryPlayBoards[s];
                    for (let r = 0; r < BOARD_SIZE; r++) {
                        for (let c = 0; c < BOARD_SIZE; c++) {
                            if (cur[r][c] !== 0 && prev[r][c] === 0) {
                                num++;
                                nums[r][c] = num;
                            }
                        }
                    }
                }
                return nums;
            }
            if (replayMode) {
                return computeStoneNumbersFromRISnapshots(replaySnapshots, replayStep);
            }
            if (!replayMode && liveReplaySnapshots.length && liveViewStep < liveReplaySnapshots.length - 1) {
                return computeStoneNumbersFromRISnapshots(liveReplaySnapshots, liveViewStep);
            }
            return computeStoneNumbersFromRISnapshots(liveReplaySnapshots, liveReplaySnapshots.length - 1);
        }

        function updateRadioStyles() {
            labelBlack.classList.remove('self-radio', 'opponent-radio', 'checked-disabled');
            labelWhite.classList.remove('self-radio', 'opponent-radio', 'checked-disabled');
            if (slots.black) {
                labelBlack.classList.add(mySlot === 'black' ? 'self-radio' : 'opponent-radio');
                labelBlack.classList.add('checked-disabled');
            }
            if (slots.white) {
                labelWhite.classList.add(mySlot === 'white' ? 'self-radio' : 'opponent-radio');
                labelWhite.classList.add('checked-disabled');
            }
            updateRecordButtons();
        }

        function updateRecordButtons() {
            const importBtn = document.getElementById('importBtn');
            const exportBtn = document.getElementById('exportBtn');
            if (!importBtn || !exportBtn) return;
            if (replayMode) {
                importBtn.style.display = 'none';
                exportBtn.style.display = 'none';
            } else {
                const hasAnyStone = board.some(row => row.some(v => v !== 0));
                const noPlayers = !slots.black && !slots.white;
                if (noPlayers && !hasAnyStone) {
                    importBtn.style.display = '';
                    exportBtn.style.display = 'none';
                } else {
                    importBtn.style.display = 'none';
                    exportBtn.style.display = '';
                }
            }
        }

        function syncRadioFromSlots() {
            radioBlack.disabled = slots.black;
            radioWhite.disabled = slots.white;
            radioBlack.checked = slots.black;
            radioWhite.checked = slots.white;
            updateRadioStyles();
        }

        // 绘制棋子及其寿命
        function drawPiece(row, col, x, y, radius, cellSize)
        {
            const val = board[row][col];
            if (val === 0) return;
            // 棋子阴影
            ctx.shadowBlur = 6;
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowOffsetY = 2;
            const gradient = ctx.createRadialGradient(x - 3, y - 3, radius * 0.2, x, y, radius * 1.2);
            if (val === 1) {
                gradient.addColorStop(0, '#444');
                gradient.addColorStop(0.6, '#222');
                gradient.addColorStop(1, '#111');
            } else {
                gradient.addColorStop(0, '#fff');
                gradient.addColorStop(0.5, '#eee');
                gradient.addColorStop(1, '#aaa');
            }
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, 2 * Math.PI);
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;
            if (!showMoveNumbers) {
                ctx.beginPath();
                ctx.arc(x - 3, y - 3, radius * 0.15, 0, 2 * Math.PI);
                ctx.fillStyle = val === 1 ? '#444' : '#fff';
                ctx.fill();
            }

            // 绘制剩余寿命
            const life = lifetimes[row][col];
            if (life > 0 && !showMoveNumbers)
            {
                ctx.font = `bold ${Math.max(12, Math.floor(radius * 0.7))}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const textX = x - radius * 0.4;
                const textY = y - radius * 0.4;

                let textColor;
                if (val === 1)
                    textColor = life < 5 ? '#ff4444' : '#ffffff';
                else textColor = life < 5 ? '#ff4444' : '#000000';
                ctx.fillStyle = textColor;
                ctx.shadowBlur = 0;
                ctx.fillText(life.toString(), textX, textY);

                if (life < 5) {
                    ctx.beginPath();
                    ctx.arc(x, y, radius + 1, 0, 2 * Math.PI);
                    ctx.strokeStyle = '#ff0000';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }
        }

        function drawBoard() 
        {
            const d = QiSquareWeiqiCanvas.draw;
            const cs = QiSquareWeiqiCanvas.DEFAULT_CANVAS_SIZE;
            const cellSize = CELL_SIZE;
            d.clear(ctx, cs);
            d.grid(ctx, BOARD_SIZE, PADDING, cellSize, cs);
            d.starPoints(ctx, BOARD_SIZE, PADDING, cellSize);
            d.coordLabels(ctx, BOARD_SIZE, PADDING, cellSize);
            const stoneRadius = cellSize * 0.44;
            const markLenDefault = cellSize * 0.352;
            const lowerLastMoveMarker = showMoveNumbers || showEstimateActive;
            if (lowerLastMoveMarker) {
                d.lastMoveMarkersLower(ctx, lastMoveMarkers, PADDING, cellSize, stoneRadius);
            }
            d.stonesBlackWhite(ctx, board, BOARD_SIZE, PADDING, cellSize, stoneRadius, showMoveNumbers);
            if (!lowerLastMoveMarker) {
                d.lastMoveMarkersUpper(ctx, lastMoveMarkers, PADDING, cellSize, markLenDefault);
            }
            d.userBoardMarks(ctx, userBoardMarks, BOARD_SIZE, PADDING, cellSize, isUserBoardMarkVisibleAt);
            if (showMoveNumbers) {
                const nums = computeStoneNumbers();
                d.moveNumbersOnStones(ctx, nums, board, BOARD_SIZE, PADDING, cellSize);
            }
            d.hoverPreviewStone(ctx, hoverRow, hoverCol, board, PADDING, cellSize, {
                tryPlayMode,
                tryPlayCurrentPlayer,
                gameOver,
                isMyTurn,
                mySlot,
                isHoverValid
            });
            if (showEstimateActive && cachedLiveBoard && cachedTerritory) {
                d.estimateOverlay(ctx, board, BOARD_SIZE, PADDING, cellSize, cachedLiveBoard, cachedTerritory);
            }
        }

        function updateTurn() {
            if (replayMode && tryPlayMode) {
                updateTryPlayDisplay();
                isMyTurn = !gameOver;
                drawBoard();
                return;
            }
            if (replayMode && !tryPlayMode) {
                isMyTurn = false;
                drawBoard();
                return;
            }
            const liveTotal = liveReplaySnapshots.length > 0 ? liveReplaySnapshots.length - 1 : 0;
            const browsingLive = liveReplaySnapshots.length > 0 && liveViewStep < liveTotal;
            if (browsingLive) {
                const snap = liveReplaySnapshots[liveViewStep];
                const sz = snap.board.length;
                let n = 0;
                for (let r = 0; r < sz; r++)
                    for (let c = 0; c < sz; c++)
                        if (snap.board[r][c] !== 0) n++;
                if (n === 0) {
                    turnDisplay.innerText = '初始局面';
                } else {
                    const emoji = (n % 2 === 1) ? '⚫' : '⚪';
                    turnDisplay.innerText = `${emoji} 第${n}手`;
                }
                scoreTitle.innerText = '　';
                isMyTurn = false;
                drawBoard();
                return;
            }
            if (gameOver) {
                turnDisplay.innerText = '对局结束';
                if (winner === 'black')
                    scoreTitle.innerText = '黑胜';
                else if (winner === 'white')
                    scoreTitle.innerText = '白胜';
                else if (winner === 'draw')
                    scoreTitle.innerText = '和棋';
                else
                    scoreTitle.innerText = '对局结束';
                isMyTurn = false;
                drawBoard();
                return;
            }
            let n = 0;
            for (let r = 0; r < BOARD_SIZE; r++)
                for (let c = 0; c < BOARD_SIZE; c++)
                    if (board[r][c] !== 0) n++;
            if (n === 0) {
                turnDisplay.innerText = '初始局面';
                scoreTitle.innerText = (!gameOver && nextLifetimePreview > 0) ? `下一手寿命: ${nextLifetimePreview}` : '　';
                isMyTurn = (mySlot === currentPlayer);
                const atLiveEdge = liveReplaySnapshots.length === 0 || liveViewStep >= liveReplaySnapshots.length - 1;
                if (!atLiveEdge) isMyTurn = false;
                drawBoard();
                return;
            }
            const emoji = (moveCount % 2 === 1) ? '⚫' : '⚪';
            turnDisplay.innerText = `${emoji} 第${moveCount}手`;
            isMyTurn = (mySlot === currentPlayer);
            if (!gameOver && nextLifetimePreview > 0) {
                scoreTitle.innerText = `下一手寿命: ${nextLifetimePreview}`;
            } else {
                scoreTitle.innerText = '　';
            }
            const atLiveEdge = liveReplaySnapshots.length === 0 || liveViewStep >= liveReplaySnapshots.length - 1;
            if (!atLiveEdge) isMyTurn = false;
            drawBoard();
        }

        // WebSocket
        function connectWebSocket()
        {
            const storedPassword = sessionStorage.getItem(`roomPassword_${roomId}`);
            if (storedPassword)
                roomPassword = storedPassword;

            if (reconnectTimer)
                clearTimeout(reconnectTimer);
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${location.host}/qi/ws?game=${gameType}&room=${roomId}`;
            ws = new WebSocket(wsUrl);
            ws.onopen = () => {
                ws.send(JSON.stringify({ type: 'join', password: roomPassword, requestedSlot: null }));
            };
            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                handleMessage(msg);
            };
            ws.onclose = (event) =>
            {
                console.log('WebSocket 关闭', event.code, event.reason);
                // 房间不存在（关闭码 1008，原因包含“房间不存在”）
                if (event.code === 1008 && event.reason.includes('房间不存在'))
                {
                    alert('该房间不存在。请在大厅创建房间。');
                    window.location.href = '/qi';
                    return;
                }
                colorStatus.innerText = '连接断开，重连中...';
                reconnectTimer = setTimeout(connectWebSocket, 2000);
            };
        }

        function handleMessage(msg)
        {
            switch (msg.type) {
                case 'joined':
                    sessionStorage.removeItem(`roomPassword_${roomId}`);

                    if (msg.state && msg.state.boardSize != null) {
                        const jsz = Number(msg.state.boardSize);
                        const bl = msg.state.board && msg.state.board.length;
                        const row0 = msg.state.board && msg.state.board[0];
                        const w = row0 && row0.length;
                        if (Number.isFinite(jsz) && (jsz !== Number(BOARD_SIZE) || bl !== BOARD_SIZE || w !== BOARD_SIZE)) {
                            BOARD_SIZE = jsz;
                            board = initBoardArray(BOARD_SIZE);
                            lifetimes = initBoardArray(BOARD_SIZE);
                            updateBoardGeometry();
                            const bs = document.getElementById('boardSizeSelect');
                            if (bs) bs.value = String(BOARD_SIZE);
                        }
                    }
                    if (msg.role === 'player') {
                        mySlot = msg.slot;
                        colorStatus.innerText = `已选择: ${mySlot === 'black' ? '黑方' : '白方'}`;
                        if (msg.state) syncState(msg.state);
                    }
                    else {
                        mySlot = null;
                        colorStatus.innerText = '观战';
                        if (msg.state) syncState(msg.state);
                    }
                    syncRadioFromSlots();
                    break;
                case 'slotOccupied':
                    slots[msg.slot] = true;
                    syncRadioFromSlots();
                    break;
                case 'slotReleased':
                    slots[msg.slot] = false;
                    if (mySlot === msg.slot) {
                        mySlot = null;
                        colorStatus.innerText = '观战';
                    }
                    syncRadioFromSlots();
                    break;
                case 'colorAssigned':
                    mySlot = msg.color;
                    slots[mySlot] = true;
                    colorStatus.innerText = `已选择: ${mySlot === 'black' ? '黑方' : '白方'}`;
                    syncRadioFromSlots();
                    break;
                case 'gameState':
                    syncState(msg);
                    syncRadioFromSlots();
                    break;
                case 'broadcast':
                    if (msg.action === 'move' || msg.action === 'guess' || msg.action === 'undoAccept')
                    {
                        syncState(msg);
                        if (msg.gameOver && msg.winner && !gameOver) {
                            let winnerText = msg.winner === 'black' ? '黑方' : (msg.winner === 'white' ? '白方' : '平局');
                            alert(`对局结束！${winnerText}胜`);
                        }
                    }
                    else if (msg.action === 'resign') {
                        if (!gameOver) {
                            alert(`${msg.player === 'black' ? '黑方' : '白方'} 认输，对局结束`);
                            gameOver = true;
                            winner = msg.winner;
                            updateTurn();
                        }
                    }
                    break;
                case 'gameRecord':
                    downloadRecord(msg.data);
                    break;
                case 'importSuccess':
                    exitReplayMode();
                    syncState(msg);
                    if (msg.replayData) enterReplayMode(msg.replayData);
                    syncRadioFromSlots();
                    break;
                case 'roomReset':
                    exitReplayMode();
                    syncState(msg);
                    syncRadioFromSlots();
                    break;
                case 'boardSizeChanged':
                    if (msg.boardSize != null) {
                        const bsNum = Number(msg.boardSize);
                        if (Number.isFinite(bsNum) && bsNum !== Number(BOARD_SIZE)) {
                            BOARD_SIZE = bsNum;
                            board = initBoardArray(BOARD_SIZE);
                            lifetimes = initBoardArray(BOARD_SIZE);
                            updateBoardGeometry();
                        }
                        const bs = document.getElementById('boardSizeSelect');
                        if (bs) bs.value = String(msg.boardSize);
                        updateTurn();
                    }
                    break;
                case 'newGameStarted':
                    exitReplayMode();
                    mySlot = null;
                    slots = { black: false, white: false };
                    colorStatus.innerText = '观战';
                    syncState(msg);
                    syncRadioFromSlots();
                    break;
                case 'newGameRequest':
                    if (confirm('对方请求开始新的一局，是否同意？'))
                        ws.send(JSON.stringify({ type: 'newGameResponse', accept: true }));
                    else
                        ws.send(JSON.stringify({ type: 'newGameResponse', accept: false }));
                    break;
                case 'undoRequest':
                    if (confirm('对方请求悔棋，是否同意？'))
                        ws.send(JSON.stringify({ type: 'undoResponse', accept: true }));
                    else
                        ws.send(JSON.stringify({ type: 'undoResponse', accept: false }));
                    break;
                case 'drawRequest':
                    if (confirm('对方申请和棋，是否同意？'))
                        ws.send(JSON.stringify({ type: 'drawResponse', accept: true }));
                    else
                        ws.send(JSON.stringify({ type: 'drawResponse', accept: false }));
                    break;
                case 'drawAgreed':
                    if (!gameOver) {
                        gameOver = true;
                        winner = msg.winner || 'draw';
                        alert('和棋！');
                        updateTurn();
                    }
                    break;
                case 'error':
                    if (msg.message === '密码错误')
                    {
                        sessionStorage.removeItem(`roomPassword_${roomId}`);
                        window.location.href = `/qi?game=${gameType}&room=${roomId}&needPassword=1`;
                        break;
                    }
                    alert(msg.message);
                    break;
                default:
                    console.log(msg);
            }
        }

        function syncState(state) {
            clearMobileMovePreview();
            const incomingSize = state.boardSize != null ? Number(state.boardSize) : NaN;
            const sizeNum = Number(BOARD_SIZE);
            const row0 = state.board && state.board[0];
            const lenMismatch = state.board && (
                state.board.length !== sizeNum ||
                (row0 && row0.length !== sizeNum)
            );
            const needGeometry =
                Number.isFinite(incomingSize) &&
                (incomingSize !== sizeNum || lenMismatch);
            if (needGeometry) {
                BOARD_SIZE = incomingSize;
                board = initBoardArray(BOARD_SIZE);
                lifetimes = initBoardArray(BOARD_SIZE);
                updateBoardGeometry();
                const bs = document.getElementById('boardSizeSelect');
                if (bs) bs.value = String(BOARD_SIZE);
            }
            moveLog = state.moveLog || [];
            if (state.slots) slots = state.slots;

            if (!replayMode) {
                const prevTotal = Math.max(0, liveReplaySnapshots.length - 1);
                const wasAtEnd = liveFollowLatest || liveViewStep >= prevTotal;
                const openPv = moveLog.length > 0 ? moveLog[0].previewBefore : state.nextLifetimePreview;
                let built = buildLiveSnapshotsFromMoveLog(moveLog, openPv, BOARD_SIZE);
                if (!built || !built.length)
                    built = buildLiveSnapshotsFromMoveLog([], state.nextLifetimePreview, BOARD_SIZE);
                liveReplaySnapshots = built;
                const newTotal = Math.max(0, liveReplaySnapshots.length - 1);
                if (newTotal === 0) {
                    liveViewStep = 0;
                    liveFollowLatest = true;
                } else if (wasAtEnd) {
                    liveViewStep = newTotal;
                    liveFollowLatest = true;
                } else {
                    liveViewStep = Math.min(liveViewStep, newTotal);
                    if (liveViewStep === newTotal) liveFollowLatest = true;
                }
                applyLiveSnapshotRI();
                if (liveViewStep === newTotal) {
                    board = state.board;
                    lifetimes = state.lifetimes;
                    currentPlayer = state.currentPlayer;
                    moveCount = state.moveCount;
                    nextLifetimePreview = state.nextLifetimePreview;
                    gameOver = state.gameOver;
                    winner = state.winner;
                    lastMoveMarkers = state.lastMoveMarkers || [];
                }
                updateLiveReplayPanelUIRI();
            } else {
                board = state.board;
                lifetimes = state.lifetimes;
                currentPlayer = state.currentPlayer;
                moveCount = state.moveCount;
                nextLifetimePreview = state.nextLifetimePreview;
                gameOver = state.gameOver;
                winner = state.winner;
                lastMoveMarkers = state.lastMoveMarkers || [];
            }

            const hasAnyStone = board.some(row => row.some(v => v !== 0));
            const hasPlayer = slots.black || slots.white;
            const sizeSelect = document.getElementById('boardSizeSelect');
            if (sizeSelect && !hasAnyStone && !hasPlayer && !gameOver && mySlot === null && !replayMode)
                sizeSelect.style.display = 'inline-block';
            else if (sizeSelect) sizeSelect.style.display = 'none';

            updateTurn();
            updateRecordButtons();
            updateReplayUI();
        }

        function downloadRecord(data) {
            const now = new Date();
            const pad = n => n.toString().padStart(2, '0');
            const dateStr = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
            const filename = `随机不稳定五子棋_${data.boardSize}路_${dateStr}.json`;
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function enterReplayMode(data) {
            replaySnapshots = data.snapshots || [];
            if (replaySnapshots.length === 0) return;
            replayTotalSteps = replaySnapshots.length - 1;
            replayMode = true;
            document.getElementById('replaySlider').max = replayTotalSteps;
            setReplayStep(replayTotalSteps);
            updateReplayUI();
            updateRecordButtons();
        }

        function exitReplayMode() {
            clearMobileMovePreview();
            tryPlayMode = false;
            tryPlayBoards = [];
            tryPlayLifetimes = [];
            tryPlayMarkers = [];
            tryPlayMeta = [];
            tryPlayStep = 0;
            tryPlayTotalSteps = 0;
            replayMode = false;
            replaySnapshots = [];
            replayStep = 0;
            replayTotalSteps = 0;
            updateReplayUI();
            updateRecordButtons();
        }

        function setReplayStep(step) {
            clearMobileMovePreview();
            if (step < 0) step = 0;
            if (step > replayTotalSteps) step = replayTotalSteps;
            replayStep = step;
            const snap = replaySnapshots[step];
            if (!snap) return;
            const sz = snap.board.length;
            if (sz !== BOARD_SIZE) {
                BOARD_SIZE = sz;
                updateBoardGeometry();
            }
            board = deepCopyBoard(snap.board);
            lifetimes = deepCopyLifetimes(snap.lifetimes);
            currentPlayer = snap.currentPlayer || 'black';
            moveCount = snap.moveCount != null ? snap.moveCount : 0;
            nextLifetimePreview = snap.nextLifetimePreview != null ? snap.nextLifetimePreview : 0;
            lastMoveMarkers = (snap.lastMoveMarkers || []).map(m => ({ ...m }));
            gameOver = !!snap.gameOver;
            winner = snap.winner != null ? snap.winner : null;

            document.getElementById('replaySlider').value = step;
            document.getElementById('replayStepDisplay').innerText = `${step} / ${replayTotalSteps}`;
            if (step === 0)
                turnDisplay.innerText = '初始局面';
            else
                turnDisplay.innerText = `打谱 ${step} / ${replayTotalSteps}`;
            if (gameOver) {
                if (winner === 'black') scoreTitle.innerText = '黑胜';
                else if (winner === 'white') scoreTitle.innerText = '白胜';
                else if (winner === 'draw') scoreTitle.innerText = '和棋';
                else scoreTitle.innerText = '对局结束';
            } else {
                scoreTitle.innerText = '　';
            }
            isMyTurn = false;
            drawBoard();
        }

        function updateReplayUI() {
            const hideIds = ['undoBtn', 'resignBtn', 'drawBtn'];
            const replayPanel = document.getElementById('replayPanel');
            const tryPlayBtn = document.getElementById('tryPlayBtn');
            if (replayMode) {
                hideIds.forEach(id => { const el = document.getElementById(id); if (el) el.style.display = 'none'; });
                replayPanel.style.display = '';
                tryPlayBtn.style.display = '';
                tryPlayBtn.innerText = tryPlayMode ? '试下结束' : '试下';
            } else {
                hideIds.forEach(id => { const el = document.getElementById(id); if (el) el.style.display = ''; });
                replayPanel.style.display = '';
                tryPlayBtn.style.display = 'none';
                tryPlayBtn.innerText = '试下';
            }
        }

        function checkWinLocal(brd, row, col, colorVal) {
            if (brd[row][col] !== colorVal) return false;
            const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
            for (let [dx, dy] of dirs) {
                let count = 1;
                for (let s = 1; s < 5; s++) {
                    const nr = row + dx * s, nc = col + dy * s;
                    if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE || brd[nr][nc] !== colorVal) break;
                    count++;
                }
                for (let s = 1; s < 5; s++) {
                    const nr = row - dx * s, nc = col - dy * s;
                    if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE || brd[nr][nc] !== colorVal) break;
                    count++;
                }
                if (count >= 5) return true;
            }
            return false;
        }

        function enterTryPlay() {
            clearMobileMovePreview();
            tryPlayMode = true;
            tryPlayBaseStep = replayStep;
            tryPlayBoards = [deepCopyBoard(board)];
            tryPlayLifetimes = [deepCopyLifetimes(lifetimes)];
            tryPlayMarkers = [lastMoveMarkers.map(m => ({ ...m }))];
            tryPlayMeta = [{ gameOver: false, winner: null }];
            const snap = replaySnapshots[replayStep];
            tryPlayCurrentPlayer = (snap && !snap.gameOver && snap.currentPlayer === 'white') ? 2 : 1;
            tryPlayStep = 0;
            tryPlayTotalSteps = 0;
            gameOver = false;
            winner = null;
            const slider = document.getElementById('replaySlider');
            slider.min = 0;
            slider.max = 0;
            slider.value = 0;
            updateTryPlayDisplay();
            updateReplayUI();
            updateTurn();
        }

        function exitTryPlay() {
            clearMobileMovePreview();
            tryPlayMode = false;
            tryPlayBoards = [];
            tryPlayLifetimes = [];
            tryPlayMarkers = [];
            tryPlayMeta = [];
            tryPlayStep = 0;
            tryPlayTotalSteps = 0;
            const slider = document.getElementById('replaySlider');
            slider.min = 0;
            slider.max = replayTotalSteps;
            setReplayStep(tryPlayBaseStep);
            updateReplayUI();
            updateTurn();
        }

        function tryPlayMove(row, col) {
            if (board[row][col] !== 0 || gameOver) return;
            const playerVal = tryPlayCurrentPlayer;
            board[row][col] = playerVal;
            lifetimes[row][col] = 99;
            lastMoveMarkers = [{ row, col, color: playerVal }];
            if (tryPlayStep < tryPlayTotalSteps) {
                tryPlayBoards.length = tryPlayStep + 1;
                tryPlayLifetimes.length = tryPlayStep + 1;
                tryPlayMarkers.length = tryPlayStep + 1;
                tryPlayMeta.length = tryPlayStep + 1;
            }
            let gOver = false;
            let win = null;
            if (checkWinLocal(board, row, col, playerVal)) {
                gOver = true;
                win = playerVal === 1 ? 'black' : 'white';
            } else {
                let full = true;
                for (let r = 0; r < BOARD_SIZE && full; r++)
                    for (let c = 0; c < BOARD_SIZE; c++)
                        if (board[r][c] === 0) { full = false; break; }
                if (full) {
                    gOver = true;
                    win = 'draw';
                }
            }
            tryPlayBoards.push(deepCopyBoard(board));
            tryPlayLifetimes.push(deepCopyLifetimes(lifetimes));
            tryPlayMarkers.push(lastMoveMarkers.map(m => ({ ...m })));
            tryPlayMeta.push({ gameOver: gOver, winner: win });
            gameOver = gOver;
            winner = win;
            tryPlayTotalSteps = tryPlayBoards.length - 1;
            tryPlayStep = tryPlayTotalSteps;
            tryPlayCurrentPlayer = tryPlayCurrentPlayer === 1 ? 2 : 1;
            const slider = document.getElementById('replaySlider');
            slider.max = tryPlayTotalSteps;
            slider.value = tryPlayStep;
            updateTryPlayDisplay();
            updateTurn();
            drawBoard();
        }

        function setTryPlayStep(step) {
            clearMobileMovePreview();
            if (step < 0) step = 0;
            if (step > tryPlayTotalSteps) step = tryPlayTotalSteps;
            tryPlayStep = step;
            board = deepCopyBoard(tryPlayBoards[step]);
            lifetimes = deepCopyLifetimes(tryPlayLifetimes[step]);
            lastMoveMarkers = tryPlayMarkers[step].map(m => ({ ...m }));
            const meta = tryPlayMeta[step] || { gameOver: false, winner: null };
            gameOver = meta.gameOver;
            winner = meta.winner;
            const baseSnap = replaySnapshots[tryPlayBaseStep];
            const startPl = (baseSnap && !baseSnap.gameOver && baseSnap.currentPlayer === 'white') ? 2 : 1;
            tryPlayCurrentPlayer = step % 2 === 0 ? startPl : (3 - startPl);
            moveCount = baseSnap ? baseSnap.moveCount : 0;
            nextLifetimePreview = baseSnap && baseSnap.nextLifetimePreview != null ? baseSnap.nextLifetimePreview : 0;
            document.getElementById('replaySlider').value = step;
            updateTryPlayDisplay();
            updateTurn();
            drawBoard();
        }

        function updateTryPlayDisplay() {
            if (tryPlayMode) {
                document.getElementById('replayStepDisplay').innerText = `试下 ${tryPlayStep} / ${tryPlayTotalSteps}`;
                const emoji = tryPlayCurrentPlayer === 1 ? '⚫' : '⚪';
                turnDisplay.innerText = `${emoji} 试下`;
                scoreTitle.innerText = '　';
            }
        }

        // 坐标转换
        function getClosestIntersection(x, y)
        {
            let minDist = Infinity;
            let closestRow = -1, closestCol = -1;
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const ix = PADDING + c * CELL_SIZE;
                    const iy = PADDING + r * CELL_SIZE;
                    const dist = Math.hypot(x - ix, y - iy);
                    if (dist < minDist) {
                        minDist = dist;
                        closestRow = r;
                        closestCol = c;
                    }
                }
            }
            return { row: closestRow, col: closestCol };
        }

        function canvasCoordsFromClient(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scale = 600 / rect.width;
            return { x: (clientX - rect.left) * scale, y: (clientY - rect.top) * scale };
        }

        function getSelectedBoardMark() {
            if (!boardMarkSelect) return { clear: false, ch: '?' };
            const v = boardMarkSelect.value;
            if (v === '') return { clear: true, ch: '' };
            return { clear: false, ch: v };
        }

        function applyUserBoardMark(row, col) {
            if (row < 0 || col < 0 || row >= BOARD_SIZE || col >= BOARD_SIZE) return;
            if (board[row][col] !== 0) return;
            const { clear, ch } = getSelectedBoardMark();
            const key = row + ',' + col;
            const existing = userBoardMarks[key];
            if (clear) {
                if (existing !== undefined) {
                    delete userBoardMarks[key];
                    drawBoard();
                }
                return;
            }
            if (existing === undefined) userBoardMarks[key] = ch;
            else if (existing !== ch) userBoardMarks[key] = ch;
            else delete userBoardMarks[key];
            drawBoard();
        }

        let suppressCanvasClickAfterLongMark = false;

        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            const { x, y } = canvasCoordsFromClient(e.clientX, e.clientY);
            const { row, col } = getClosestIntersection(x, y);
            applyUserBoardMark(row, col);
        });

        const LONG_MARK_MS = 500;
        const LONG_MARK_MOVE_CANCEL = 14;
        let longMarkTimer = null;
        let longMarkStart = null;

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length !== 1) return;
            const t = e.touches[0];
            longMarkStart = { x: t.clientX, y: t.clientY };
            longMarkTimer = setTimeout(() => {
                longMarkTimer = null;
                if (!longMarkStart) return;
                const { x, y } = canvasCoordsFromClient(longMarkStart.x, longMarkStart.y);
                const { row, col } = getClosestIntersection(x, y);
                applyUserBoardMark(row, col);
                suppressCanvasClickAfterLongMark = true;
                setTimeout(() => { suppressCanvasClickAfterLongMark = false; }, 450);
                longMarkStart = null;
            }, LONG_MARK_MS);
        }, { passive: true });

        canvas.addEventListener('touchmove', (e) => {
            if (!longMarkTimer || !longMarkStart || e.touches.length !== 1) return;
            const t = e.touches[0];
            const dx = t.clientX - longMarkStart.x;
            const dy = t.clientY - longMarkStart.y;
            if (dx * dx + dy * dy > LONG_MARK_MOVE_CANCEL * LONG_MARK_MOVE_CANCEL) {
                clearTimeout(longMarkTimer);
                longMarkTimer = null;
            }
        }, { passive: true });

        function clearLongMarkTouch() {
            if (longMarkTimer) {
                clearTimeout(longMarkTimer);
                longMarkTimer = null;
            }
            longMarkStart = null;
        }
        canvas.addEventListener('touchend', clearLongMarkTouch);
        canvas.addEventListener('touchcancel', clearLongMarkTouch);

        // 鼠标事件
        if (isMouseDevice) {
            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                const scale = 600 / rect.width;
                const x = (e.clientX - rect.left) * scale;
                const y = (e.clientY - rect.top) * scale;
                const { row, col } = getClosestIntersection(x, y);
                hoverRow = row;
                hoverCol = col;
                isHoverValid = (row >= 0 && col >= 0);
                drawBoard();
            });
            canvas.addEventListener('mouseleave', () => {
                isHoverValid = false;
                hoverRow = -1;
                hoverCol = -1;
                drawBoard();
            });
        }

        canvas.addEventListener('click', (e) => {
            if (suppressCanvasClickAfterLongMark) {
                e.preventDefault();
                return;
            }
            const rect = canvas.getBoundingClientRect();
            const scale = 600 / rect.width;
            const x = (e.clientX - rect.left) * scale;
            const y = (e.clientY - rect.top) * scale;
            const { row, col } = getClosestIntersection(x, y);
            const m2 = mobileTwoStepPlacing();
            if (tryPlayMode && replayMode) {
                if (row < 0 || col < 0) {
                    if (m2) { clearMobileMovePreview(); drawBoard(); }
                    return;
                }
                if (board[row][col] !== 0) return;
                if (m2) {
                    if (hoverRow === row && hoverCol === col && isHoverValid) {
                        clearMobileMovePreview();
                        tryPlayMove(row, col);
                    } else {
                        hoverRow = row;
                        hoverCol = col;
                        isHoverValid = true;
                        drawBoard();
                    }
                    return;
                }
                tryPlayMove(row, col);
                return;
            }
            if (replayMode && !tryPlayMode) return;
            const ltLive = liveReplaySnapshots.length > 0 ? liveReplaySnapshots.length - 1 : 0;
            if (!replayMode && liveReplaySnapshots.length && liveViewStep < ltLive) return;
            if (gameOver || !isMyTurn) return;
            if (row < 0 || col < 0) {
                if (m2) { clearMobileMovePreview(); drawBoard(); }
                return;
            }
            if (board[row][col] !== 0) return;
            if (m2) {
                if (hoverRow === row && hoverCol === col && isHoverValid) {
                    clearMobileMovePreview();
                    ws.send(JSON.stringify({ type: 'move', row, col }));
                    drawBoard();
                } else {
                    hoverRow = row;
                    hoverCol = col;
                    isHoverValid = true;
                    drawBoard();
                }
                return;
            }
            ws.send(JSON.stringify({ type: 'move', row, col }));
        });

        // 按钮
        document.getElementById('newGameBtn').addEventListener('click', () =>
        {
            if (replayMode) {
                ws.send(JSON.stringify({ type: 'resetRoom' }));
                return;
            }
            if (!mySlot)
            {
                alert('只有对局者可以开始新局。');
                return;
            }
            const opponentSlot = mySlot === 'black' ? 'white' : 'black';
            const hasOpponent = slots[opponentSlot];
            if (hasOpponent)
            {
                if (confirm('确定向对方申请开始新局吗？'))
                    ws.send(JSON.stringify({ type: 'requestNewGame' }));
            }
            else
            {
                if (confirm('确定开始新局吗？'))
                    ws.send(JSON.stringify({ type: 'requestNewGame' }));
            }
        });
        document.getElementById('undoBtn').addEventListener('click', () =>
        {
            if (gameOver)
                return;
            if (!mySlot)
            {
                alert('只有对局者可以悔棋。');
                return;
            }
            const opponentSlot = mySlot === 'black' ? 'white' : 'black';
            const hasOpponent = slots[opponentSlot];
            if (hasOpponent)
            {
                if (confirm('确定向对方申请悔棋吗？'))
                    ws.send(JSON.stringify({ type: 'requestUndo' }));
            }
            else
            {
                if (confirm('确定悔棋吗？'))
                    ws.send(JSON.stringify({ type: 'requestUndo' }));
            }
        });
        document.getElementById('resignBtn').addEventListener('click', () =>
        {
            if (gameOver)
                return;
            if (!mySlot)
            {
                alert('只有对局者可以认输。');
                return;
            }
            if (confirm('确定认输吗？'))
                ws.send(JSON.stringify({ type: 'resign' }));
        });
        document.getElementById('drawBtn').addEventListener('click', () =>
        {
            if (gameOver)
                return;
            if (!mySlot)
            {
                alert('只有对局者可以申请和棋。');
                return;
            }
            const opponentSlot = mySlot === 'black' ? 'white' : 'black';
            const hasOpponent = slots[opponentSlot];
            if (hasOpponent)
            {
                if (confirm('确定向对方申请和棋吗？'))
                    ws.send(JSON.stringify({ type: 'requestDraw' }));
            }
            else
            {
                if (confirm('确定和棋吗？'))
                    ws.send(JSON.stringify({ type: 'requestDraw' }));
            }
        });
        document.getElementById('tryPlayBtn').addEventListener('click', () => {
            if (tryPlayMode) exitTryPlay();
            else enterTryPlay();
        });
        document.getElementById('exportBtn').addEventListener('click', () => {
            ws.send(JSON.stringify({ type: 'exportRecord' }));
        });
        document.getElementById('importBtn').addEventListener('click', () => {
            document.getElementById('importFileInput').click();
        });
        document.getElementById('importFileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    ws.send(JSON.stringify({ type: 'importRecord', data }));
                } catch (err) {
                    alert('棋谱文件解析失败');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        });
        document.getElementById('boardSizeSelect').addEventListener('change', (e) => {
            const newSize = parseInt(e.target.value, 10);
            if (ws && ws.readyState === WebSocket.OPEN)
                ws.send(JSON.stringify({ type: 'setBoardSize', size: newSize }));
        });
        document.getElementById('replayBackBtn').addEventListener('click', () => {
            if (replayMode) {
                if (tryPlayMode) setTryPlayStep(tryPlayStep - 1);
                else setReplayStep(replayStep - 1);
            } else {
                setLiveViewStepRI(liveViewStep - 1);
            }
        });
        document.getElementById('replayForwardBtn').addEventListener('click', () => {
            if (replayMode) {
                if (tryPlayMode) setTryPlayStep(tryPlayStep + 1);
                else setReplayStep(replayStep + 1);
            } else {
                setLiveViewStepRI(liveViewStep + 1);
            }
        });
        document.getElementById('replaySlider').addEventListener('input', (e) => {
            const val = parseInt(e.target.value, 10);
            if (replayMode) {
                if (tryPlayMode) setTryPlayStep(val);
                else setReplayStep(val);
            } else {
                setLiveViewStepRI(val);
            }
        });
        document.getElementById('showNumbersCheck').addEventListener('change', (e) => {
            showMoveNumbers = e.target.checked;
            drawBoard();
        });

        document.getElementById('backToLobbyBtn').onclick = () => { window.location.href = '/qi'; };

        radioBlack.onchange = () => { if (radioBlack.checked && !radioBlack.disabled) ws.send(JSON.stringify({ type: 'selectColor', color: 'black' })); };
        radioWhite.onchange = () => { if (radioWhite.checked && !radioWhite.disabled) ws.send(JSON.stringify({ type: 'selectColor', color: 'white' })); };

        connectWebSocket();
    </script>
</body>
</html>
