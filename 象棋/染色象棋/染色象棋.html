<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
    <title>染色象棋</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
        }

        body {
            background: #2b3b5e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, sans-serif;
            padding: 10px;
        }

        .game-wrapper {
            background: #d9c8ac;
            padding: 40px;
            border-radius: 28px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.6);
            border: 2px solid #6b4a2e;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .top-panel {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            background: #8f6b4f;
            padding: 12px 20px;
            border-radius: 40px;
            color: #f9eed7;
            font-weight: bold;
            margin-bottom: 20px;
            border-bottom: 4px solid #4d2f1b;
            gap: 10px;
        }

        .left-group {
            display: flex;
            gap: 30px;
            align-items: center;
            flex-wrap: wrap;
        }

        .side-select {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .side-select label {
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .side-select input {
            transform: scale(1.2);
            margin: 0;
        }

        .color-status {
            background: #3e2e21;
            padding: 6px 16px;
            border-radius: 30px;
            color: #ffd966;
            white-space: nowrap;
        }

        .main-area {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            flex-wrap: wrap;
            justify-content: center;
        }

        .button-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 140px;
        }

        .ctrl-btn {
            background: #b88a4b;
            border: none;
            color: white;
            font-weight: bold;
            padding: 12px 8px;
            border-radius: 30px;
            font-size: 1rem;
            border-bottom: 5px solid #5e3e1e;
            cursor: pointer;
            transition: 0.08s;
            text-align: center;
        }

        .ctrl-btn:active {
            border-bottom-width: 2px;
            transform: translateY(3px);
        }

        .board-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 0 0 auto;
            width: 100%;
            max-width: 600px;
        }

        canvas {
            display: block;
            background: #deb887;
            width: 100%;
            height: auto;
            aspect-ratio: 8 / 9;
            border-radius: 4px;
            box-shadow: inset 0 0 0 1px #6b4a2e, 0 10px 15px #3a2e1e;
            max-width: 100%;
            cursor: pointer;
        }

        .right-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 320px;
        }

        .info-panel {
            background: #8f6b4f;
            padding: 20px 16px;
            border-radius: 20px;
            color: #efdfbb;
            border: 1px solid #c9a450;
            display: flex;
            flex-direction: column;
            border-bottom: 4px solid #4d2f1b;
        }

        .turn-box {
            background: #3e2e21;
            padding: 12px;
            border-radius: 50px;
            text-align: center;
            color: #ffd966;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .score-box {
            background: #3e2e21;
            padding: 14px;
            border-radius: 16px;
            line-height: 1.6;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        .score-title {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: #ffe0a3;
        }

        .score-content {
            min-height: 60px;
            font-size: 1rem;
        }

        .capture-area {
            background: #8f6b4f;
            border-radius: 16px;
            padding: 14px 14px 0px 14px;
            border-bottom: 4px solid #4d2f1b;
        }

        .capture-row {
            background: #3e2e21;
            border-radius: 24px;
            height: 80px;
            padding: 14px;
            margin-bottom: 16px;
        }

        .pieces-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: start;
            min-height: 52px;
        }

        .mini-piece {
            position: relative;
            width: 25px;
            height: 25px;
            background: #e8d2a0;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-family: "方正隶书_GBK", "楷体", "Segoe UI", sans-serif;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            border: 1px solid #c49c6a;
            transition: 0.05s linear;
        }

        .mini-piece::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            border-radius: 50%;
            border: 1px solid currentColor;
            pointer-events: none;
        }

        .mini-piece.red-text {
            color: #932c13;
        }

        .mini-piece.green-text {
            color: #1c7353;
        }

        .mini-piece.black-text {
            color: #2c2c2c;
        }

        @media (max-width: 700px) {
            .game-wrapper {
                padding: 12px;
            }

            .button-panel {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                width: 100%;
                margin: 10px 0 0;
                gap: 10px;
            }

                .button-panel .ctrl-btn {
                    width: calc(33% - 10px);
                    min-width: 100px;
                }

            .right-column {
                max-width: 100%;
            }

            .top-panel {
                padding: 10px 12px;
            }

            .mini-piece {
                width: 34px;
                height: 34px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="top-panel">
            <div class="left-group">
                <div class="side-select">
                    <label style="color: #dcb3b3;"><input type="radio" name="color" value="red" id="radioRed"> 🔴 红方</label>
                    <label style="color: #83cdc3;"><input type="radio" name="color" value="green" id="radioGreen"> 🟢 绿方</label>
                </div>
            </div>
            <div class="color-status" id="colorStatus">未选择阵营</div>
        </div>

        <div class="main-area">
            <div class="button-panel">
                <button class="ctrl-btn" id="newGameBtn">🔄 新局</button>
                <button class="ctrl-btn" id="undoBtn">↩ 悔棋</button>
                <button class="ctrl-btn" id="resignBtn">🏳 认输</button>
            </div>

            <div class="board-container">
                <canvas id="canvas" width="560" height="630"></canvas>
            </div>

            <div class="right-column">
                <div class="info-panel">
                    <div class="turn-box" id="turnDisplay">　</div>
                    <div class="score-box">
                        <div class="score-title"></div>
                        <div class="score-content" id="scoreContent">　</div>
                    </div>
                </div>

                <div class="capture-area">
                    <div class="capture-row">
                        <div id="redCapturedBox" class="pieces-container"></div>
                    </div>
                    <div class="capture-row">
                        <div id="greenCapturedBox" class="pieces-container"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 棋子类型映射 (typeKey -> 显示汉字 & 兵种分类)
        const PIECE_MAP = {
            'rk': { char: '帥', category: 'king' }, 'bk': { char: '將', category: 'king' },
            'ra': { char: '仕', category: 'advisor' }, 'ba': { char: '士', category: 'advisor' },
            're': { char: '相', category: 'elephant' }, 'be': { char: '象', category: 'elephant' },
            'rn': { char: '傌', category: 'horse' }, 'bn': { char: '馬', category: 'horse' },
            'rr': { char: '俥', category: 'rook' }, 'br': { char: '車', category: 'rook' },
            'rc': { char: '炮', category: 'cannon' }, 'bc': { char: '砲', category: 'cannon' },
            'rp': { char: '兵', category: 'pawn' }, 'bp': { char: '卒', category: 'pawn' }
        };

        // 每种兵种的上限
        const CAP_LIMITS = {
            king: 1, advisor: 2, elephant: 2, horse: 2, rook: 2, cannon: 2, pawn: 5
        };

        // 将兵种分类标准化
        function getCategory(pieceType) {
            return PIECE_MAP[pieceType]?.category || null;
        }

        // 显示顺序: 俥車傌馬炮砲相象士士兵卒帥將 (实际顺序: rook, horse, cannon, elephant, advisor, pawn, king)
        // 注意：只用于生成占领展示，红方只显示红方字符，绿方只显示绿方字符，在 buildCapturedList 中过滤
        const DISPLAY_ORDER = [
            { type: 'rr', char: '俥', cat: 'rook' }, { type: 'br', char: '車', cat: 'rook' },
            { type: 'rn', char: '傌', cat: 'horse' }, { type: 'bn', char: '馬', cat: 'horse' },
            { type: 'rc', char: '炮', cat: 'cannon' }, { type: 'bc', char: '砲', cat: 'cannon' },
            { type: 're', char: '相', cat: 'elephant' }, { type: 'be', char: '象', cat: 'elephant' },
            { type: 'ra', char: '仕', cat: 'advisor' }, { type: 'ba', char: '士', cat: 'advisor' },
            { type: 'rp', char: '兵', cat: 'pawn' }, { type: 'bp', char: '卒', cat: 'pawn' },
            { type: 'rk', char: '帥', cat: 'king' }, { type: 'bk', char: '將', cat: 'king' }
        ];

        const BOARD_W = 9, BOARD_H = 10;
        // 棋盘数据: 每个格子 { type: "rr"/"rk"等, owner: "red"/"green"/"neutral" }
        let board = Array(BOARD_H).fill().map(() => Array(BOARD_W).fill().map(() => ({ type: "", owner: null })));

        // 占领计数器: { red: { king:0, advisor:0, elephant:0, horse:0, rook:0, cannon:0, pawn:0 }, green: {...} }
        let capturedCount = {
            red: { king: 0, advisor: 0, elephant: 0, horse: 0, rook: 0, cannon: 0, pawn: 0 },
            green: { king: 0, advisor: 0, elephant: 0, horse: 0, rook: 0, cannon: 0, pawn: 0 }
        };

        let currentTurn = "red";       // red 先行
        let myColor = null;            // "red" or "green"
        let isMyTurn = false;
        let selectedRow = -1, selectedCol = -1;
        let lastMoveFrom = null, lastMoveTo = null;
        let historyStack = [];          // 存储历史快照
        let gameActive = true;
        let ws = null;

        // DOM 元素
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const turnDisplay = document.getElementById('turnDisplay');
        const colorStatus = document.getElementById('colorStatus');
        const radioRed = document.getElementById('radioRed');
        const radioGreen = document.getElementById('radioGreen');
        const redCapturedBox = document.getElementById('redCapturedBox');
        const greenCapturedBox = document.getElementById('greenCapturedBox');

        // ---------- 辅助函数 ----------
        function deepCopyBoard(src) {
            return src.map(row => row.map(cell => ({ type: cell.type, owner: cell.owner })));
        }

        function pushHistory() {
            historyStack.push({
                boardState: deepCopyBoard(board),
                turnState: currentTurn,
                lastFrom: lastMoveFrom ? { row: lastMoveFrom.row, col: lastMoveFrom.col } : null,
                lastTo: lastMoveTo ? { row: lastMoveTo.row, col: lastMoveTo.col } : null,
                capturedCount: JSON.parse(JSON.stringify(capturedCount))
            });
        }

        function popHistory() {
            if (historyStack.length === 0) return false;
            let last = historyStack.pop();
            board = deepCopyBoard(last.boardState);
            currentTurn = last.turnState;
            lastMoveFrom = last.lastFrom;
            lastMoveTo = last.lastTo;
            capturedCount = JSON.parse(JSON.stringify(last.capturedCount));
            return true;
        }

        // 获取某玩家某兵种占领数量
        function getCapturedCount(player, category) {
            return capturedCount[player]?.[category] || 0;
        }

        // 尝试增加占领计数 (移动中立棋子时调用)
        function tryAddCaptured(player, pieceType) {
            const cat = getCategory(pieceType);
            if (!cat) return false;
            const cur = getCapturedCount(player, cat);
            if (cur >= CAP_LIMITS[cat]) return false;
            capturedCount[player][cat]++;
            return true;
        }

        // 吃子时: 移除目标棋子，但不减少占领计数（已经占领过就不回收）
        function removePiece(row, col) {
            board[row][col] = { type: "", owner: null };
        }

        // 初始化棋盘 (全部中立)
        function initBoardArray() {
            for (let i = 0; i < BOARD_H; i++) {
                for (let j = 0; j < BOARD_W; j++) {
                    board[i][j] = { type: "", owner: null };
                }
            }
            // 黑方棋子 (类型黑方写法)
            board[0][0] = { type: "br", owner: "neutral" }; board[0][8] = { type: "br", owner: "neutral" };
            board[0][1] = { type: "bn", owner: "neutral" }; board[0][7] = { type: "bn", owner: "neutral" };
            board[0][2] = { type: "be", owner: "neutral" }; board[0][6] = { type: "be", owner: "neutral" };
            board[0][3] = { type: "ba", owner: "neutral" }; board[0][5] = { type: "ba", owner: "neutral" };
            board[0][4] = { type: "bk", owner: "neutral" };
            board[2][1] = { type: "bc", owner: "neutral" }; board[2][7] = { type: "bc", owner: "neutral" };
            for (let i = 0; i < 5; i++) board[3][2 * i] = { type: "bp", owner: "neutral" };
            // 红方棋子
            board[9][0] = { type: "rr", owner: "neutral" }; board[9][8] = { type: "rr", owner: "neutral" };
            board[9][1] = { type: "rn", owner: "neutral" }; board[9][7] = { type: "rn", owner: "neutral" };
            board[9][2] = { type: "re", owner: "neutral" }; board[9][6] = { type: "re", owner: "neutral" };
            board[9][3] = { type: "ra", owner: "neutral" }; board[9][5] = { type: "ra", owner: "neutral" };
            board[9][4] = { type: "rk", owner: "neutral" };
            board[7][1] = { type: "rc", owner: "neutral" }; board[7][7] = { type: "rc", owner: "neutral" };
            for (let i = 0; i < 5; i++) board[6][2 * i] = { type: "rp", owner: "neutral" };
        }

        // 重置计数器
        function resetCaptured() {
            capturedCount = {
                red: { king: 0, advisor: 0, elephant: 0, horse: 0, rook: 0, cannon: 0, pawn: 0 },
                green: { king: 0, advisor: 0, elephant: 0, horse: 0, rook: 0, cannon: 0, pawn: 0 }
            };
        }

        // ---------- 象棋基础走法判定 (与原规则一致，仅依赖棋盘类型和位置) ----------
        function isValidMoveBasic(pieceType, fromRow, fromCol, toRow, toCol, boardState) {
            const target = boardState[toRow][toCol];
            // 不能吃同色 (此处调用前已判断owner)
            const deltaRow = toRow - fromRow, deltaCol = toCol - fromCol;
            const absDRow = Math.abs(deltaRow), absDCol = Math.abs(deltaCol);
            const colorGroup = (pieceType[0] === 'r') ? 'r' : 'b'; // 用于规则中红黑阵营的九宫/过河方向
            const type = pieceType[1];

            // 将
            if (type === 'k') {
                if ((absDRow + absDCol) !== 1) return false;
                if (colorGroup === 'r') return (toRow >= 7 && toRow <= 9 && toCol >= 3 && toCol <= 5);
                else return (toRow >= 0 && toRow <= 2 && toCol >= 3 && toCol <= 5);
            }
            // 士
            if (type === 'a') {
                if (!(absDRow === 1 && absDCol === 1)) return false;
                if (colorGroup === 'r') return (toRow >= 7 && toRow <= 9 && toCol >= 3 && toCol <= 5);
                else return (toRow >= 0 && toRow <= 2 && toCol >= 3 && toCol <= 5);
            }
            // 象
            if (type === 'e') {
                if (!(absDRow === 2 && absDCol === 2)) return false;
                const midRow = (fromRow + toRow) / 2, midCol = (fromCol + toCol) / 2;
                if (boardState[midRow][midCol].type !== "") return false;
                if (colorGroup === 'r') return toRow >= 5;
                else return toRow <= 4;
            }
            // 马
            if (type === 'n') {
                if (absDRow === 2 && absDCol === 1) {
                    const legRow = fromRow + deltaRow / 2;
                    if (boardState[legRow][fromCol].type !== "") return false;
                    return true;
                } else if (absDRow === 1 && absDCol === 2) {
                    const legCol = fromCol + deltaCol / 2;
                    if (boardState[fromRow][legCol].type !== "") return false;
                    return true;
                }
                return false;
            }
            // 车
            if (type === 'r') {
                if (fromRow === toRow) {
                    let step = (toCol > fromCol) ? 1 : -1;
                    for (let c = fromCol + step; c !== toCol; c += step)
                        if (boardState[toRow][c].type !== "") return false;
                    return true;
                } else if (fromCol === toCol) {
                    let step = (toRow > fromRow) ? 1 : -1;
                    for (let r = fromRow + step; r !== toRow; r += step)
                        if (boardState[r][toCol].type !== "") return false;
                    return true;
                }
                return false;
            }
            // 炮
            if (type === 'c') {
                let cnt = 0;
                if (fromRow === toRow) {
                    let step = (toCol > fromCol) ? 1 : -1;
                    for (let c = fromCol + step; c !== toCol; c += step)
                        if (boardState[toRow][c].type !== "") cnt++;
                } else if (fromCol === toCol) {
                    let step = (toRow > fromRow) ? 1 : -1;
                    for (let r = fromRow + step; r !== toRow; r += step)
                        if (boardState[r][toCol].type !== "") cnt++;
                } else return false;
                if (target.type === "") return cnt === 0;
                else return cnt === 1;
            }
            // 兵卒
            if (type === 'p') {
                const forward = (colorGroup === 'r') ? -1 : 1;
                const isOverRiver = (colorGroup === 'r') ? (fromRow <= 4) : (fromRow >= 5);
                if (deltaRow === forward && deltaCol === 0) return true;
                if (isOverRiver && absDRow === 0 && absDCol === 1) return true;
                return false;
            }
            return false;
        }

        // 将帅照面检测
        function isFlyingKingExist(boardState) {
            let rkPos = null, bkPos = null;
            for (let i = 0; i < BOARD_H; i++) {
                for (let j = 0; j < BOARD_W; j++) {
                    const p = boardState[i][j];
                    if (p.type === "rk") rkPos = { row: i, col: j };
                    if (p.type === "bk") bkPos = { row: i, col: j };
                }
            }
            if (!rkPos || !bkPos) return false;
            if (rkPos.col !== bkPos.col) return false;
            let minRow = Math.min(rkPos.row, bkPos.row);
            let maxRow = Math.max(rkPos.row, bkPos.row);
            for (let i = minRow + 1; i < maxRow; i++) {
                if (boardState[i][rkPos.col].type !== "") return false;
            }
            return true;
        }

        // 检查某移动后是否照面
        function willCauseFlyingKing(fromRow, fromCol, toRow, toCol, pieceType, boardState) {
            let testBoard = deepCopyBoard(boardState);
            testBoard[toRow][toCol] = { type: pieceType, owner: testBoard[fromRow][fromCol].owner };
            testBoard[fromRow][fromCol] = { type: "", owner: null };
            return isFlyingKingExist(testBoard);
        }

        function isKingSafeAfterMove(boardState, playerColor)
        {
            return true;
        }

        // 移动合法性
        function canMove(fromRow, fromCol, toRow, toCol, player)
        {
            const piece = board[fromRow][fromCol];
            if (piece.type === "")
                return false;
            // 1. 只能移动自己的棋子或者中立棋子
            if (piece.owner !== player && piece.owner !== "neutral")
                return false;
            // 2. 基础走法
            if (!isValidMoveBasic(piece.type, fromRow, fromCol, toRow, toCol, board))
                return false;
            const targetPiece = board[toRow][toCol];
            // 不能吃己方
            if (targetPiece.type !== "" && targetPiece.owner === player)
                return false;
            // 3. 若移动的是中立棋子，检查占领上限
            let isOccupyingNeutral = (piece.owner === "neutral");
            if (isOccupyingNeutral)
            {
                const cat = getCategory(piece.type);
                if (cat && getCapturedCount(player, cat) >= CAP_LIMITS[cat])
                    return false;
            }
            // 4. 模拟移动，检查将帅照面和己方老将安全
            let testBoard = deepCopyBoard(board);
            let newOwner = (piece.owner === "neutral") ? player : piece.owner;
            testBoard[toRow][toCol] = { type: piece.type, owner: newOwner };
            testBoard[fromRow][fromCol] = { type: "", owner: null };
            // 照面检测
            if (isFlyingKingExist(testBoard))
                return false;
            // 检测移动后己方将/帅是否被吃或将军
            if (!isKingSafeAfterMove(testBoard, player))
                return false;
            return true;
        }

        // 执行移动 (改变全局状态)
        function applyMove(fromRow, fromCol, toRow, toCol, player) {
            if (!canMove(fromRow, fromCol, toRow, toCol, player)) return false;
            pushHistory();
            const piece = board[fromRow][fromCol];
            const targetPiece = board[toRow][toCol];
            const isNeutralMove = (piece.owner === "neutral");

            // 处理吃子 (移除目标棋子, 不改变占领计数)
            if (targetPiece.type !== "") {
                removePiece(toRow, toCol);
            }
            // 移动棋子并变更owner
            let newOwner = isNeutralMove ? player : piece.owner;
            board[toRow][toCol] = { type: piece.type, owner: newOwner };
            board[fromRow][fromCol] = { type: "", owner: null };
            // 若移动中立棋子，增加占领计数
            if (isNeutralMove) {
                const cat = getCategory(piece.type);
                if (cat) capturedCount[player][cat]++;
            }
            lastMoveFrom = { row: fromRow, col: fromCol };
            lastMoveTo = { row: toRow, col: toCol };
            // 切换回合
            currentTurn = (currentTurn === "red") ? "green" : "red";
            return true;
        }

        // 胜利/和棋判定: 只有一方将/帅存活
        function getWinnerOrDraw() {
            let hasRedKing = false, hasGreenKing = false;
            let redKingOwner = null, greenKingOwner = null;
            for (let i = 0; i < BOARD_H; i++) {
                for (let j = 0; j < BOARD_W; j++) {
                    const p = board[i][j];
                    if (p.type === "rk") { hasRedKing = true; redKingOwner = p.owner; }
                    if (p.type === "bk") { hasGreenKing = true; greenKingOwner = p.owner; }
                }
            }
            if (hasRedKing && !hasGreenKing) return { over: true, winner: redKingOwner }; // 帅存在且将无
            if (!hasRedKing && hasGreenKing) return { over: true, winner: greenKingOwner };
            if (!hasRedKing && !hasGreenKing) return { over: true, winner: "draw" };
            return { over: false };
        }

        function checkGameEnd() {
            const result = getWinnerOrDraw();
            if (result.over) {
                gameActive = false;
                if (result.winner === "draw") alert("和棋！双方将帅皆被消灭。");
                else if (result.winner === "red") alert("红方获胜！");
                else if (result.winner === "green") alert("绿方获胜！");
                return true;
            }
            return false;
        }

        // ---------- 渲染部分----------
        let cellSize, offsetX, offsetY;
        function calcGeometry() {
            const w = canvas.width, h = canvas.height;
            const margin = Math.min(w, h) * 0.06;
            const maxCellW = (w - 2 * margin) / (BOARD_W - 1);
            const maxCellH = (h - 2 * margin) / (BOARD_H - 1);
            cellSize = Math.min(maxCellW, maxCellH);
            offsetX = (w - (BOARD_W - 1) * cellSize) / 2;
            offsetY = (h - (BOARD_H - 1) * cellSize) / 2;
        }

        function toDisplayCoord(row, col) {
            if (myColor === 'green') return { row: BOARD_H - 1 - row, col: BOARD_W - 1 - col };
            return { row, col };
        }
        function toOriginalCoord(dispRow, dispCol) {
            if (myColor === 'green') return { row: BOARD_H - 1 - dispRow, col: BOARD_W - 1 - dispCol };
            return { row: dispRow, col: dispCol };
        }

        function drawBoard() {
            calcGeometry();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 1.8;
            ctx.strokeStyle = "#3a281c";

            // 绘制横线
            for (let i = 0; i < BOARD_H; i++) {
                const dispRow = (myColor === 'black') ? BOARD_H - 1 - i : i;
                const y = offsetY + dispRow * cellSize;
                ctx.beginPath();
                ctx.moveTo(offsetX, y);
                ctx.lineTo(offsetX + (BOARD_W - 1) * cellSize, y);
                ctx.stroke();
            }

            // 绘制竖线
            // 最左列
            let leftColDisp = 0;
            let leftX = offsetX + leftColDisp * cellSize;
            ctx.beginPath();
            ctx.moveTo(leftX, offsetY);
            ctx.lineTo(leftX, offsetY + (BOARD_H - 1) * cellSize);
            ctx.stroke();

            // 最右列
            let rightColDisp = BOARD_W - 1;
            let rightX = offsetX + rightColDisp * cellSize;
            ctx.beginPath();
            ctx.moveTo(rightX, offsetY);
            ctx.lineTo(rightX, offsetY + (BOARD_H - 1) * cellSize);
            ctx.stroke();

            // 中间列
            for (let dispCol = 1; dispCol <= BOARD_W - 2; dispCol++) {
                const x = offsetX + dispCol * cellSize;
                ctx.beginPath();
                ctx.moveTo(x, offsetY);
                ctx.lineTo(x, offsetY + 4 * cellSize);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x, offsetY + 5 * cellSize);
                ctx.lineTo(x, offsetY + (BOARD_H - 1) * cellSize);
                ctx.stroke();
            }

            // 楚河汉界文字
            ctx.font = `${cellSize * 0.5}px "方正隶书_GBK"`;
            ctx.fillStyle = "#5a3a1e";
            ctx.textAlign = "center";
            if (myColor === 'green') {
                ctx.fillText("楚 河", offsetX + 2 * cellSize, offsetY + 4.5 * cellSize);
                ctx.fillText("漢 界", offsetX + 6 * cellSize, offsetY + 4.5 * cellSize);
            } else {
                ctx.fillText("楚 河", offsetX + 2 * cellSize, offsetY + 4.5 * cellSize);
                ctx.fillText("漢 界", offsetX + 6 * cellSize, offsetY + 4.5 * cellSize);
            }
            // 九宫斜线
            const redPoints = [[7, 3, 9, 5], [9, 3, 7, 5]], blackPoints = [[0, 3, 2, 5], [2, 3, 0, 5]];
            function drawLineRaw(r1, c1, r2, c2) {
                const p1 = toDisplayCoord(r1, c1), p2 = toDisplayCoord(r2, c2);
                ctx.beginPath();
                ctx.moveTo(offsetX + p1.col * cellSize, offsetY + p1.row * cellSize);
                ctx.lineTo(offsetX + p2.col * cellSize, offsetY + p2.row * cellSize);
                ctx.stroke();
            }
            redPoints.forEach(p => drawLineRaw(p[0], p[1], p[2], p[3]));
            blackPoints.forEach(p => drawLineRaw(p[0], p[1], p[2], p[3]));

            // 棋子绘制
            for (let r = 0; r < BOARD_H; r++) {
                for (let c = 0; c < BOARD_W; c++) {
                    const p = board[r][c];
                    if (p.type === "") continue;
                    const disp = toDisplayCoord(r, c);
                    const x = offsetX + disp.col * cellSize, y = offsetY + disp.row * cellSize;
                    const radius = cellSize * 0.42;

                    // 设置阴影
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 6;
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = "rgba(0,0,0,0.6)";

                    // 绘制圆形棋子背景
                    ctx.beginPath();
                    ctx.arc(x, y, radius, 0, 2 * Math.PI);
                    ctx.fillStyle = "#e8d2a0";
                    ctx.fill();
                    ctx.strokeStyle = "#c49c6a";
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    // 关闭阴影，避免影响后续绘制
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 0;
                    ctx.shadowBlur = 0;

                    let ch = PIECE_MAP[p.type]?.char || "?";
                    ctx.font = `${cellSize * 0.5}px "方正隶书_GBK"`;
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    let textColor = "#2c2c2c";
                    if (p.owner === 'red')
                        textColor = "#932c13";
                    else if (p.owner === 'green')
                        textColor = "#1c7353";
                    else textColor = "#2c2c2c";
                    ctx.fillStyle = textColor;
                    ctx.fillText(ch, x, y + 1.5);
                    ctx.beginPath(); ctx.arc(x, y, radius * 0.8, 0, 2 * Math.PI);
                    ctx.strokeStyle = textColor;
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }

            // 绘制上一步移动标记
            if (lastMoveFrom && lastMoveTo) {
                const fromDisp = toDisplayCoord(lastMoveFrom.row, lastMoveFrom.col);
                const toDisp = toDisplayCoord(lastMoveTo.row, lastMoveTo.col);
                ctx.save();
                ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
                ctx.lineWidth = 2;
                const fromX = offsetX + fromDisp.col * cellSize;
                const fromY = offsetY + fromDisp.row * cellSize;
                const toX = offsetX + toDisp.col * cellSize;
                const toY = offsetY + toDisp.row * cellSize;
                const rad = cellSize * 0.45;
                ctx.beginPath();
                ctx.arc(fromX, fromY, rad, 0, 2 * Math.PI);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(toX, toY, rad, 0, 2 * Math.PI);
                ctx.stroke();
                ctx.restore();
            }

            // 选中高亮（圆形，白色边框）
            if (selectedRow !== -1 && selectedCol !== -1) {
                const piece = board[selectedRow][selectedCol];
                if (piece) {
                    const disp = toDisplayCoord(selectedRow, selectedCol);
                    ctx.save();
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
                    ctx.lineWidth = 2;
                    const x = offsetX + disp.col * cellSize;
                    const y = offsetY + disp.row * cellSize;
                    const rad = cellSize * 0.45;
                    ctx.beginPath();
                    ctx.arc(x, y, rad, 0, 2 * Math.PI);
                    ctx.stroke();
                    ctx.restore();
                }
            }
        }

        function updateCapturedUI() {
            function buildCapturedList(player, colorClass) {
                // 根据玩家筛选对应的棋子类型前缀
                const prefix = (player === 'red') ? 'r' : 'b';
                let piecesHtml = [];
                // 按顺序遍历，但只取符合前缀的 type
                for (let item of DISPLAY_ORDER) {
                    if (item.type[0] !== prefix) continue;
                    const cat = item.cat;
                    const count = capturedCount[player][cat];
                    if (count > 0) {
                        for (let i = 0; i < count; i++) {
                            piecesHtml.push(`<div class="mini-piece ${colorClass}">${item.char}</div>`);
                        }
                    }
                }
                return piecesHtml.join('');
            }
            redCapturedBox.innerHTML = buildCapturedList('red', 'red-text');
            greenCapturedBox.innerHTML = buildCapturedList('green', 'green-text');
        }

        function updateTurnUI() {
            turnDisplay.innerText = (currentTurn === 'red' ? '🔴 ' : '🟢 ') + `第${Math.floor((2 + historyStack.length) / 2) }回合`;
            isMyTurn = (myColor === currentTurn && gameActive);
            drawBoard();
            updateCapturedUI();
        }

        // ---------- 交互 ----------
        function handleCanvasClick(e) {
            if (!isMyTurn || !gameActive) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
            const canvasX = (e.clientX - rect.left) * scaleX, canvasY = (e.clientY - rect.top) * scaleY;
            let best = { row: -1, col: -1, dist: Infinity };
            for (let r = 0; r < BOARD_H; r++) {
                for (let c = 0; c < BOARD_W; c++) {
                    const disp = toDisplayCoord(r, c);
                    const cx = offsetX + disp.col * cellSize, cy = offsetY + disp.row * cellSize;
                    const d = Math.hypot(canvasX - cx, canvasY - cy);
                    if (d < cellSize * 0.5 && d < best.dist) { best = { row: r, col: c, dist: d }; }
                }
            }
            if (best.row === -1) return;
            const { row, col } = best;
            if (selectedRow === -1) {
                const piece = board[row][col];
                if (piece.type && (piece.owner === myColor || piece.owner === "neutral")) {
                    selectedRow = row; selectedCol = col; drawBoard();
                }
            } else {
                if (applyMove(selectedRow, selectedCol, row, col, myColor)) {
                    selectedRow = -1;
                    drawBoard(); updateTurnUI();
                    // 发送移动消息（不再发送 historyLen，后端会自己维护历史栈）
                    ws.send(JSON.stringify({ type: 'move', board: board, currentTurn, lastFrom: lastMoveFrom, lastTo: lastMoveTo, capturedCount }));
                    if (checkGameEnd()) gameActive = false;
                } else {
                    const piece = board[row][col];
                    if (piece.type && (piece.owner === myColor || piece.owner === "neutral")) {
                        selectedRow = row; selectedCol = col;
                    } else selectedRow = -1;
                    drawBoard();
                }
            }
        }

        // ---------- WebSocket 通信 ----------
        function connectWebSocket() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}/dyeing-xiangqi`);
            ws.onopen = () => console.log("连接成功");
            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                if (msg.type === 'init') {
                    radioRed.disabled = msg.redTaken;
                    radioGreen.disabled = msg.greenTaken;
                } else if (msg.type === 'colorAssigned') {
                    myColor = msg.color;
                    colorStatus.innerText = `已选择: ${myColor === 'red' ? '红方' : '绿方'}`;
                    if (myColor === 'red') radioRed.checked = true; else radioGreen.checked = true;
                    drawBoard(); updateTurnUI();
                } else if (msg.type === 'colorTaken') alert("阵营已被占用");
                else if (msg.type === 'gameState') {
                    board = msg.board; currentTurn = msg.currentTurn; lastMoveFrom = msg.lastFrom; lastMoveTo = msg.lastTo;
                    capturedCount = msg.capturedCount; historyStack = msg.historyStack || [];
                    gameActive = true; drawBoard(); updateTurnUI(); checkGameEnd();
                } else if (msg.type === 'broadcast') {
                    if (msg.action === 'move' || msg.action === 'undoAccept') {
                        board = msg.board; currentTurn = msg.currentTurn; lastMoveFrom = msg.lastFrom; lastMoveTo = msg.lastTo;
                        capturedCount = msg.capturedCount; historyStack = msg.historyStack;
                        drawBoard(); updateTurnUI(); checkGameEnd();
                    } else if (msg.action === 'resign') {
                        alert(`${msg.player === 'red' ? '红方' : '绿方'} 认输`);
                        gameActive = false;
                    }
                } else if (msg.type === 'newGame') {
                    initBoardArray(); resetCaptured(); currentTurn = "red"; lastMoveFrom = lastMoveTo = null; historyStack = [];
                    myColor = null; gameActive = true; radioRed.checked = false; radioGreen.checked = false;
                    colorStatus.innerText = "未选择阵营"; selectedRow = -1; drawBoard(); updateTurnUI();
                } else if (msg.type === 'undoRequest') {
                    if (confirm('对方请求悔棋，是否同意？')) ws.send(JSON.stringify({ type: 'undoResponse', accept: true }));
                    else ws.send(JSON.stringify({ type: 'undoResponse', accept: false }));
                }
            };
        }

        document.getElementById('undoBtn').onclick = () => { if (ws) ws.send(JSON.stringify({ type: 'undoRequest' })); };
        document.getElementById('resignBtn').onclick = () => { if (confirm('认输？')) ws.send(JSON.stringify({ type: 'resign', player: myColor })); };
        document.getElementById('newGameBtn').onclick = () => { if (confirm('新对局')) ws.send(JSON.stringify({ type: 'newGame' })); };
        radioRed.onchange = function () { if (this.checked && !this.disabled) ws.send(JSON.stringify({ type: 'selectColor', color: 'red' })); };
        radioGreen.onchange = function () { if (this.checked && !this.disabled) ws.send(JSON.stringify({ type: 'selectColor', color: 'green' })); };
        canvas.addEventListener('click', handleCanvasClick);
        initBoardArray(); resetCaptured(); drawBoard();
        connectWebSocket();
    </script>
</body>
