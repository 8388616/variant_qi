<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
    <title>象棋</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
        }

        body {
            background: #2b3b5e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, sans-serif;
            padding: 10px;
        }

        .game-wrapper {
            background: #d9c8ac;
            padding: 40px;
            border-radius: 28px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.6);
            border: 2px solid #6b4a2e;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .top-panel {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            background: #8f6b4f;
            padding: 12px 20px;
            border-radius: 40px;
            color: #f9eed7;
            font-weight: bold;
            margin-bottom: 20px;
            border-bottom: 4px solid #4d2f1b;
            gap: 10px;
        }

        .left-group {
            display: flex;
            gap: 30px;
            align-items: center;
            flex-wrap: wrap;
        }

        .side-select {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

            .side-select label {
                font-size: 1.1rem;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 5px;
            }

            .side-select input {
                transform: scale(1.2);
                margin: 0;
            }

        .color-status {
            background: #3e2e21;
            padding: 6px 16px;
            border-radius: 30px;
            color: #ffd966;
            white-space: nowrap;
        }

        .main-area {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            flex-wrap: wrap;
            justify-content: center;
        }

        .button-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 140px;
        }

        .ctrl-btn {
            background: #b88a4b;
            border: none;
            color: white;
            font-weight: bold;
            padding: 12px 8px;
            border-radius: 30px;
            font-size: 1rem;
            border-bottom: 5px solid #5e3e1e;
            cursor: pointer;
            transition: 0.08s;
            text-align: center;
        }

            .ctrl-btn:active {
                border-bottom-width: 2px;
                transform: translateY(3px);
            }

        .board-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 0 0 auto;
            width: 100%;
            max-width: 600px;
        }

        canvas {
            display: block;
            background: #deb887;
            width: 100%;
            height: auto;
            aspect-ratio: 8 / 9;
            border-radius: 4px;
            box-shadow: inset 0 0 0 1px #6b4a2e, 0 10px 15px #3a2e1e;
            max-width: 100%;
            cursor: pointer;
        }

        .info-panel {
            background: #8f6b4f;
            padding: 20px 16px;
            border-radius: 20px;
            color: #efdfbb;
            width: 100%;
            max-width: 280px;
            border: 1px solid #c9a450;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            border-bottom: 4px solid #4d2f1b;
        }

        .turn-box {
            background: #3e2e21;
            padding: 12px;
            border-radius: 50px;
            text-align: center;
            color: #ffd966;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .score-box {
            background: #3e2e21;
            padding: 14px;
            border-radius: 16px;
            line-height: 1.6;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        .score-title {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: #ffe0a3;
        }

        .score-content {
            min-height: 60px;
            font-size: 1rem;
        }

        @media (max-width: 700px) {
            .game-wrapper {
                padding: 12px;
            }

            .button-panel {
                display: flex;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                width: 100%;
                margin: 10px 0 0 0;
                gap: 10px;
            }

                .button-panel .ctrl-btn {
                    width: calc(33% - 10px);
                    min-width: 100px;
                }

            .info-panel {
                max-width: 100%;
                margin-top: 10px;
            }

            .top-panel {
                padding: 10px 12px;
            }

            .left-group {
                gap: 15px;
            }

            .side-select label {
                font-size: 0.95rem;
            }

            .color-status {
                white-space: normal;
                font-size: 0.9rem;
            }

            .board-container {
                max-width: 100%;
            }
        }

        .selected-piece {
            filter: drop-shadow(0 0 0 3px gold);
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="top-panel">
            <div class="left-group">
                <div class="side-select">
                    <label style="color: #ffb3b3;"><input type="radio" name="color" value="red" id="radioRed"> 🔴 红方</label>
                    <label style="color: #c0c0c0;"><input type="radio" name="color" value="black" id="radioBlack"> ⚫ 黑方</label>
                </div>
            </div>
            <div class="color-status" id="colorStatus">未选择阵营</div>
        </div>

        <div class="main-area">
            <div class="button-panel">
                <button class="ctrl-btn" id="newGameBtn">🔄 新局</button>
                <button class="ctrl-btn" id="undoBtn">↩ 悔棋</button>
                <button class="ctrl-btn" id="resignBtn">🏳 认输</button>
            </div>

            <div class="board-container">
                <canvas id="canvas" width="560" height="630"></canvas>
            </div>

            <div class="info-panel">
                <div class="turn-box" id="turnDisplay">　</div>
                <div class="score-box">
                    <div class="score-title"></div>
                    <div class="score-content" id="scoreContent">　</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ---------- 象棋常量 & 全局变量 ----------
        const BOARD_W = 9;    // 9列
        const BOARD_H = 10;   // 10行
        let board = Array(BOARD_H).fill().map(() => Array(BOARD_W).fill(""));

        // 棋子编码: 颜色+类型 红帅仕相馬俥炮兵  黑将士象車馬砲卒
        // 红: rk, ra, re, rn, rr, rc, rp  黑: bk, ba, be, bn, br, bc, bp
        let currentTurn = "red";   // red 先行
        let myColor = null;        // "red" or "black"
        let isMyTurn = false;

        let selectedRow = -1, selectedCol = -1;   // 当前选中的棋子（原始坐标）
        let lastMoveFrom = null;    // {row, col} 原始坐标
        let lastMoveTo = null;       // {row, col} 原始坐标

        let historyStack = [];       // 存储 { boardState, turnState, lastFrom, lastTo }

        let ws = null;

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const turnDisplay = document.getElementById('turnDisplay');
        const colorStatus = document.getElementById('colorStatus');
        const radioRed = document.getElementById('radioRed');
        const radioBlack = document.getElementById('radioBlack');
        const scoreContent = document.getElementById('scoreContent');

        // ---------- 辅助函数：坐标转换（原始坐标 -> 显示坐标）----------
        // 如果当前视角是黑方，则旋转180度
        function toDisplayCoord(row, col) {
            if (myColor === 'black') {
                return { row: BOARD_H - 1 - row, col: BOARD_W - 1 - col };
            } else {
                return { row: row, col: col };
            }
        }

        // 从显示坐标转换为原始坐标
        function toOriginalCoord(dispRow, dispCol) {
            if (myColor === 'black') {
                return { row: BOARD_H - 1 - dispRow, col: BOARD_W - 1 - dispCol };
            } else {
                return { row: dispRow, col: dispCol };
            }
        }

        // ---------- 初始化棋盘摆子 ----------
        function initBoardArray() {
            // 清空
            for (let i = 0; i < BOARD_H; i++) {
                for (let j = 0; j < BOARD_W; j++) {
                    board[i][j] = "";
                }
            }
            // 黑方 (0-2行)
            // 车
            board[0][0] = "br"; board[0][8] = "br";
            // 马
            board[0][1] = "bn"; board[0][7] = "bn";
            // 象
            board[0][2] = "be"; board[0][6] = "be";
            // 士
            board[0][3] = "ba"; board[0][5] = "ba";
            // 将
            board[0][4] = "bk";
            // 炮
            board[2][1] = "bc"; board[2][7] = "bc";
            // 兵
            for (let i = 0; i < 5; i++) board[3][2 * i] = "bp";

            // 红方 (9-6行)
            board[9][0] = "rr"; board[9][8] = "rr";
            board[9][1] = "rn"; board[9][7] = "rn";
            board[9][2] = "re"; board[9][6] = "re";
            board[9][3] = "ra"; board[9][5] = "ra";
            board[9][4] = "rk";
            board[7][1] = "rc"; board[7][7] = "rc";
            for (let i = 0; i < 5; i++) board[6][2 * i] = "rp";
        }

        // 深拷贝棋盘
        function copyBoard(src) {
            return src.map(row => row.slice());
        }

        // 保存历史
        function pushHistory() {
            historyStack.push({
                boardState: copyBoard(board),
                turnState: currentTurn,
                lastFrom: lastMoveFrom ? { row: lastMoveFrom.row, col: lastMoveFrom.col } : null,
                lastTo: lastMoveTo ? { row: lastMoveTo.row, col: lastMoveTo.col } : null
            });
        }

        // 悔棋恢复
        function popHistory() {
            if (historyStack.length === 0) return false;
            let last = historyStack.pop();
            board = copyBoard(last.boardState);
            currentTurn = last.turnState;
            if (last.lastFrom && last.lastTo) {
                lastMoveFrom = last.lastFrom;
                lastMoveTo = last.lastTo;
            } else {
                lastMoveFrom = null;
                lastMoveTo = null;
            }
            return true;
        }

        // ---------- 象棋核心规则 ----------
        function isValidMove(piece, fromRow, fromCol, toRow, toCol, boardState) {
            const targetPiece = boardState[toRow][toCol];
            // 不能吃自己的棋子
            if (targetPiece !== "" && targetPiece[0] === piece[0]) return false;

            const deltaRow = toRow - fromRow;
            const deltaCol = toCol - fromCol;
            const absDRow = Math.abs(deltaRow);
            const absDCol = Math.abs(deltaCol);
            const color = piece[0]; // 'r' 或 'b'
            const type = piece[1];

            // 将帅对面无遮挡检查函数
            function isFlyingKing() {
                if (piece[1] !== 'k') return false;
                // 两个将是否在同列无阻挡
                let rRow = -1, bRow = -1, col = fromCol;
                for (let i = 0; i < BOARD_H; i++) {
                    if (boardState[i][col] === "rk") rRow = i;
                    if (boardState[i][col] === "bk") bRow = i;
                }
                if (rRow !== -1 && bRow !== -1 && rRow !== bRow) {
                    let minRow = Math.min(rRow, bRow);
                    let maxRow = Math.max(rRow, bRow);
                    for (let i = minRow + 1; i < maxRow; i++) {
                        if (boardState[i][col] !== "") return false;
                    }
                    return true;
                }
                return false;
            }

            // 帅/将 九宫格移动
            if (type === 'k') {
                if ((absDRow + absDCol) !== 1) return false;
                if (color === 'r') {
                    if (!(toRow >= 7 && toRow <= 9 && toCol >= 3 && toCol <= 5)) return false;
                } else {
                    if (!(toRow >= 0 && toRow <= 2 && toCol >= 3 && toCol <= 5)) return false;
                }
                // 移动后不能导致飞将
                let newBoard = copyBoard(boardState);
                newBoard[toRow][toCol] = piece;
                newBoard[fromRow][fromCol] = "";
                let newRRow = -1, newBRow = -1;
                for (let i = 0; i < BOARD_H; i++) {
                    if (newBoard[i][toCol] === "rk") newRRow = i;
                    if (newBoard[i][toCol] === "bk") newBRow = i;
                }
                if (newRRow !== -1 && newBRow !== -1) {
                    let minR = Math.min(newRRow, newBRow);
                    let maxR = Math.max(newRRow, newBRow);
                    for (let i = minR + 1; i < maxR; i++) {
                        if (newBoard[i][toCol] !== "") return false;
                    }
                    return false; // 照面非法
                }
                return true;
            }

            // 士
            if (type === 'a') {
                if (!(absDRow === 1 && absDCol === 1)) return false;
                if (color === 'r') {
                    return (toRow >= 7 && toRow <= 9 && toCol >= 3 && toCol <= 5);
                } else {
                    return (toRow >= 0 && toRow <= 2 && toCol >= 3 && toCol <= 5);
                }
            }

            // 象
            if (type === 'e') {
                if (!(absDRow === 2 && absDCol === 2)) return false;
                const midRow = (fromRow + toRow) / 2;
                const midCol = (fromCol + toCol) / 2;
                if (boardState[midRow][midCol] !== "") return false;
                if (color === 'r') {
                    return toRow >= 5;
                } else {
                    return toRow <= 4;
                }
            }

            // 马
            if (type === 'n') {
                if (absDRow === 2 && absDCol === 1) {
                    const legRow = fromRow + (deltaRow / 2);
                    if (boardState[legRow][fromCol] !== "") return false;
                    return true;
                }
                else if (absDRow === 1 && absDCol === 2) {
                    const legCol = fromCol + (deltaCol / 2);
                    if (boardState[fromRow][legCol] !== "") return false;
                    return true;
                }
                return false;
            }

            // 车
            if (type === 'r') {
                if (fromRow === toRow) {
                    let step = (toCol > fromCol) ? 1 : -1;
                    for (let c = fromCol + step; c !== toCol; c += step) {
                        if (boardState[toRow][c] !== "") return false;
                    }
                    return true;
                }
                else if (fromCol === toCol) {
                    let step = (toRow > fromRow) ? 1 : -1;
                    for (let r = fromRow + step; r !== toRow; r += step) {
                        if (boardState[r][toCol] !== "") return false;
                    }
                    return true;
                }
                return false;
            }

            // 炮
            if (type === 'c') {
                let cnt = 0;
                if (fromRow === toRow) {
                    let step = (toCol > fromCol) ? 1 : -1;
                    for (let c = fromCol + step; c !== toCol; c += step) {
                        if (boardState[toRow][c] !== "") cnt++;
                    }
                } else if (fromCol === toCol) {
                    let step = (toRow > fromRow) ? 1 : -1;
                    for (let r = fromRow + step; r !== toRow; r += step) {
                        if (boardState[r][toCol] !== "") cnt++;
                    }
                } else return false;
                if (targetPiece === "") {
                    return cnt === 0;
                } else {
                    return cnt === 1;
                }
            }

            // 兵/卒
            if (type === 'p') {
                const forward = (color === 'r') ? -1 : 1;
                const isOverRiver = (color === 'r') ? (fromRow <= 4) : (fromRow >= 5);
                // 向前一步
                if (deltaRow === forward && deltaCol === 0) return true;
                // 过河后可以左右平移
                if (isOverRiver && absDRow === 0 && absDCol === 1) return true;
                return false;
            }
            return false;
        }

        // 检查移动后己方将是否会被吃掉 (将帅照面或者被吃)
        function isMoveSafeAfterMove(piece, fromRow, fromCol, toRow, toCol, boardState) {
            let testBoard = copyBoard(boardState);
            testBoard[toRow][toCol] = piece;
            testBoard[fromRow][fromCol] = "";
            const color = piece[0];
            const kingCode = (color === 'r') ? "rk" : "bk";
            let kingPos = null;
            for (let i = 0; i < BOARD_H; i++) {
                for (let j = 0; j < BOARD_W; j++) {
                    if (testBoard[i][j] === kingCode) {
                        kingPos = { row: i, col: j }; break;
                    }
                }
            }
            if (!kingPos) return false; // 将没了非法
            // 检查是否被任何敌方棋子攻击
            for (let i = 0; i < BOARD_H; i++) {
                for (let j = 0; j < BOARD_W; j++) {
                    let p = testBoard[i][j];
                    if (p !== "" && p[0] !== color) {
                        if (isValidMove(p, i, j, kingPos.row, kingPos.col, testBoard)) {
                            return false;
                        }
                    }
                }
            }
            // 额外检查飞将（将帅对面）
            let oppKingCode = (color === 'r') ? "bk" : "rk";
            let oppKingPos = null;
            for (let i = 0; i < BOARD_H; i++) {
                for (let j = 0; j < BOARD_W; j++) {
                    if (testBoard[i][j] === oppKingCode) {
                        oppKingPos = { row: i, col: j }; break;
                    }
                }
            }
            if (oppKingPos && kingPos.col === oppKingPos.col) {
                let minRow = Math.min(kingPos.row, oppKingPos.row);
                let maxRow = Math.max(kingPos.row, oppKingPos.row);
                let hasBlock = false;
                for (let i = minRow + 1; i < maxRow; i++) {
                    if (testBoard[i][kingPos.col] !== "") { hasBlock = true; break; }
                }
                if (!hasBlock) return false;
            }
            return true;
        }

        // 生成移动并检验全盘合法性
        function tryMove(fromRow, fromCol, toRow, toCol) {
            const piece = board[fromRow][fromCol];
            if (piece === "") return false;
            const pieceColor = piece[0];
            if (pieceColor !== currentTurn[0]) return false;
            if (!isValidMove(piece, fromRow, fromCol, toRow, toCol, board)) return false;
            if (!isMoveSafeAfterMove(piece, fromRow, fromCol, toRow, toCol, board)) return false;
            return true;
        }

        // 执行移动 (改变全局状态)
        function applyMove(fromRow, fromCol, toRow, toCol) {
            const piece = board[fromRow][fromCol];
            if (!tryMove(fromRow, fromCol, toRow, toCol)) return false;
            pushHistory();
            // 移动棋子
            board[toRow][toCol] = piece;
            board[fromRow][fromCol] = "";
            lastMoveFrom = { row: fromRow, col: fromCol };
            lastMoveTo = { row: toRow, col: toCol };
            // 切换回合
            currentTurn = (currentTurn === "red") ? "black" : "red";
            return true;
        }

        // 检查一方是否无步可走 (将死)
        function isCheckmated(color) {
            for (let i = 0; i < BOARD_H; i++) {
                for (let j = 0; j < BOARD_W; j++) {
                    let p = board[i][j];
                    if (p !== "" && p[0] === color[0]) {
                        for (let ti = 0; ti < BOARD_H; ti++) {
                            for (let tj = 0; tj < BOARD_W; tj++) {
                                if (ti === i && tj === j) continue;
                                if (isValidMove(p, i, j, ti, tj, board) && isMoveSafeAfterMove(p, i, j, ti, tj, board)) {
                                    return false;
                                }
                            }
                        }
                    }
                }
            }
            return true;
        }

        // 检查将死或认输游戏结束
        function checkGameOver(winnerColor = null) {
            if (winnerColor) {
                alert(`${winnerColor === "red" ? "红方" : "黑方"} 获胜！`);
                scoreContent.innerText = `${winnerColor === "red" ? "红方胜利" : "黑方胜利"}`;
                return true;
            }
            if (isCheckmated(currentTurn)) {
                let winner = (currentTurn === "red") ? "black" : "red";
                alert(`${winner === "red" ? "红方" : "黑方"} 将死对方，获胜！`);
                scoreContent.innerText = `${winner === "red" ? "红方胜利" : "黑方胜利"}`;
                return true;
            }
            return false;
        }

        // ---------- 绘制棋盘 & 棋子 ----------
        let cellSize;      // 正方形格子边长
        let offsetX, offsetY;

        function calcGeometry() {
            const w = canvas.width;
            const h = canvas.height;
            // 保留边距，确保边缘棋子完整显示（边距至少棋子半径）
            const margin = Math.min(w, h) * 0.06;
            // 考虑边距后最大可能的单元格边长
            const maxCellW = (w - 2 * margin) / (BOARD_W - 1);
            const maxCellH = (h - 2 * margin) / (BOARD_H - 1);
            cellSize = Math.min(maxCellW, maxCellH);
            // 计算居中偏移，使棋盘整体居中于画布
            offsetX = (w - (BOARD_W - 1) * cellSize) / 2;
            offsetY = (h - (BOARD_H - 1) * cellSize) / 2;
        }

        function drawBoard() {
            calcGeometry();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 1.8;
            ctx.strokeStyle = "#3a281c";

            // 绘制横线
            for (let i = 0; i < BOARD_H; i++) {
                const dispRow = (myColor === 'black') ? BOARD_H - 1 - i : i;
                const y = offsetY + dispRow * cellSize;
                ctx.beginPath();
                ctx.moveTo(offsetX, y);
                ctx.lineTo(offsetX + (BOARD_W - 1) * cellSize, y);
                ctx.stroke();
            }

            // 绘制竖线
            // 最左列
            let leftColDisp = 0;
            let leftX = offsetX + leftColDisp * cellSize;
            ctx.beginPath();
            ctx.moveTo(leftX, offsetY);
            ctx.lineTo(leftX, offsetY + (BOARD_H - 1) * cellSize);
            ctx.stroke();

            // 最右列
            let rightColDisp = BOARD_W - 1;
            let rightX = offsetX + rightColDisp * cellSize;
            ctx.beginPath();
            ctx.moveTo(rightX, offsetY);
            ctx.lineTo(rightX, offsetY + (BOARD_H - 1) * cellSize);
            ctx.stroke();

            // 中间列
            for (let dispCol = 1; dispCol <= BOARD_W - 2; dispCol++) {
                const x = offsetX + dispCol * cellSize;
                // 上半段（显示行 0 到 4）
                ctx.beginPath();
                ctx.moveTo(x, offsetY);
                ctx.lineTo(x, offsetY + 4 * cellSize);
                ctx.stroke();
                // 下半段（显示行 5 到 9）
                ctx.beginPath();
                ctx.moveTo(x, offsetY + 5 * cellSize);
                ctx.lineTo(x, offsetY + (BOARD_H - 1) * cellSize);
                ctx.stroke();
            }

            // 楚河汉界文字（需要根据旋转调整位置）
            ctx.font = `${cellSize * 0.5}px "方正隶书_GBK", "楷体"`;
            ctx.fillStyle = "#5a3a1e";
            ctx.textAlign = "center";
            let textX1, textX2, textY;
            if (myColor === 'black') {
                // 旋转后，楚河汉界位置也应镜像
                textX1 = offsetX + (BOARD_W - 1 - 2) * cellSize;
                textX2 = offsetX + (BOARD_W - 1 - 6) * cellSize;
                textY = offsetY + (BOARD_H - 1 - 4.5) * cellSize;
            } else {
                textX1 = offsetX + 2 * cellSize;
                textX2 = offsetX + 6 * cellSize;
                textY = offsetY + 4.5 * cellSize;
            }
            ctx.fillText("楚 河", textX1, textY);
            ctx.fillText("漢 界", textX2, textY);

            // 九宫斜线（使用显示坐标）
            // 红方九宫
            let redPalace = [
                { from: { row: 7, col: 3 }, to: { row: 9, col: 5 } },
                { from: { row: 9, col: 3 }, to: { row: 7, col: 5 } }
            ];
            let blackPalace = [
                { from: { row: 0, col: 3 }, to: { row: 2, col: 5 } },
                { from: { row: 2, col: 3 }, to: { row: 0, col: 5 } }
            ];
            function drawLine(p1, p2) {
                const disp1 = toDisplayCoord(p1.row, p1.col);
                const disp2 = toDisplayCoord(p2.row, p2.col);
                ctx.beginPath();
                ctx.moveTo(offsetX + disp1.col * cellSize, offsetY + disp1.row * cellSize);
                ctx.lineTo(offsetX + disp2.col * cellSize, offsetY + disp2.row * cellSize);
                ctx.stroke();
            }
            redPalace.forEach(p => drawLine(p.from, p.to));
            blackPalace.forEach(p => drawLine(p.from, p.to));

            // 绘制炮/兵/卒的标记（原始坐标，转换后绘制）
            const markPositions = [
                // 黑方炮
                { row: 2, col: 1 }, { row: 2, col: 7 },
                // 黑方卒
                { row: 3, col: 0 }, { row: 3, col: 2 }, { row: 3, col: 4 }, { row: 3, col: 6 }, { row: 3, col: 8 },
                // 红方炮
                { row: 7, col: 1 }, { row: 7, col: 7 },
                // 红方兵
                { row: 6, col: 0 }, { row: 6, col: 2 }, { row: 6, col: 4 }, { row: 6, col: 6 }, { row: 6, col: 8 }
            ];
            const lineColor = "#3a281c";
            ctx.save();
            ctx.strokeStyle = lineColor;
            ctx.lineWidth = 1.5;
            for (const pos of markPositions) {
                const disp = toDisplayCoord(pos.row, pos.col);
                const x = offsetX + disp.col * cellSize;
                const y = offsetY + disp.row * cellSize;
                const d = cellSize * 0.06;   // 角点偏移距离
                const len = cellSize * 0.12; // 线段长度

                ctx.beginPath();
                ctx.moveTo(x - d, y - d);
                ctx.lineTo(x - d - len, y - d);
                ctx.moveTo(x - d, y - d);
                ctx.lineTo(x - d, y - d - len);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(x + d, y - d);
                ctx.lineTo(x + d + len, y - d);
                ctx.moveTo(x + d, y - d);
                ctx.lineTo(x + d, y - d - len);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(x - d, y + d);
                ctx.lineTo(x - d - len, y + d);
                ctx.moveTo(x - d, y + d);
                ctx.lineTo(x - d, y + d + len);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(x + d, y + d);
                ctx.lineTo(x + d + len, y + d);
                ctx.moveTo(x + d, y + d);
                ctx.lineTo(x + d, y + d + len);
                ctx.stroke();
            }
            ctx.restore();

            // 绘制所有棋子
            for (let r = 0; r < BOARD_H; r++) {
                for (let c = 0; c < BOARD_W; c++) {
                    const piece = board[r][c];
                    if (piece === "") continue;
                    const disp = toDisplayCoord(r, c);
                    const x = offsetX + disp.col * cellSize;
                    const y = offsetY + disp.row * cellSize;
                    const radius = cellSize * 0.42;

                    // 设置阴影
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 6;
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = "rgba(0,0,0,0.6)";

                    // 绘制圆形棋子背景
                    ctx.beginPath();
                    ctx.arc(x, y, radius, 0, 2 * Math.PI);
                    ctx.fillStyle = "#e8d2a0";
                    ctx.fill();
                    ctx.strokeStyle = "#c49c6a";
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    // 关闭阴影，避免影响后续绘制
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 0;
                    ctx.shadowBlur = 0;

                    // 绘制汉字
                    const charMap = {
                        'rk': '帥', 'ra': '仕', 're': '相', 'rn': '傌', 'rr': '俥', 'rc': '炮', 'rp': '兵',
                        'bk': '將', 'ba': '士', 'be': '象', 'bn': '馬', 'br': '車', 'bc': '砲', 'bp': '卒'
                    };
                    let ch = charMap[piece] || "?";
                    ctx.font = `${cellSize * 0.5}px "方正隶书_GBK", "楷体"`;
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillStyle = piece[0] === 'r' ? "#932c13" : "#2c2c2c";
                    ctx.fillText(ch, x, 1.5 + y);

                    ctx.beginPath();
                    ctx.arc(x, y, radius * 0.8, 0, 2 * Math.PI);
                    ctx.strokeStyle = piece[0] === 'r' ? "#932c13" : "#2c2c2c";
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }

            // 绘制上一步移动标记
            if (lastMoveFrom && lastMoveTo) {
                const fromDisp = toDisplayCoord(lastMoveFrom.row, lastMoveFrom.col);
                const toDisp = toDisplayCoord(lastMoveTo.row, lastMoveTo.col);
                ctx.save();
                ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
                ctx.lineWidth = 2;
                const fromX = offsetX + fromDisp.col * cellSize;
                const fromY = offsetY + fromDisp.row * cellSize;
                const toX = offsetX + toDisp.col * cellSize;
                const toY = offsetY + toDisp.row * cellSize;
                const rad = cellSize * 0.45;
                ctx.beginPath();
                ctx.arc(fromX, fromY, rad, 0, 2 * Math.PI);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(toX, toY, rad, 0, 2 * Math.PI);
                ctx.stroke();
                ctx.restore();
            }

            // 选中高亮
            if (selectedRow !== -1 && selectedCol !== -1) {
                const piece = board[selectedRow][selectedCol];
                if (piece) {
                    const disp = toDisplayCoord(selectedRow, selectedCol);
                    ctx.save();
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
                    ctx.lineWidth = 2;
                    const x = offsetX + disp.col * cellSize;
                    const y = offsetY + disp.row * cellSize;
                    const rad = cellSize * 0.45;
                    ctx.beginPath();
                    ctx.arc(x, y, rad, 0, 2 * Math.PI);
                    ctx.stroke();
                    ctx.restore();
                }
            }
        }

        // 坐标转行列（像素坐标 -> 原始棋盘行列）
        function getRowColFromPx(px, py) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const canvasX = (px - rect.left) * scaleX;
            const canvasY = (py - rect.top) * scaleY;
            let minDist = Infinity;
            let bestDispRow = -1, bestDispCol = -1;
            for (let r = 0; r < BOARD_H; r++) {
                for (let c = 0; c < BOARD_W; c++) {
                    const cx = offsetX + c * cellSize;
                    const cy = offsetY + r * cellSize;
                    const dist = Math.hypot(canvasX - cx, canvasY - cy);
                    if (dist < minDist && dist < cellSize * 0.5) {
                        minDist = dist;
                        bestDispRow = r;
                        bestDispCol = c;
                    }
                }
            }
            if (bestDispRow === -1) return { row: -1, col: -1 };
            // 将显示坐标转换为原始坐标
            const original = toOriginalCoord(bestDispRow, bestDispCol);
            return original;
        }

        // 客户端移动逻辑
        function handleCanvasClick(e) {
            if (!isMyTurn) return;
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX;
            const clickY = e.clientY;
            const { row, col } = getRowColFromPx(clickX, clickY);
            if (row === -1) return;
            if (selectedRow === -1) {
                // 选中棋子
                const piece = board[row][col];
                if (piece && piece[0] === currentTurn[0]) {
                    selectedRow = row;
                    selectedCol = col;
                    drawBoard();
                }
            } else {
                // 尝试移动
                const success = tryMove(selectedRow, selectedCol, row, col);
                if (success) {
                    // 执行移动并同步服务器
                    applyMove(selectedRow, selectedCol, row, col);
                    selectedRow = -1;
                    drawBoard();
                    updateTurnUI();
                    // 发送至服务器
                    ws.send(JSON.stringify({
                        type: 'move',
                        board: board,
                        currentTurn: currentTurn,
                        lastFrom: lastMoveFrom,
                        lastTo: lastMoveTo,
                        historyLen: historyStack.length
                    }));
                    if (checkGameOver()) return;
                } else {
                    // 移动失败，检查点击的棋子是否属于当前玩家，如果是则切换选中
                    const piece = board[row][col];
                    if (piece && piece[0] === currentTurn[0]) {
                        // 切换选中到新棋子
                        selectedRow = row;
                        selectedCol = col;
                    } else {
                        // 否则清除选中
                        selectedRow = -1;
                    }
                    drawBoard();
                }
            }
        }

        function updateTurnUI() {
            turnDisplay.innerText = (currentTurn === 'red' ? '🔴 ' : '🟢 ') + `第${Math.floor((2 + historyStack.length) / 2)}回合`;
            isMyTurn = (myColor === currentTurn && gameActive);
            drawBoard();
            updateCapturedUI();
        }

        // ---------- WebSocket 通信 ----------
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/xiangqi`;
            ws = new WebSocket(wsUrl);
            ws.onopen = () => console.log('已连接对弈服务器');
            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                handleMessage(msg);
            };
            ws.onclose = () => {
                colorStatus.innerText = '连接断开，重连中...';
                setTimeout(connectWebSocket, 2000);
            };
        }

        function handleMessage(msg) {
            switch (msg.type) {
                case 'init':
                    radioRed.disabled = msg.redTaken;
                    radioBlack.disabled = msg.blackTaken;
                    break;
                case 'colorAssigned':
                    myColor = msg.color;
                    colorStatus.innerText = `已选择: ${myColor === 'red' ? '红方' : '黑方'}`;
                    if (myColor === 'red') radioRed.checked = true;
                    else radioBlack.checked = true;
                    // 重新绘制棋盘以应用新视角
                    drawBoard();
                    updateTurnUI();
                    break;
                case 'colorTaken':
                    alert("该阵营已被占用");
                    break;
                case 'gameState':
                    board = msg.board;
                    currentTurn = msg.currentTurn;
                    lastMoveFrom = msg.lastFrom;
                    lastMoveTo = msg.lastTo;
                    historyStack = msg.historyStack || [];
                    drawBoard();
                    updateTurnUI();
                    break;
                case 'broadcast':
                    if (msg.action === 'move') {
                        board = msg.board;
                        currentTurn = msg.currentTurn;
                        lastMoveFrom = msg.lastFrom;
                        lastMoveTo = msg.lastTo;
                        historyStack = msg.historyStack;
                        drawBoard();
                        updateTurnUI();
                        checkGameOver();
                    } else if (msg.action === 'undoAccept') {
                        board = msg.board;
                        currentTurn = msg.currentTurn;
                        lastMoveFrom = msg.lastFrom;
                        lastMoveTo = msg.lastTo;
                        historyStack = msg.historyStack;
                        drawBoard();
                        updateTurnUI();
                    } else if (msg.action === 'resign') {
                        alert(`${msg.player === 'red' ? '红方' : '黑方'} 认输，对局结束`);
                        scoreContent.innerText = `${msg.player === 'red' ? '黑方' : '红方'} 获胜`;
                        isMyTurn = false;
                        drawBoard();
                    }
                    break;
                case 'newGame':
                    board = msg.board;
                    currentTurn = "red";
                    lastMoveFrom = null;
                    lastMoveTo = null;
                    historyStack = [];
                    myColor = null;
                    radioRed.checked = false;
                    radioBlack.checked = false;
                    radioRed.disabled = false;
                    radioBlack.disabled = false;
                    colorStatus.innerText = "未选择阵营";
                    selectedRow = -1;
                    drawBoard();
                    updateTurnUI();
                    break;
                case 'undoRequest':
                    if (confirm('对方请求悔棋，是否同意？')) {
                        ws.send(JSON.stringify({ type: 'undoResponse', accept: true }));
                    } else {
                        ws.send(JSON.stringify({ type: 'undoResponse', accept: false }));
                    }
                    break;
            }
        }

        // 前端发送悔棋
        document.getElementById('undoBtn').addEventListener('click', () => {
            if (ws) ws.send(JSON.stringify({ type: 'undoRequest' }));
        });
        document.getElementById('resignBtn').addEventListener('click', () => {
            if (confirm('确定认输吗？')) ws.send(JSON.stringify({ type: 'resign', player: myColor }));
        });
        document.getElementById('newGameBtn').addEventListener('click', () => {
            if (confirm('开始新对局？')) ws.send(JSON.stringify({ type: 'newGame' }));
        });
        radioRed.addEventListener('change', function () {
            if (this.checked && !this.disabled) ws.send(JSON.stringify({ type: 'selectColor', color: 'red' }));
        });
        radioBlack.addEventListener('change', function () {
            if (this.checked && !this.disabled) ws.send(JSON.stringify({ type: 'selectColor', color: 'black' }));
        });

        canvas.addEventListener('click', handleCanvasClick);
        initBoardArray();
        drawBoard();

        connectWebSocket();
    </script>
</body>
</html>
